<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{% block title %}Homebeat{% endblock %} · {{ server_name }}</title>
<style>
:root {
  --bg: #f6f6f4; --card: #ffffff; --fg: #1d1d1f; --muted: #6b6b70; --line: #e2e2df;
  --accent: #2f6f5e; --accent-fg: #ffffff; --danger: #b3261e; --ok: #2e7d32; --warn: #a15c00;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121214; --card: #1c1c1f; --fg: #ececee; --muted: #9a9aa2; --line: #2e2e33;
    --accent: #6fc2a8; --accent-fg: #0d1f1a; --danger: #ff8a80; --ok: #81c784; --warn: #ffb74d;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { background: var(--card); border-bottom: 1px solid var(--line); }
header .wrap { display: flex; flex-wrap: wrap; gap: .25rem 1rem; align-items: center; padding: .6rem 1rem; }
header .brand { font-weight: 700; margin-right: auto; }
nav a { color: var(--fg); text-decoration: none; padding: .35rem .5rem; border-radius: 6px; }
nav a.on { background: var(--accent); color: var(--accent-fg); }
.wrap { max-width: 900px; margin: 0 auto; }
main.wrap { padding: 1rem; }
h1 { font-size: 1.4rem; margin: .2rem 0 1rem; }
h2 { font-size: 1.1rem; margin: 0 0 .6rem; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 1rem; margin-bottom: 1rem; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: .6rem; }
.stat { background: var(--bg); border-radius: 10px; padding: .6rem .8rem; }
.stat b { display: block; font-size: 1.35rem; }
.stat span, .muted { color: var(--muted); font-size: .9rem; }
table { width: 100%; border-collapse: collapse; }
td, th { text-align: left; padding: .45rem .3rem; border-top: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: .85rem; border-top: 0; }
.scroll { overflow-x: auto; }
code, .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: .85rem; word-break: break-all; }
button, .btn { font: inherit; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-fg);
  border-radius: 8px; padding: .45rem .9rem; cursor: pointer; text-decoration: none; display: inline-block; }
button.secondary { background: transparent; color: var(--accent); }
button.danger { background: transparent; border-color: var(--danger); color: var(--danger); }
input[type=password], input[type=text], input[type=number] { font: inherit; width: 100%; padding: .55rem .7rem; border-radius: 8px;
  border: 1px solid var(--line); background: var(--bg); color: var(--fg); margin: .4rem 0 .8rem; }
form.inline { display: inline; }
.bar { height: 10px; background: var(--bg); border-radius: 6px; overflow: hidden; margin: .4rem 0; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.ok { color: var(--ok); } .bad { color: var(--danger); } .warn { color: var(--warn); }
.error { color: var(--danger); margin: .2rem 0 .6rem; }
.actions { display: flex; flex-wrap: wrap; gap: .5rem; }
.qr { background: #fff; padding: .5rem; border-radius: 8px; width: 100%; max-width: 340px; height: auto; image-rendering: pixelated; }
.code { font-size: 1.8rem; letter-spacing: .15em; font-weight: 700; }
.sugg { display: flex; gap: 1rem; }
.sugg img { width: 96px; height: 96px; object-fit: cover; border-radius: 8px; flex: none; background: var(--bg); }
.pill { display: inline-block; font-size: .8rem; padding: .1rem .5rem; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
audio { width: 100%; margin: .4rem 0; }
@media (max-width: 520px) { .sugg { flex-direction: column; } .sugg img { width: 100%; height: auto; aspect-ratio: 1; } }
</style>
</head>
<body>
{% block header %}
<header><div class="wrap">
  <span class="brand">♫ {{ server_name }}</span>
  <nav>
    {% set p = request.url.path %}
    <a href="/admin" class="{{ 'on' if p == '/admin' }}">Dashboard</a>
    <a href="/admin/pair" class="{{ 'on' if p == '/admin/pair' }}">Pair</a>
    <a href="/admin/users" class="{{ 'on' if p == '/admin/users' }}">Users</a>
    <a href="/admin/suggestions" class="{{ 'on' if p == '/admin/suggestions' }}">Suggestions</a>
    <a href="/admin/settings" class="{{ 'on' if p == '/admin/settings' }}">Settings</a>
  </nav>
  <form class="inline" method="post" action="/admin/logout"><button class="secondary">Log out</button></form>
</div></header>
{% endblock %}
<main class="wrap">{% block content %}{% endblock %}</main>
</body>
</html>
