# nas-music server configuration. Copy to config.toml (gitignored) or /data/config.toml in Docker,
# and point NASMUSIC_CONFIG (or `nasmusic --config PATH`) at it. Relative paths are relative to this file.

library_root = "/music"            # read-only music library
data_dir = "/data"                 # database, TLS cert, Opus + art caches, AI models

lan_host = "192.168.1.50"          # the NAS's static LAN IP (cert SAN + pairing QR)
https_port = 8443                  # LAN HTTPS, self-signed cert pinned by the app
http_port = 8080                   # plain HTTP for cloudflared only; never publish this port
# bind_host = "0.0.0.0"
# http_bind_host = "127.0.0.1"     # keep port 8080 off the LAN: set this when the container uses
                                   # network_mode: host (casting) and nothing outside the NAS needs 8080
server_name = "Home NAS"           # shown in the app after pairing

# Cloudflare Tunnel + Access service token. Only ever handed to the app inside the pairing QR.
tunnel_url = ""                    # e.g. "https://music.example.com"
cf_access_client_id = ""
cf_access_client_secret = ""

# The first admin user. On a fresh install it is created with this password hash; a v1 database's
# listening history is migrated to this user. Run `nasmusic hash-password` and paste the output here.
# Other people join with invites (admin pages -> Users). Changing the hash later does not change an
# existing password: use `nasmusic user passwd <name>` or the admin pages for that.
admin_username = "admin"
admin_password_hash = ""

# Web player: built web/dist. Default: /opt/nasmusic/web (Docker image), else ../web/dist next to server/.
# web_root = "/path/to/web/dist"
# Extra CORS origins (the Tauri desktop app's origins are always allowed), e.g. a Vite dev server:
# cors_origins = ["http://localhost:5173"]

timezone = "Europe/London"         # nightly mixes run at 02:00, discovery Sunday 03:00 in this zone
opus_cache_gb = 20                 # LRU limit for transcoded Opus files
# model_version = "effnet-discogs-1"  # analysis model; "basic-1" = ffmpeg-only fallback
# lastfm_api_key = ""              # optional, used by weekly discovery and Last.fm scrobbling
# lastfm_api_secret = ""           # optional, with the key: users can connect Last.fm to scrobble. Get both
#                                  # (free) at https://www.last.fm/api/account/create; callback URL can be blank
# acoustid_api_key = ""            # optional, automatic tag fixing (Admin > Tag fixing). Free for
#                                  # non-commercial use: sign in at https://acoustid.org/new-application,
#                                  # register an application (any name/version) and paste its API key here.
# scan_interval_minutes = 5

# ---- Uploads (deploy/README.md "Uploads") ----
# A SEPARATE writable folder (never inside library_root, which stays read-only). Unset = uploading is off.
# upload_root = "/uploads"
# upload_max_file_mb = 2048        # largest single file
# upload_quota_gb = 50             # default per-user quota; 0 = unlimited (admins can change it per user)

# ---- Casting to speakers (deploy/README.md "Casting to speakers") ----
# cast_enabled = true
# cast_port = 8090                 # plain HTTP, serves ONLY signed /api/v1/cast/media|art URLs; publish on the LAN
# cast_media_url = ""              # what speakers fetch from; default http://<lan_host>:<cast_port>
# cast_discovery = true            # mDNS (Chromecast) + SSDP (DLNA): needs network_mode: host in Docker
# chromecast_hosts = ["192.168.1.40"]                         # manual Chromecast IPs (bridge networking)
# dlna_renderers = ["http://192.168.1.41:49152/description.xml"] # manual DLNA description URLs
# homeassistant_url = "http://192.168.1.10:8123"
# homeassistant_token = ""         # HA profile -> Security -> Long-lived access token. Keep it out of git.
# homeassistant_entities = ["media_player.kitchen"]           # empty = every available media_player
# snapcast_host = "192.168.1.20"   # snapserver; JSON-RPC on snapcast_control_port
# snapcast_control_port = 1705
# snapcast_stream_port = 4953      # snapserver source: tcp://0.0.0.0:4953?name=nasmusic&mode=server&sampleformat=48000:16:2
# snapcast_stream_id = "nasmusic"

# ---- Podcasts, audiobooks, internet radio (docs/podcasts-radio.md) ----
# audiobooks_root = "/audiobooks"  # a SECOND read-only mount of m4b/mp3 books (folder = book); unset = off
# podcast_poll_minutes = 60        # how often subscribed feeds are checked
# podcast_keep_last = 3            # newest N episodes per show downloaded to <data_dir>/podcasts (0 = stream only)
# podcast_storage_gb = 20          # cap for downloaded episodes (oldest go first)
# podcastindex_api_key = ""        # optional, better podcast search: free key + secret from
# podcastindex_api_secret = ""     #   https://api.podcastindex.org/signup (keep them out of git)
# podcast_itunes_search = true     # iTunes Search API for discovery (no key; only finds feed URLs)
# radio_browser_url = "https://all.api.radio-browser.info"  # community station directory

# ---- Off-site backups (deploy/docker/README.md "Backups") ----
# The database is backed up every night at 04:15 into the data folder. Set this to also copy each nightly backup
# (gzipped) somewhere else: a folder on ANOTHER disk or dataset mounted into the container, or an rclone remote
# ("name:path", configured in /data/rclone.conf). Restore from Admin > Backups, or `nasmusic restore`.
# backup_copy_to = "/backup"
# backup_keep = 14                 # nightly copies kept there
# backup_include_config = true     # also copy config.toml + the HTTPS certificate (default: yes for a folder,
#                                  # no for an rclone remote, since config.toml holds tokens)

# ---- Radio DJ voice (spoken intros between songs in AI radio and mixes; users switch it on in Settings) ----
# Needs the image built with the djvoice extra (the default). The voice downloads on first use from
# huggingface.co/rhasspy/piper-voices into <data_dir>/dj-voices (about 60 MB). Each voice has its own licence.
# dj_voice_enabled = true
# dj_voice = "en_GB-cori-medium"   # any Piper voice name, e.g. en_GB-alan-medium, en_US-ljspeech-high
# dj_voice_model = "/data/my-voice.onnx"  # or a local voice (.onnx + .onnx.json); nothing is downloaded
# dj_voice_download = true
