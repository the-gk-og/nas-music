[project]
name = "homebeat"
version = "0.1.0"
description = "Self-hosted AI-curated music server"
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "mutagen>=1.47",
    "pydantic>=2.8",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "numpy>=1.26",
    "lightgbm>=4.3",
    "qrcode[pil]>=7.4",
    "cryptography>=43",
    "pillow>=10.4",
    "pychromecast>=14",
    "async-upnp-client>=0.40",
]

[project.optional-dependencies]
# Essentia + TensorFlow models. Heavy; installed in the Docker image, optional for dev/tests.
analysis = ["essentia-tensorflow>=2.1b6.dev1110"]
# Radio DJ voice: Piper TTS (GPL-3.0-or-later, AGPL-compatible) on onnxruntime (MIT). The voice model is
# downloaded at first use, never committed.
djvoice = ["piper-tts>=1.3,<2"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pyyaml>=6",
    "ruff>=0.6",
]

[project.scripts]
homebeat = "homebeat.__main__:main"
# Old command name, so `docker exec <container> nasmusic ...` from before the Homebeat rename still works.
nasmusic = "homebeat.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["homebeat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# Pinned so a newer ruff with a wider default set doesn't turn CI red overnight: pyflakes plus the
# pycodestyle error rules. Lambda assignments and short names like `l` are house style here.
select = ["E4", "E7", "E9", "F"]
ignore = ["E731", "E741"]
