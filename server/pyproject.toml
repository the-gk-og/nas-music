[project]
name = "nasmusic"
version = "0.1.0"
description = "Self-hosted AI-curated music server"
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "mutagen>=1.47",
    "pydantic>=2.8",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "numpy>=1.26",
    "lightgbm>=4.3",
    "qrcode[pil]>=7.4",
    "cryptography>=43",
    "pillow>=10.4",
    "pychromecast>=14",
    "async-upnp-client>=0.40",
]

[project.optional-dependencies]
# Essentia + TensorFlow models. Heavy; installed in the Docker image, optional for dev/tests.
analysis = ["essentia-tensorflow>=2.1b6.dev1110"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
nasmusic = "nasmusic.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nasmusic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
