name: android

# Two flavours (CLAUDE.md): `foss` (no Google code; casting via the server) and `full` (adds the Google
# Cast SDK). Every run checks that the foss APK contains no Google Play Services classes, and that the check
# does find them in the full APK (so it can't silently stop working).
# Pull requests: build both debug APKs and the watch app + unit tests.
# Pushes to main that touch the app: both APKs signed with the permanent release key (GitHub secrets),
# version 0.1.<run number>, published as one GitHub Release:
#   homebeat-foss-v0.1.N.apk, homebeat-full-v0.1.N.apk

on:
  push:
    branches: [main]
    paths: ['android/**', 'api/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'api/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write   # create releases

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      # Version = run number + 10. Builds 0.1.8 and 0.1.9 were signed locally and installed by hand,
      # so CI must stay above them or Android refuses the update as a downgrade.
      - uses: actions/checkout@v4
      - name: Version code
        working-directory: .
        run: echo "VERSION_CODE=$((GITHUB_RUN_NUMBER + 10))" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # ubuntu-latest ships the Android SDK (ANDROID_HOME); AGP downloads any missing platform itself.
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testFossDebugUnitTest testFullDebugUnitTest :wear:testDebugUnitTest

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/tests/
            android/wear/build/reports/tests/

      - name: Decode signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          ./gradlew assembleFossRelease assembleFullRelease :wear:assembleRelease
          mv app/build/outputs/apk/foss/release/app-foss-release.apk "homebeat-foss-v0.1.${VERSION_CODE}.apk"
          mv app/build/outputs/apk/full/release/app-full-release.apk "homebeat-full-v0.1.${VERSION_CODE}.apk"
          mv wear/build/outputs/apk/release/wear-release.apk "homebeat-wear-v0.1.${VERSION_CODE}.apk"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Build debug APKs (pull requests)
        if: github.event_name == 'pull_request'
        run: |
          ./gradlew assembleFossDebug assembleFullDebug :wear:assembleDebug
          mv app/build/outputs/apk/foss/debug/app-foss-debug.apk "homebeat-foss-v0.1.${VERSION_CODE}.apk"
          mv app/build/outputs/apk/full/debug/app-full-debug.apk "homebeat-full-v0.1.${VERSION_CODE}.apk"

      - name: FOSS APK has no Google Play Services code
        run: |
          scripts/check-no-gms.sh "homebeat-foss-v0.1.${VERSION_CODE}.apk"
          scripts/check-no-gms.sh --expect-gms "homebeat-full-v0.1.${VERSION_CODE}.apk"

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v0.1.${VERSION_CODE}"
          gh release create "$tag" "homebeat-foss-${tag}.apk" "homebeat-full-${tag}.apk" "homebeat-wear-${tag}.apk" \
            --target "${{ github.sha }}" \
            --title "Homebeat ${tag}" \
            --notes "Android app build ${tag} from ${GITHUB_SHA::7}. Installs as an update over any earlier release.
          homebeat-foss: no Google code; cast to speakers through the server (Devices list).
          homebeat-full: also has a Google Cast button (needs Google Play Services on the phone).
          homebeat-wear: the Wear OS watch app." \
            --latest
