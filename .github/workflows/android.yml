name: android

# Pull requests: build + unit tests only.
# Pushes to main that touch the app: build an APK signed with the permanent release key
# (GitHub secrets), version 0.1.<run number>, and publish it as a GitHub Release.

on:
  push:
    branches: [main]
    paths: ['android/**', 'api/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'api/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write   # create releases

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      # Version = run number + 10. Builds 0.1.8 and 0.1.9 were signed locally and installed by hand,
      # so CI must stay above them or Android refuses the update as a downgrade.
      - name: Version code
        run: echo "VERSION_CODE=$((GITHUB_RUN_NUMBER + 10))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # ubuntu-latest ships the Android SDK (ANDROID_HOME); AGP downloads any missing platform itself.
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-reports
          path: android/app/build/reports/tests/

      - name: Decode signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          ./gradlew assembleRelease
          mv app/build/outputs/apk/release/app-release.apk "nas-music-v0.1.${VERSION_CODE}.apk"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Build debug APK (pull requests)
        if: github.event_name == 'pull_request'
        run: ./gradlew assembleDebug

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v0.1.${VERSION_CODE}"
          gh release create "$tag" "nas-music-${tag}.apk" \
            --target "${{ github.sha }}" \
            --title "nas-music ${tag}" \
            --notes "Android app build ${tag} from ${GITHUB_SHA::7}. Installs as an update over any earlier release." \
            --latest
