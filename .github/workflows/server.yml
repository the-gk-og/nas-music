name: server

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['server/**', 'web/**', 'api/**', '.github/workflows/server.yml']
  pull_request:
    paths: ['server/**', 'web/**', 'api/**', '.github/workflows/server.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# A new push to a pull request cancels its older run; main and tags always finish (they publish the image).
concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/nasmusic

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - run: uv sync --frozen
      - name: Lint (ruff)
        run: uv run ruff check --output-format=github .
      # Includes the API contract (tests/test_openapi_contract.py: api/openapi.yaml vs the served routes) and
      # the migration chain (tests/test_migration_chain.py: every old schema up to the current one).
      - name: Test
        run: uv run pytest -q --durations=15 --junitxml=pytest-report.xml
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: server-test-report
          path: server/pytest-report.xml
          retention-days: 14

  image:
    # Build the image on every PR (no push) to catch Dockerfile breakage; publish from main and tags.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .                  # repo root: the image also builds web/ (the web player)
          file: server/Dockerfile
          platforms: linux/amd64
          build-args: WITH_ANALYSIS=1
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the image
        if: github.event_name != 'pull_request'
        run: |
          docker run --rm --entrypoint python ${{ fromJSON(steps.meta.outputs.json).tags[0] }} \
            -c "import nasmusic, essentia, piper; print('nasmusic + essentia + piper import ok')"
