name: desktop

# Tauri v2 desktop app on Linux (AppImage + deb), Windows (NSIS + MSI) and macOS (dmg, universal).
# Pushes to main: version 0.1.<run number>, bundles attached to the GitHub Release desktop-v0.1.<run number>.
# Bundles are unsigned (no code-signing certificates); see desktop/README.md.

on:
  push:
    branches: [main]
    paths: ['desktop/**', 'web/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: write   # create releases

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION: 0.1.${{ github.run_number }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: '--bundles appimage,deb'
          - os: windows-latest
            args: '--bundles nsis,msi'
          - os: macos-latest
            args: '--target universal-apple-darwin --bundles dmg'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # ubuntu-22.04 runners preinstall libunwind-14-dev, which conflicts with libgstreamer1.0-dev's libunwind-dev
          sudo apt-get remove -y libunwind-14-dev || true
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install web + desktop dependencies
        run: |
          npm ci --prefix web
          npm ci --prefix desktop

      - name: Build
        working-directory: desktop
        shell: bash
        run: npx tauri build ${{ matrix.args }} --config "{\"version\":\"${VERSION}\"}"

      - name: Collect bundles
        shell: bash
        run: |
          mkdir -p out
          find desktop/src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name '*.AppImage' -o -name '*.deb' -o -name '*.msi' -o -name '*-setup.exe' -o -name '*.dmg' \) \
            -exec cp {} out/ \;
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: out/*
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="desktop-v${VERSION}"
          ls -la dist
          gh release create "$tag" dist/* \
            --target "${{ github.sha }}" \
            --title "nas-music desktop v${VERSION}" \
            --notes "Desktop app v${VERSION} from ${GITHUB_SHA::7}: Linux AppImage/deb, Windows installer (NSIS/MSI), macOS dmg (universal). Unsigned builds." \
            --latest=false
