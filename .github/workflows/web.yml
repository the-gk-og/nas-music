name: web

# Lint (eslint + svelte-check), unit tests (Vitest) and production build of the web player.

on:
  push:
    branches: [main]
    paths: ['web/**', 'api/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', 'api/**', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      # Includes src/lib/api/contract.test.ts: every request the web client sends must be in api/openapi.yaml.
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
          retention-days: 14
