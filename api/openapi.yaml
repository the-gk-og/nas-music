openapi: 3.1.0
info:
  title: nas-music API
  version: 0.8.2
  description: |
    Contract between the nas-music server and its clients (Android app, web player, desktop app). All paths
    are under /api/v1. v2 (docs/v2.md): multi-user and invite-only; everything about listening is per user.
    Auth: `Authorization: Bearer <deviceToken>` on every endpoint except /health, /server-info, /auth/login,
    /auth/register and /pair. The web player may instead rely on the httpOnly `nm_session` cookie (same token)
    set by login/register with `"cookie": true`. Cross-origin requests (Tauri desktop app) must use the bearer
    header; CORS allows `tauri://localhost` and `http(s)://tauri.localhost` without credentials.
    Errors are `{"detail": "..."}` with a 4xx/5xx status. A disabled user's tokens get 401.
    0.8.2 (no schema change): radio DJ voice. GET /dj/status, POST /dj/intro and /stream/dj/{clipId}: optional
    spoken intros (Piper TTS on the server) before songs in AI radio and mixes; user settings `dj.voice`
    (bool, default false) and `dj.every` (1-10, default 3).
    0.8.1 (no schema change): synced lyric lines may carry `words` (word-by-word timings from enhanced LRC)
    for karaoke-style highlighting. Optional and additive; clients that ignore it keep line-level sync.
    0.8.0 (schema v8): resume and Continue listening. (1) Podcast episodes, audiobooks and internet radio play
    through the same player and Connect as music: PlaybackState gains `media` ({kind: episode|book|station, id};
    queueId/trackId are then null and positionMs is the book-wide position), and Connect gains the command
    `playSpoken {kind, id, positionMs?}`. Speakers play them too. The server stores the resume point of a
    `media` episode/book from the Connect state (as well as clients writing /spoken/progress). Spoken items are
    still not music: no /events, no scrobbling, never in queues/playlists/recommender/Wrapped. (2) Resume: the
    Connect command `playQueue` WITHOUT `index` resumes the queue where it was left — the server fills in the
    queue's saved `index` and `positionMs` before relaying it (players start that track at that position); with
    an `index` it starts that track from the top. Saving Connect state also updates the queue's
    currentIndex/positionMs/updatedAt. (3) GET /continue: one list (ShelfItems of type queue, episode, book with
    `progress` and `updatedAt`) of music queues left part-way and episodes/books in progress, newest first;
    DELETE /continue/{type}/{id} dismisses one until it is played again. Home's `continue_listening` shelf is the
    same list, so it can now hold `episode` and `book` items too.
    0.7.0 (schema v7): smart playlists (/smart-playlists/*: rule-based, per user, evaluated and cached on the
    server, family-mode filtered; pinnable as `smart_playlist`, usable as a queue source and as a radio seed
    `{"type": "smart_playlist", "id"}`) and artist pages (/library/artists/{id}/page|info|tracks,
    /art/artist/{id}: photo from Wikimedia Commons with licence + attribution, bio from Wikipedia, genres,
    years active and links from MusicBrainz/Wikidata, top songs, albums/singles, appears-on, similar artists).
    Artist ShelfItems use the artist photo as `artUrl` when there is one.
    0.7.0 (schema v7): scrobbling and "new music added" notifications. The server scrobbles each user's
    qualifying play/skip events (track >= 30 s, played >= half or 4 min) to ListenBrainz and/or Last.fm
    (/me/scrobble*, opt-in; a device opts out with the setting `device.<deviceId>.scrobble: false`), and sends
    "now playing" from the Connect state. Optional ListenBrainz history import adds events marked as imported
    (removable). After each library scan, users with the setting `notify.newMusic: true` get ONE batched
    notification (/me/notifications), pushed over Connect as `{"type": "notification", "notification":
    Notification}`; clients without a socket poll `GET /me/notifications?since=`. GET /library/new = "New this week".
    0.7.0 (schema v7): spoken word and live audio, tag `spoken` - podcasts (/podcasts*, subscribe by RSS URL or
    directory search; the server polls feeds, may keep the newest episodes downloaded, and streams or proxies
    them at /stream/episode/{id}), audiobooks (/audiobooks*, from the optional read-only `audiobooks_root`;
    parts at /stream/book/{id}/{part}, book-wide positions, chapters, bookmarks), internet radio (/stations*,
    Radio Browser search, live stream proxied at /stream/station/{id} with ICY metadata removed,
    /stations/{id}/now-playing). Resume positions: /spoken/progress (newest `updatedAt` wins, per user, all
    devices) and /spoken/continue. Covers at /art/podcast|book|station/{id}. Casting: POST /cast/sign-spoken.
    None of this is music: clients must NOT send /events, scrobble, or add these to queues/playlists, and the
    recommender, Wrapped and Last.fm never see them. Family mode hides shows/episodes/stations flagged explicit.
    0.7.0 (schema v7): DJ automix. A background job (`automix`, chained after `analyse` and nightly) measures
    each track's beat grid, Camelot key, mix-in/mix-out points and energy; Track gains `mix` (TrackMix) once
    analysed. POST /automix/order reorders a list for smooth flow (tempo incl. half/double time, key, energy
    arc) without moving any track more than `window` places; POST /radio and /radio/{queueId}/more take
    `automix: true` to order radio batches the same way. GET /tracks/{trackId}/mix adds the energy curve.
    Clients do the transitions themselves (see TrackMix); casting to speakers uses normal gapless/crossfade.
    0.6.0 (schema v6): explicit-content flags and family mode. Track gains `explicit`
    (explicit|probable|clean|unknown; show an "E" badge for explicit) and, in queues/playlists only,
    `familyHidden`; Album gains `explicit` (contains explicit tracks). With family mode on, the server hides
    the tracks the user's policy hides from browse/search/smart lists/mixes/Home/radio/sync manifest, drops
    them from new queues and queue adds, flags them `familyHidden` where they already are (clients skip them),
    and, when an admin has LOCKED family mode, refuses /stream and cast links for them (403). Connect pushes
    `{"type": "family", "family": FamilyMode}` when it changes.
    Also in 0.6.0: automatic tag fixing (/admin/autotag/*: Chromaprint + AcoustID + MusicBrainz suggestions
    an admin reviews; accepting writes the same tag overrides as /admin/tags) and a duplicate finder
    (/admin/duplicates*; hidden copies vanish from every listing like missing files, never deleted).
    TrackTagDetail file/effective also carry the MusicBrainz id fields (mbRecordingId, mbReleaseGroupId,
    mbArtistId, mbAlbumArtistId), which /admin/tags/edit `revert` accepts too.
    0.5.0 (schema v5): admin tag editing (/admin/tags/*; edits are server-side overrides, every track/album/
    artist/search response shows the effective tags) and collaborative playlists (members, entry ids,
    conflict-safe entry operations, activity, Connect `playlist` messages). Old index-based playlist calls work.
    v3 (docs/v3-ux.md phase 1): Home / For You shelf feeds, pins, global search incl. an online catalogue,
    To get list, radio. `artUrl` fields in shelves/catalogue are relative to the API base (/api/v1/).
    GET /stream and GET /art also accept `?token=<deviceToken>` (for <audio>/<img> in cross-origin clients);
    the server redacts it from its access log.
    v4: lyrics fall back to LRCLIB (source "lrclib"); admin console API under /admin/*; POST /me/bug-report.
    v5 (discovery phase 2): Release Radar (/release-radar), Wrapped (/wrapped, /admin/wrapped), Blend (/blends);
    For You returns the shelf kinds release_radar, blends and wrapped, with ShelfItem types blend and wrapped.
    0.6.0 (schema v6): Jam - listen together (/jams for the host, /jam/* for guests with `X-Jam-Token`, /jam/ws).
    Guest tokens are not device tokens: they work only on /jam/* and never stream audio.
    0.7.0 (schema v7): voice control for Home Assistant Assist. POST /voice/command takes recognised text or an
    intent + slots and answers with a sentence to speak. It is authenticated ONLY by a voice token (`nmv_…`,
    per user, created/revoked under /me/voice/tokens); voice tokens work nowhere else and device tokens don't
    work there. /me/voice/devices lists the user's Connect devices and speakers with the aliases ("bedroom",
    "Stacey's room") and default flag voice uses to pick where to play.
    0.7.0 (schema v7): uploading songs (/uploads*, /admin/uploads, /admin/users/{id}/uploads). Resumable
    chunk + offset protocol: POST /uploads, then PATCH /uploads/{id} with raw bytes and `Upload-Offset`
    (a mismatch answers 409 with the server's `offset`; GET /uploads/{id} also tells it), chunks of at most
    `maxChunkBytes` (send `chunkBytes`, 4 MiB). The last chunk's reply has status done and the stored `upload`;
    the track appears in the library seconds later (UploadedFile.indexed). Uploads with visibility `private`
    are visible only to the uploader (hidden from everyone else everywhere, /stream 404). Job `upload_scan`.
    Schema v8: admin want-list view (/admin/wants*): every user's To get items with the admin's check-off
    ("added", optional note) and "found in the library" suggestions; ToGetItem.adminAdded shows the user that mark.
    Over the Cloudflare tunnel the app also sends `CF-Access-Client-Id` and `CF-Access-Client-Secret`.
    Times are ISO-8601 UTC strings. IDs are opaque strings.
servers:
  - url: /api/v1
security:
  - device: []
paths:
  /health:
    get:
      security: []
      summary: Liveness + identity. Used by the app to test if the LAN address is reachable.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [status, serverId, version]
                properties:
                  status: { type: string, enum: [ok] }
                  serverId: { type: string, description: Stable random id of this server install }
                  version: { type: string }
  /pair:
    post:
      security: []
      summary: |
        Exchange a one-time pairing code (QR from POST /me/pair-code or the admin web UI) for a device token.
        The code belongs to the user who created it; the device is logged in as that user. The response is a
        full Session (a superset of the v1 `{deviceId, deviceToken}`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pairCode, deviceName]
              properties:
                pairCode: { type: string }
                deviceName: { type: string }
                deviceKind: { $ref: '#/components/schemas/DeviceKind' }
                appVersion: { type: [string, 'null'] }
      responses:
        '200':
          description: paired
          content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } }
        '403': { description: code invalid or expired (codes live 10 minutes, single use) }
  /library/artists:
    get:
      parameters:
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, default: 200, maximum: 1000 } }
      responses:
        '200':
          description: artists sorted by name
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Artist' } }
  /library/artists/{artistId}:
    get:
      parameters: [ { name: artistId, in: path, required: true, schema: { type: string } } ]
      responses:
        '200':
          description: artist with albums
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Artist'
                  - type: object
                    properties:
                      albums: { type: array, items: { $ref: '#/components/schemas/Album' } }
        '404': { description: not found }
  /library/artists/{artistId}/page:
    get:
      summary: Artist page (v7) - everything the artist screen shows
      description: |
        Library parts are family-mode filtered (404 when the caller can see nothing by this artist). The
        metadata comes from the server's cache; when it is missing or due, a lookup is queued in the background
        and `info.status` is "pending": fetch /library/artists/{id}/info again after a few seconds.
      parameters: [ { name: artistId, in: path, required: true, schema: { type: string } } ]
      responses:
        '200':
          description: the page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtistPage' }
        '404': { description: not found }
  /library/artists/{artistId}/info:
    get:
      summary: Artist metadata only (v7), for polling while `status` is "pending"
      parameters: [ { name: artistId, in: path, required: true, schema: { type: string } } ]
      responses:
        '200':
          description: metadata
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ArtistInfo'
                  - type: object
                    properties:
                      photoUrl: { type: [string, 'null'], description: relative to the API base }
        '404': { description: not found }
  /library/artists/{artistId}/tracks:
    get:
      summary: All tracks by the artist (own albums first, then appearances), for play all / shuffle (v7)
      parameters: [ { name: artistId, in: path, required: true, schema: { type: string } } ]
      responses:
        '200':
          description: tracks
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Track' } }
        '404': { description: not found }
  /library/albums:
    get:
      parameters:
        - { name: artistId, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [name, year, added], default: name } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, default: 200, maximum: 1000 } }
      responses:
        '200':
          description: albums
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Album' } }
  /library/albums/{albumId}:
    get:
      parameters: [ { name: albumId, in: path, required: true, schema: { type: string } } ]
      responses:
        '200':
          description: album with tracks in disc/track order
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Album'
                  - type: object
                    properties:
                      tracks: { type: array, items: { $ref: '#/components/schemas/Track' } }
        '404': { description: not found }
  /library/tracks/{trackId}:
    get:
      parameters: [ { name: trackId, in: path, required: true, schema: { type: string } } ]
      responses:
        '200':
          description: track
          content: { application/json: { schema: { $ref: '#/components/schemas/Track' } } }
        '404': { description: not found }
  /library/search:
    get:
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
      responses:
        '200':
          description: matches
          content:
            application/json:
              schema:
                type: object
                properties:
                  artists: { type: array, items: { $ref: '#/components/schemas/Artist' } }
                  albums: { type: array, items: { $ref: '#/components/schemas/Album' } }
                  tracks: { type: array, items: { $ref: '#/components/schemas/Track' } }
  /eq/autoeq:
    get:
      summary: Search AutoEq headphone profiles
      description: |
        The server downloads AutoEq's results index (github.com/jaakkopasanen/AutoEq, MIT; measurement sources vary)
        on first use, refreshes it weekly and caches it. Nothing is bundled. Clients never contact GitHub.
      parameters:
        - { name: q, in: query, schema: { type: string, default: '' }, description: 'every word must appear in the name' }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        '200':
          description: matches (names starting with the query first, then oratory1990, then A-Z)
          content:
            application/json:
              schema:
                type: object
                required: [total, results]
                properties:
                  total: { type: integer, description: entries in the whole index }
                  results: { type: array, items: { $ref: '#/components/schemas/AutoEqEntry' } }
        '502': { description: the index could not be downloaded and there is no cached copy }
  /eq/autoeq/profile:
    get:
      summary: One AutoEq parametric EQ profile (fetched on demand, then cached)
      parameters:
        - { name: id, in: query, required: true, schema: { type: string }, description: AutoEqEntry.id }
      responses:
        '200':
          description: profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutoEqProfile' }
        '404': { description: not an index entry }
        '502': { description: GitHub unreachable or the profile has no parametric EQ }
  /stream/{trackId}:
    get:
      summary: |
        Audio bytes. Supports HTTP Range for seeking. `flac` (alias `original`) sends the file as stored —
        lossless for FLAC sources, the file's own codec otherwise. `opus` is transcoded with ffmpeg and cached on disk
        per (track, bitrate). Clients pick the quality (e.g. lossless at home, Opus 128 away); see `X-Stream-Format`.
      parameters:
        - { name: trackId, in: path, required: true, schema: { type: string } }
        - { name: format, in: query, schema: { type: string, enum: [opus, flac, original], default: opus } }
        - name: bitrate
          in: query
          description: |
            kbps, opus only. 1–1000 accepted (else 422); snapped to the nearest of 64, 96, 128, 160, 192, 256
            (a tie goes up), so the cache keeps at most six variants per track, bounded by `opus_cache_gb`.
          schema: { type: integer, minimum: 1, maximum: 1000, default: 160 }
        - { name: token, in: query, schema: { type: string }, description: 'device token, for <audio> elements that cannot send headers' }
      responses:
        '200':
          description: full body (audio/ogg for opus, the file's own type for flac/original); Content-Length set
          headers:
            X-Stream-Format:
              description: 'what was sent, short, for "now playing": "Opus 128", "FLAC 16/44.1", "FLAC 24/96", "MP3 320". Exposed to CORS.'
              schema: { type: string }
        '206': { description: partial content (same X-Stream-Format header) }
        '404': { description: not found }
        '422': { description: unknown format or bitrate out of range }
  /art/{albumId}:
    get:
      parameters:
        - { name: albumId, in: path, required: true, schema: { type: string } }
        - { name: size, in: query, schema: { type: integer, default: 512 } }
        - { name: token, in: query, schema: { type: string }, description: device token (for <img>) }
      responses:
        '200': { description: image/jpeg }
        '404': { description: no art }
  /art/artist/{artistId}:
    get:
      summary: Cached artist photo (v7; Wikimedia Commons, max 600 px wide). Show ArtistInfo.image credits with it.
      parameters:
        - { name: artistId, in: path, required: true, schema: { type: string } }
        - { name: token, in: query, schema: { type: string }, description: device token (for <img>) }
      responses:
        '200': { description: image/jpeg }
        '404': { description: no photo }
  /smart-playlists:
    get:
      summary: The caller's smart playlists (v7), refreshed if stale
      responses:
        '200':
          description: smart playlists by name
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SmartPlaylist' } }
    post:
      summary: Create a smart playlist (max 200 per user)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, definition]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                definition: { $ref: '#/components/schemas/SmartPlaylistDefinition' }
                preset: { type: [string, 'null'], description: preset id it was started from }
      responses:
        '201':
          description: created, with its tracks
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SmartPlaylistDetail' }
        '422': { description: invalid definition (detail says what) }
  /smart-playlists/fields:
    get:
      summary: Rule editor catalogue - fields (type, operators, options), sorts, units and presets
      responses:
        '200':
          description: catalogue
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SmartPlaylistFields' }
  /smart-playlists/preview:
    post:
      summary: Evaluate a definition without saving it (live count in the editor)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [definition]
              properties:
                definition: { $ref: '#/components/schemas/SmartPlaylistDefinition' }
                smartPlaylistId: { type: [string, 'null'], description: the one being edited (self-reference check) }
                sample: { type: integer, default: 25, minimum: 0, maximum: 200, description: how many tracks to return }
      responses:
        '200':
          description: count, total duration and the first `sample` tracks
          content:
            application/json:
              schema:
                type: object
                required: [trackCount, durationS, tracks]
                properties:
                  trackCount: { type: integer }
                  durationS: { type: number }
                  tracks: { type: array, items: { $ref: '#/components/schemas/Track' } }
        '422': { description: invalid definition }
  /smart-playlists/{id}:
    parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
    get:
      summary: A smart playlist with its (fresh) tracks
      responses:
        '200':
          description: smart playlist
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SmartPlaylistDetail' }
        '404': { description: not found (or not the caller's) }
    patch:
      summary: Rename and/or change the rules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                definition: { $ref: '#/components/schemas/SmartPlaylistDefinition' }
      responses:
        '200':
          description: updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SmartPlaylistDetail' }
        '404': { description: not found }
        '422': { description: invalid definition }
    delete:
      responses:
        '204': { description: deleted (its pin too) }
        '404': { description: not found }
  /smart-playlists/{id}/refresh:
    post:
      summary: Recompute now (normally automatic on read and nightly)
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200':
          description: refreshed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SmartPlaylistDetail' }
        '404': { description: not found }
  /favourites:
    get:
      responses:
        '200':
          description: starred tracks, most recently starred first
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Track' } }
  /favourites/{trackId}:
    put:
      summary: Star. Idempotent. (The app may also send a `star` event; either path works.)
      parameters: [ { name: trackId, in: path, required: true, schema: { type: string } } ]
      responses: { '204': { description: starred } }
    delete:
      parameters: [ { name: trackId, in: path, required: true, schema: { type: string } } ]
      responses: { '204': { description: unstarred } }
  /mixes/today:
    get:
      summary: Mixes built by the last nightly run (may be empty before the first run).
      responses:
        '200':
          description: mixes
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Mix' } }
  /mixes/{mixId}:
    get:
      parameters: [ { name: mixId, in: path, required: true, schema: { type: string } } ]
      responses:
        '200':
          description: mix
          content: { application/json: { schema: { $ref: '#/components/schemas/Mix' } } }
        '404': { description: not found }
  /mixes/more-like/{trackId}:
    post:
      summary: Build a fresh mix around a seed track, on demand.
      parameters:
        - { name: trackId, in: path, required: true, schema: { type: string } }
        - { name: minutes, in: query, schema: { type: integer, default: 40, minimum: 10, maximum: 240 } }
      responses:
        '200':
          description: new mix (kind=more_like)
          content: { application/json: { schema: { $ref: '#/components/schemas/Mix' } } }
        '404': { description: track unknown or not analysed yet }
        '503': { description: AI engine unavailable }
  /tracks/{trackId}/why:
    get:
      summary: Human-readable reason a track was picked (latest mix it appears in, else a general taste explanation).
      parameters: [ { name: trackId, in: path, required: true, schema: { type: string } } ]
      responses:
        '200':
          description: reason
          content:
            application/json:
              schema:
                type: object
                required: [reason]
                properties:
                  reason: { type: string }
                  similarTo: { type: array, items: { $ref: '#/components/schemas/Track' }, description: up to 3 tracks it sounds like }
  /tracks/{trackId}/lyrics:
    get:
      summary: |
        Lyrics for a track, read from the file itself: embedded tags (FLAC/Vorbis LYRICS, UNSYNCEDLYRICS,
        SYNCEDLYRICS; MP3 USLT/SYLT; M4A ©lyr) or a sidecar `.lrc` file with the same name. Synced (LRC)
        lyrics are preferred when both exist. The app caches these for downloaded tracks so they work offline.
        v2: the caller's own edit (PUT) wins over the file (`source: "user"`); `?source=` picks one explicitly.
        v4: also ID3 USLT (any language/description), SYLT, TXXX:LYRICS/UNSYNCEDLYRICS/SYNCEDLYRICS, COMM frames
        holding LRC, APEv2 `Lyrics`, any Vorbis key containing "lyric", MP4 ©lyr and ----:...:LYRICS, and `.lrc`
        / `.txt` sidecars matched case-insensitively (`lrc_file` = any sidecar). When the file has none and the
        admin hasn't turned LRCLIB off, lyrics come from lrclib.net (`source: "lrclib"`, cached on the server;
        "not found" is retried after 30 days). A background job pre-fetches them for favourites and today's mixes.
      parameters:
        - { name: trackId, in: path, required: true, schema: { type: string } }
        - { name: source, in: query, schema: { type: string, enum: [user, library, embedded, lrc_file, lrclib] }, description: 'default: your edit, else an admin''s library-wide edit (v5, `library`), else the file (embedded, then sidecar), else LRCLIB' }
      responses:
        '200':
          description: lyrics
          content: { application/json: { schema: { $ref: '#/components/schemas/Lyrics' } } }
        '404': { description: unknown track, or no lyrics (from that source) }
    put:
      summary: Save the caller's own lyrics for this track (LRC or plain text). Never written to the music file.
      parameters: [ { name: trackId, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [raw], properties: { raw: { type: string, maxLength: 200000 } } } } }
      responses:
        '200':
          description: the saved lyrics, parsed (source=user)
          content: { application/json: { schema: { $ref: '#/components/schemas/Lyrics' } } }
        '422': { description: empty lyrics }
    delete:
      summary: Remove the caller's edit; GET falls back to the file's lyrics.
      parameters: [ { name: trackId, in: path, required: true, schema: { type: string } } ]
      responses: { '204': { description: removed (also when there was none) } }
  /sync/manifest:
    get:
      summary: |
        The full set of tracks the phone should hold offline right now (today's mixes + favourites).
        The app downloads what it lacks and deletes downloaded tracks not in this list.
      parameters:
        - { name: favouritesFormat, in: query, schema: { type: string, enum: [opus, flac], default: opus } }
      responses:
        '200':
          description: manifest
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncManifest' }
  /sync/smart:
    get:
      summary: |
        Smart-download candidates for the phone's rolling offline set: favourites, active mixes, the last
        7 days' Daily Mixes, recent plays, Release Radar albums already in the library, "because you played"
        and the recommender's likely picks. Each track appears once with all its reasons and the AI's
        likelihood. The phone picks what fits its storage budget and evicts the least likely first.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 5000, default: 1500 } }
      responses:
        '200':
          description: candidates, favourites and current mixes first, then by score
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SmartCandidates' }
  /events:
    post:
      summary: Batch upload of listening feedback. Idempotent by event id; duplicates are ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events: { type: array, maxItems: 1000, items: { $ref: '#/components/schemas/Event' } }
      responses:
        '200':
          description: accepted
          content:
            application/json:
              schema:
                type: object
                required: [accepted, duplicates]
                properties:
                  accepted: { type: integer }
                  duplicates: { type: integer }
  /suggestions:
    get:
      summary: Current weekly album suggestions (status new first).
      responses:
        '200':
          description: suggestions
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Suggestion' } }
  /suggestions/{suggestionId}:
    post:
      parameters: [ { name: suggestionId, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [want, not_interested, have] }
      responses: { '204': { description: saved } }
  /suggestions/{suggestionId}/preview:
    get:
      summary: |
        30-second preview audio, proxied by the server (third-party preview links expire within minutes,
        and proxying keeps the phone from contacting third parties). Streamed through, never stored.
      parameters: [ { name: suggestionId, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: audio/mpeg }
        '404': { description: no preview for this suggestion }
        '502': { description: upstream preview unavailable }
  /suggestions/{suggestionId}/cover:
    get:
      summary: Cover image, proxied by the server (may be cached on disk).
      parameters:
        - { name: suggestionId, in: path, required: true, schema: { type: string } }
        - { name: size, in: query, schema: { type: integer, default: 512 } }
      responses:
        '200': { description: image/jpeg }
        '404': { description: no cover }
  /server-info:
    get:
      security: []
      summary: Identity and addresses of this server, so a client logged in via one address learns the other and the LAN cert pin.
      responses:
        '200':
          description: server info
          content: { application/json: { schema: { $ref: '#/components/schemas/ServerInfo' } } }
  /auth/login:
    post:
      security: []
      summary: Log in with username + password; creates a device and returns its token. Rate-limited (5 failed tries/min/IP → 429).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, deviceName, deviceKind]
              properties:
                username: { type: string }
                password: { type: string }
                deviceName: { type: string, maxLength: 100 }
                deviceKind: { $ref: '#/components/schemas/DeviceKind' }
                appVersion: { type: [string, 'null'] }
                cookie: { type: boolean, default: false, description: 'also set the httpOnly `nm_session` cookie (web player)' }
      responses:
        '200':
          description: logged in
          content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } }
        '401': { description: wrong username or password }
        '403': { description: account disabled }
        '429': { description: too many failed attempts; retry later }
  /auth/register:
    post:
      security: []
      summary: Create an account with an invite code. Username 3–32 chars `[A-Za-z0-9_.-]`, password ≥ 8. Rate-limited like login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inviteCode, username, password, deviceName, deviceKind]
              properties:
                inviteCode: { type: string }
                username: { type: string, minLength: 3, maxLength: 32, pattern: '^[A-Za-z0-9_.-]+$' }
                password: { type: string, minLength: 8 }
                deviceName: { type: string, maxLength: 100 }
                deviceKind: { $ref: '#/components/schemas/DeviceKind' }
                appVersion: { type: [string, 'null'] }
                cookie: { type: boolean, default: false }
      responses:
        '200':
          description: account created and logged in
          content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } }
        '403': { description: invite code unknown, used or expired }
        '409': { description: username taken }
        '422': { description: invalid username or password }
        '429': { description: too many failed attempts }
  /auth/logout:
    post:
      summary: Revoke the calling device's token and clear the `nm_session` cookie.
      responses: { '204': { description: logged out } }
  /me:
    get:
      responses:
        '200':
          description: the signed-in user
          content: { application/json: { schema: { $ref: '#/components/schemas/User' } } }
  /me/password:
    put:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current, new]
              properties:
                current: { type: string }
                new: { type: string, minLength: 8 }
      responses:
        '204': { description: changed }
        '403': { description: current password wrong }
  /me/devices:
    get:
      summary: The user's own devices (revoked ones are not listed).
      responses:
        '200':
          description: devices
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Device' } } } }
  /me/devices/{deviceId}:
    delete:
      summary: Sign a device out (revokes its token, closes its Connect socket).
      parameters: [ { name: deviceId, in: path, required: true, schema: { type: string } } ]
      responses:
        '204': { description: revoked }
        '404': { description: not one of your devices }
  /me/pair-code:
    post:
      summary: One-time code (10 min) that logs another device in as this user via POST /pair (QR shortcut).
      responses:
        '200':
          description: code + QR payload (docs/pairing.md)
          content:
            application/json:
              schema:
                type: object
                required: [pairCode, expiresAt, qrPayload]
                properties:
                  pairCode: { type: string }
                  expiresAt: { type: string, format: date-time }
                  qrPayload: { type: object, description: 'the docs/pairing.md JSON object; encode it compactly into the QR' }
  /me/settings:
    get:
      summary: |
        The user's synced settings: a flat map of client-defined keys to JSON values, shared by all their devices.
        Known keys: `offline.favourites` (bool) and the §10 data switches `context.listening`, `context.output`,
        `context.device`, `context.motion`, `context.location`, `context.weather`, `context.search`, `context.time`,
        `context.health` (bool, default false), v7 `notify.newMusic` (bool, default false: one notification
        per library scan that added music) and `device.<deviceId>.scrobble` (bool, default true: false = plays
        from that device are never scrobbled). A per-device override is stored as `device.<deviceId>.<key>`.
        v3 appearance keys (docs/v3-ux.md §7; validated on PUT): `appearance.animations` off|quick|expressive
        (default quick), `appearance.defaultView` grid|list, `appearance.albumPage` big|simple,
        `appearance.accent` green|blue|purple|pink|orange|red|teal or "#rrggbb", `home.shelves` / `foryou.shelves`
        (array of shelf ids, display order), `home.hidden` / `foryou.hidden` (array of shelf ids),
        `library.view.<chip>` grid|list (usually per device: `device.<id>.library.view.albums`).
        0.8.2 radio DJ voice (validated on PUT): `dj.voice` (bool, default false), `dj.every` (integer 1-10,
        default 3: the DJ talks before the first song and then every N songs).
      responses:
        '200':
          description: settings
          content: { application/json: { schema: { $ref: '#/components/schemas/UserSettings' } } }
    put:
      summary: Merge keys into the settings (a null value deletes the key). Returns the full map.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UserSettings' } } }
      responses:
        '200':
          description: settings after the merge
          content: { application/json: { schema: { $ref: '#/components/schemas/UserSettings' } } }
  /me/family:
    get:
      summary: v6. The caller's family mode.
      responses:
        '200':
          description: family mode
          content: { application/json: { schema: { $ref: '#/components/schemas/FamilyMode' } } }
    put:
      summary: |
        v6. Change family mode (any subset). When an admin has locked it, the user may only tighten it;
        loosening (enabled false, hideProbable/hideUnknown false) needs `pin` (the admin-set unlock PIN):
        403 without/with a wrong PIN or when there is no PIN (admin-only unlock), 429 after 5 wrong PINs a
        minute. Turning it off with the PIN also removes the lock.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                enabled: { type: boolean }
                hideProbable: { type: boolean, description: 'also hide "probably explicit" (lyrics word list) tracks' }
                hideUnknown: { type: boolean, description: also hide tracks nobody has classified yet }
                pin: { type: string, maxLength: 12 }
      responses:
        '200':
          description: family mode after the change
          content: { application/json: { schema: { $ref: '#/components/schemas/FamilyMode' } } }
        '403': { description: locked (wrong or missing PIN) }
        '429': { description: too many wrong PINs }
  /voice/command:
    post:
      tags: [voice]
      summary: |
        v7. Run a voice command (Home Assistant Assist) as the voice token's user, through Connect. Send either
        `text` (what the user said, English) or `intent` + `slots` (HA's recognised intent: NasPlay, NasPause,
        NasResume, NasNext, NasPrevious, NasVolume, NasVolumeUp, NasVolumeDown, NasNowPlaying, or HA built-ins
        HassMediaPause/Unpause/Next/Previous, HassSetVolume). Understood: play {playlist|album|artist|song|radio|
        mix|vibe description} [in/on {device, speaker, room alias}], pause, resume, skip, previous, volume (absolute
        or up/down), what's playing. Names are matched fuzzily against the user's library (family mode applies:
        hidden tracks are never found or queued), playlists, today's mixes and Connect devices. Where to play: the
        named device, else the satellite's `area` / `areaDevices`, else the active device, else the user's default
        voice device. Always 200 for an understood request, with `ok` false and a spoken explanation when it can't
        be done (not found, offline, nothing playing).
      security: [{ voice: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string, maxLength: 500, description: 'e.g. "play my Pop radio in the bedroom"' }
                intent: { type: string, maxLength: 60 }
                slots:
                  type: object
                  additionalProperties: true
                  description: 'intent slots: playlist|album|artist|song|radio|mix|vibe|genre|query (the thing to play), kind, device|room|speaker, volume_level'
                area: { type: string, maxLength: 100, description: the HA area of the voice satellite (for "here") }
                areaDevices:
                  type: array
                  maxItems: 30
                  items: { type: string, maxLength: 200 }
                  description: media_player entity ids (or names) in that area
                language: { type: string, maxLength: 20 }
                dryRun: { type: boolean, default: false, description: resolve only; play nothing }
      responses:
        '200':
          description: result
          content: { application/json: { schema: { $ref: '#/components/schemas/VoiceResult' } } }
        '400': { description: neither text nor intent }
        '401': { description: missing, invalid or revoked voice token }
  /me/voice/tokens:
    get:
      tags: [voice]
      summary: v7. The caller's voice tokens (never the token itself).
      responses:
        '200':
          description: tokens
          content:
            application/json:
              schema:
                type: object
                required: [tokens]
                properties:
                  tokens: { type: array, items: { $ref: '#/components/schemas/VoiceToken' } }
    post:
      tags: [voice]
      summary: v7. Create a voice token. The token is in this response only.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 100, default: Home Assistant }
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/VoiceToken' }
                  - type: object
                    required: [token]
                    properties:
                      token: { type: string, description: 'nmv_…; send as Authorization: Bearer to /voice/command' }
        '409': { description: too many tokens (20) }
  /me/voice/tokens/{tokenId}:
    parameters: [{ name: tokenId, in: path, required: true, schema: { type: string } }]
    delete:
      tags: [voice]
      summary: v7. Revoke a voice token (immediately).
      responses:
        '204': { description: revoked }
        '404': { description: no such token (or not yours) }
  /me/voice/devices:
    get:
      tags: [voice]
      summary: |
        v7. Devices voice can play on: online Connect devices, server speakers, the caller's other signed-in
        devices (offline) and speakers that have aliases but aren't discovered right now (offline).
      responses:
        '200':
          description: devices
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices: { type: array, items: { $ref: '#/components/schemas/VoiceDevice' } }
  /me/voice/devices/{deviceId}:
    parameters:
      - { name: deviceId, in: path, required: true, schema: { type: string }, description: 'a device id or speaker id (spk:…; may contain ":" and ".")' }
    put:
      tags: [voice]
      summary: v7. Set a device's voice aliases and/or make it the default (only one default per user).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                aliases: { type: array, maxItems: 10, items: { type: string, maxLength: 60 } }
                isDefault: { type: boolean }
      responses:
        '200':
          description: saved
          content:
            application/json:
              schema:
                type: object
                required: [id, aliases, isDefault]
                properties:
                  id: { type: string }
                  aliases: { type: array, items: { type: string } }
                  isDefault: { type: boolean }
  /me/data:
    get:
      summary: What has been collected about the user (counts per context signal and date range).
      responses:
        '200':
          description: summary
          content: { application/json: { schema: { $ref: '#/components/schemas/DataSummary' } } }
    delete:
      summary: |
        Erase collected context for one signal (the fields listed in DataSummary.signals) or `all`.
        `signal=all` erases ALL listening history too (events, play/skip counts, taste snapshots) and needs
        `confirm=true`. Favourites, ratings, thumbs, playlists and queues are kept.
      parameters:
        - { name: signal, in: query, required: true, schema: { type: string, enum: [listening, output, device, motion, location, weather, search, time, health, all] } }
        - { name: confirm, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: what was erased
          content:
            application/json:
              schema:
                type: object
                properties:
                  eventsUpdated: { type: integer }
                  eventsDeleted: { type: integer }
        '400': { description: signal=all without confirm=true }
  /me/data/export:
    get:
      summary: Everything stored about the user as one JSON document (attachment).
      responses:
        '200':
          description: export (Content-Disposition attachment)
          content:
            application/json:
              schema:
                type: object
                properties:
                  exportedAt: { type: string, format: date-time }
                  user: { $ref: '#/components/schemas/User' }
                  settings: { type: object }
                  devices: { type: array, items: { $ref: '#/components/schemas/Device' } }
                  tracks: { type: array, items: { type: object }, description: 'per-track state: trackId, path, starredAt, rating, blocked, playCount, skipCount, lastPlayed' }
                  events: { type: array, items: { type: object }, description: 'all events incl. context' }
                  playlists: { type: array, items: { $ref: '#/components/schemas/PlaylistDetail' } }
                  queues: { type: array, items: { $ref: '#/components/schemas/QueueDetail' } }
                  lyricsOverrides: { type: array, items: { type: object } }
                  suggestions: { type: array, items: { $ref: '#/components/schemas/Suggestion' } }
  /library/folders:
    get:
      summary: Browse the library by folder. `path` is relative to the library root; "" is the root.
      parameters:
        - { name: path, in: query, schema: { type: string, default: '' } }
      responses:
        '200':
          description: one folder level
          content:
            application/json:
              schema:
                type: object
                required: [path, parent, folders, tracks]
                properties:
                  path: { type: string }
                  parent: { type: [string, 'null'], description: null at the root }
                  folders:
                    type: array
                    items:
                      type: object
                      required: [name, path, trackCount]
                      properties:
                        name: { type: string }
                        path: { type: string }
                        trackCount: { type: integer, description: tracks in this folder and below }
                  tracks: { type: array, items: { $ref: '#/components/schemas/Track' }, description: 'tracks directly in this folder, by file name' }
        '404': { description: no such folder }
  /library/genres:
    get:
      responses:
        '200':
          description: genres (tag values as written), by name
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [name, trackCount, albumCount]
                  properties:
                    name: { type: string }
                    trackCount: { type: integer }
                    albumCount: { type: integer }
  /library/genres/{genre}/tracks:
    get:
      parameters:
        - { name: genre, in: path, required: true, schema: { type: string }, description: URL-encoded genre name (case-insensitive) }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, default: 200, maximum: 1000 } }
      responses:
        '200':
          description: tracks by artist, album, disc, track number
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Track' } } } }
  /library/tracks:
    get:
      summary: All songs.
      parameters:
        - { name: sort, in: query, schema: { type: string, enum: [title, added, year], default: title } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, default: 200, maximum: 1000 } }
      responses:
        '200':
          description: tracks
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Track' } } } }
  /library/tracks/{trackId}/info:
    get:
      parameters: [ { name: trackId, in: path, required: true, schema: { type: string } } ]
      responses:
        '200':
          description: song info
          content: { application/json: { schema: { $ref: '#/components/schemas/TrackInfo' } } }
        '404': { description: not found }
  /lists/{kind}:
    get:
      summary: Smart lists for the calling user.
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string, enum: [favourites, recently_added, recently_played, most_played, not_played] } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, default: 200, maximum: 1000 } }
      responses:
        '200':
          description: tracks
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Track' } } } }
  /playlists:
    get:
      responses:
        '200':
          description: the user's own playlists and the ones shared with them (v5; see `role`), most recently updated first
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Playlist' } } } }
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                trackIds: { type: array, items: { type: string } }
      responses:
        '200':
          description: created
          content: { application/json: { schema: { $ref: '#/components/schemas/PlaylistDetail' } } }
  /playlists/{playlistId}:
    parameters: [ { name: playlistId, in: path, required: true, schema: { type: string } } ]
    get:
      responses:
        '200':
          description: playlist with tracks
          content: { application/json: { schema: { $ref: '#/components/schemas/PlaylistDetail' } } }
        '404': { description: not found (or no access) }
    patch:
      summary: Rename. Owner only (403 for members).
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { name: { type: string, minLength: 1, maxLength: 200 } } } } }
      responses:
        '200':
          description: updated
          content: { application/json: { schema: { $ref: '#/components/schemas/PlaylistDetail' } } }
        '403': { description: not the owner }
    delete:
      summary: "Owner only. Members get a Connect `playlist` message with `deleted: true`."
      responses: { '204': { description: deleted }, '403': { description: not the owner } }
  /playlists/{playlistId}/tracks:
    post:
      summary: |
        Add tracks (owner or editor). v5: prefer `afterEntryId` — insert right after that entry ("" = at the
        top); it keeps its meaning however others edited the list meanwhile. Else `position` (index, legacy),
        else append. Each new entry records who added it.
      parameters: [ { name: playlistId, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trackIds]
              properties:
                trackIds: { type: array, items: { type: string }, maxItems: 10000 }
                position: { type: [integer, 'null'], description: insert before this index; omitted/null = append }
                afterEntryId: { type: [string, 'null'], description: 'v5: insert after this entry; "" = at the top' }
      responses:
        '200':
          description: playlist after the change
          content: { application/json: { schema: { $ref: '#/components/schemas/PlaylistDetail' } } }
        '403': { description: viewer }
        '404': { description: playlist or a track not found }
        '409': { description: afterEntryId is no longer in the playlist (refetch) }
  /playlists/{playlistId}/tracks/{position}:
    delete:
      summary: Legacy, index-based. Prefer DELETE /playlists/{playlistId}/entries/{entryId}.
      parameters:
        - { name: playlistId, in: path, required: true, schema: { type: string } }
        - { name: position, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: playlist after the change
          content: { application/json: { schema: { $ref: '#/components/schemas/PlaylistDetail' } } }
  /playlists/{playlistId}/move:
    post:
      summary: Legacy, index-based. Prefer POST /playlists/{playlistId}/entries/{entryId}/move.
      parameters: [ { name: playlistId, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Move' } } } }
      responses:
        '200':
          description: playlist after the change
          content: { application/json: { schema: { $ref: '#/components/schemas/PlaylistDetail' } } }
  /playlists/{playlistId}/entries/{entryId}:
    delete:
      summary: v5. Remove one entry (owner or editor). Already removed (by someone else) = no-op, still 200.
      parameters:
        - { name: playlistId, in: path, required: true, schema: { type: string } }
        - { name: entryId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: playlist after the change
          content: { application/json: { schema: { $ref: '#/components/schemas/PlaylistDetail' } } }
        '403': { description: viewer }
  /playlists/{playlistId}/entries/remove:
    post:
      summary: v5. Remove several entries (multi-select). Unknown ids are ignored.
      parameters: [ { name: playlistId, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [entryIds], properties: { entryIds: { type: array, items: { type: string }, minItems: 1 } } } } }
      responses:
        '200':
          description: playlist after the change
          content: { application/json: { schema: { $ref: '#/components/schemas/PlaylistDetail' } } }
  /playlists/{playlistId}/entries/{entryId}/move:
    post:
      summary: v5. Move an entry right after another (`afterEntryId` null = to the top). Owner or editor.
      parameters:
        - { name: playlistId, in: path, required: true, schema: { type: string } }
        - { name: entryId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { afterEntryId: { type: [string, 'null'] } } } } }
      responses:
        '200':
          description: playlist after the change
          content: { application/json: { schema: { $ref: '#/components/schemas/PlaylistDetail' } } }
        '409': { description: the entry or afterEntryId is gone (refetch) }
  /playlists/{playlistId}/members:
    parameters: [ { name: playlistId, in: path, required: true, schema: { type: string } } ]
    get:
      summary: v5. Owner first, then members. Anyone with access may read it.
      responses:
        '200':
          description: members
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PlaylistMember' } } } }
    post:
      summary: v5. Owner only. Invite (add) a user by id or username, or change their role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId: { type: string }
                username: { type: string }
                role: { type: string, enum: [editor, viewer], default: editor }
      responses:
        '200':
          description: members after the change
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PlaylistMember' } } } }
        '403': { description: not the owner }
        '404': { description: no such (enabled) user }
        '422': { description: that's the owner, or too many members (50) }
  /playlists/{playlistId}/members/{userId}:
    parameters:
      - { name: playlistId, in: path, required: true, schema: { type: string } }
      - { name: userId, in: path, required: true, schema: { type: string } }
    patch:
      summary: v5. Owner only. Change a member's role.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [role], properties: { role: { type: string, enum: [editor, viewer] } } } } }
      responses:
        '200':
          description: members after the change
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PlaylistMember' } } } }
    delete:
      summary: v5. The owner removes a member, or a member leaves (their own userId). The owner can't leave (422).
      responses: { '204': { description: removed } }
  /playlists/{playlistId}/activity:
    get:
      summary: v5. Who did what, newest first.
      parameters:
        - { name: playlistId, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 500 } }
        - { name: before, in: query, schema: { type: integer }, description: 'older than this activity id (paging)' }
      responses:
        '200':
          description: activity
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PlaylistActivity' } } } }
  /playlists/{playlistId}/m3u:
    get:
      summary: |
        Export the playlist as UTF-8 M3U (#EXTM3U, #PLAYLIST, #EXTINF "Artist - Title"), as an attachment
        named after the playlist. Any user who can view the playlist.
      parameters:
        - { name: playlistId, in: path, required: true, schema: { type: string } }
        - name: paths
          in: query
          schema: { type: string, enum: [library, absolute, url], default: library }
          description: |
            library = paths relative to the library root (save the file there for other players); absolute =
            the server's own file paths; url = this server's /stream URLs (they need the app's sign-in)
      responses:
        '200':
          description: the playlist
          content: { audio/x-mpegurl: { schema: { type: string } } }
        '404': { description: no such playlist (or no access) }
  /users:
    get:
      summary: v5. Other enabled users on this server (id + username), to share a playlist with.
      responses:
        '200':
          description: users
          content:
            application/json:
              schema: { type: array, items: { type: object, required: [id, username], properties: { id: { type: string }, username: { type: string } } } }
  /queues:
    get:
      responses:
        '200':
          description: the user's queues by slot (max 20)
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Queue' } } } }
    post:
      summary: Create a queue in the lowest free slot. With 20 queues already, the least recently updated one that isn't currently playing is replaced (its slot is reused), like Musicolet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, trackIds]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                trackIds: { type: array, items: { type: string }, maxItems: 10000 }
                startIndex: { type: integer, default: 0 }
                source: { $ref: '#/components/schemas/QueueSource' }
      responses:
        '200':
          description: created
          content: { application/json: { schema: { $ref: '#/components/schemas/QueueDetail' } } }
  /queues/{queueId}:
    parameters: [ { name: queueId, in: path, required: true, schema: { type: string } } ]
    get:
      responses:
        '200':
          description: queue with tracks
          content: { application/json: { schema: { $ref: '#/components/schemas/QueueDetail' } } }
        '404': { description: not found (or not yours) }
    patch:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                currentIndex: { type: integer, minimum: 0 }
                positionMs: { type: integer, minimum: 0 }
      responses:
        '200':
          description: updated (tracks included)
          content: { application/json: { schema: { $ref: '#/components/schemas/QueueDetail' } } }
    delete:
      responses: { '204': { description: deleted } }
  /queues/{queueId}/tracks:
    put:
      summary: Replace all tracks (sort, clear, shuffle-in-place). currentIndex defaults to the current track's new index, else 0.
      parameters: [ { name: queueId, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trackIds]
              properties:
                trackIds: { type: array, items: { type: string }, maxItems: 10000 }
                currentIndex: { type: [integer, 'null'], minimum: 0 }
      responses:
        '200':
          description: queue after the change
          content: { application/json: { schema: { $ref: '#/components/schemas/QueueDetail' } } }
    post:
      parameters: [ { name: queueId, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trackIds]
              properties:
                trackIds: { type: array, items: { type: string }, maxItems: 10000 }
                position:
                  description: 'insert before this index, or "next" (after the current track), or "end" (default)'
                  oneOf: [ { type: integer }, { type: string, enum: [next, end] } ]
      responses:
        '200':
          description: queue after the change
          content: { application/json: { schema: { $ref: '#/components/schemas/QueueDetail' } } }
  /queues/{queueId}/tracks/{position}:
    delete:
      parameters:
        - { name: queueId, in: path, required: true, schema: { type: string } }
        - { name: position, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: queue after the change (currentIndex adjusted)
          content: { application/json: { schema: { $ref: '#/components/schemas/QueueDetail' } } }
  /queues/{queueId}/move:
    post:
      parameters: [ { name: queueId, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Move' } } } }
      responses:
        '200':
          description: queue after the change (currentIndex follows the current track)
          content: { application/json: { schema: { $ref: '#/components/schemas/QueueDetail' } } }
  /queues/{queueId}/save-as-playlist:
    post:
      parameters: [ { name: queueId, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string, minLength: 1, maxLength: 200 } } } } }
      responses:
        '200':
          description: the new playlist
          content: { application/json: { schema: { $ref: '#/components/schemas/PlaylistDetail' } } }
  /connect:
    get:
      summary: |
        WebSocket (upgrade) for Connect device control — see docs/v2.md §5. Auth: `Authorization: Bearer`,
        or `?token=<deviceToken>` (browsers), or the `nm_session` cookie. Messages are JSON `{"type": ...}`.
        Client → server: `hello`, `state` (PlaybackState, active device only), `command`, `transfer`, `ping`.
        Server → client: `welcome {deviceId, devices, state}`, `devices {devices}`, `state` (PlaybackState),
        `command {action, args, fromDeviceId}`, `takeover {state}`, `release`, `queues {queueId}`, `pong`,
        `error {detail, source?}` (`source: speaker` = a speaker problem worth showing the user),
        `notification {notification}` (v7, a new Notification for this user, e.g. new music added), and (v5)
        `playlist {playlistId, rev, deleted}` — sent to every device of the owner and every member when a playlist
        changes (refetch it unless you already have that `rev`; `deleted: true` = deleted, or you lost access).
        Command actions: play, pause, next, prev, seek {positionMs}, setVolume {volume}, setShuffle {on},
        setRepeat {mode}, setSpeed {speed}, playTracks {trackIds, index, queueName}, playQueue {queueId, index?,
        positionMs?} (no index = resume where the queue was left; the server adds the saved index + positionMs),
        and (0.8.0) playSpoken {kind: episode|book|station, id, positionMs?} (a podcast episode / audiobook at a
        book-wide position / live station; no positionMs = the item's saved resume point). On a spoken item,
        next/prev on a speaker skip +30 s / -15 s.
        Clients must ignore message types they don't know. Speakers (`kind: speaker`, see /cast/speakers) are
        listed as devices too; the server plays on their behalf. The server sends WebSocket protocol pings every 20 s (keeps the Cloudflare tunnel open);
        clients still send `ping` every 25 s. A newer socket from the same device replaces the older one.
      responses:
        '101': { description: switching protocols }
        '403': { description: bad token (the socket is closed with code 4401) }
  # ---------- Jam: listen together (0.6.0, schema v6, docs/jam.md) ----------
  /jams:
    post:
      tags: [jam]
      summary: |
        Start a Jam (or get the one you're already hosting). Guests add to the queue you're playing (Connect
        state), else to a new empty "Jam" queue; the Jam follows whichever of your queues you play. Returns your
        host view with the join links. The link expires after `linkTtlMinutes` (default 60, max 1440); the Jam
        itself ends after 12 hours at the latest.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/JamSettingsPatch'
                - type: object
                  properties:
                    linkTtlMinutes: { type: integer, minimum: 5, maximum: 1440 }
      responses:
        '200': { description: host view, content: { application/json: { schema: { $ref: '#/components/schemas/JamSnapshot' } } } }
  /jams/current:
    get:
      tags: [jam]
      summary: The Jam you're hosting, if any.
      responses:
        '200': { description: host view, content: { application/json: { schema: { $ref: '#/components/schemas/JamSnapshot' } } } }
        '204': { description: not hosting a Jam }
  /jams/{jamId}:
    parameters: [{ name: jamId, in: path, required: true, schema: { type: string } }]
    get:
      tags: [jam]
      summary: Host view of your Jam (404 if it isn't yours, 410 once ended).
      responses:
        '200': { description: host view, content: { application/json: { schema: { $ref: '#/components/schemas/JamSnapshot' } } } }
        '404': { description: no such Jam (or not yours) }
        '410': { description: ended }
    patch:
      tags: [jam]
      summary: Change settings (approve-before-add, allow "play next", max songs waiting per guest; null = no cap).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/JamSettingsPatch' } } }
      responses:
        '200': { description: host view, content: { application/json: { schema: { $ref: '#/components/schemas/JamSnapshot' } } } }
    delete:
      tags: [jam]
      summary: End the Jam. Every guest token dies, guest sockets get `ended` and close with 4410. The queue stays.
      responses:
        '204': { description: ended }
  /jams/{jamId}/link:
    parameters: [{ name: jamId, in: path, required: true, schema: { type: string } }]
    post:
      tags: [jam]
      summary: |
        New join link (the old one stops working; guests already in stay), or `close: true` = no new joins.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ttlMinutes: { type: integer, minimum: 5, maximum: 1440 }
                close: { type: boolean, default: false }
      responses:
        '200': { description: host view, content: { application/json: { schema: { $ref: '#/components/schemas/JamSnapshot' } } } }
        '429': { description: too many link changes }
  /jams/{jamId}/qr:
    parameters: [{ name: jamId, in: path, required: true, schema: { type: string } }]
    get:
      tags: [jam]
      summary: QR codes (PNG data URIs) of the public and LAN join links (null when the link is closed).
      responses:
        '200':
          description: QR codes
          content:
            application/json:
              schema:
                type: object
                properties:
                  joinUrl: { type: [string, 'null'] }
                  lanJoinUrl: { type: [string, 'null'] }
                  qr: { type: [string, 'null'] }
                  lanQr: { type: [string, 'null'] }
  /jams/{jamId}/requests/{requestId}:
    parameters:
      - { name: jamId, in: path, required: true, schema: { type: string } }
      - { name: requestId, in: path, required: true, schema: { type: string } }
    post:
      tags: [jam]
      summary: Approve (adds it to the queue, at the end or next as asked) or reject a pending request.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [approve], properties: { approve: { type: boolean } } } } }
      responses:
        '200': { description: host view, content: { application/json: { schema: { $ref: '#/components/schemas/JamSnapshot' } } } }
        '409': { description: already handled }
  /jams/{jamId}/queue:
    parameters: [{ name: jamId, in: path, required: true, schema: { type: string } }]
    post:
      tags: [jam]
      summary: The host adds a song through the Jam (no approval or caps). Plain queue edits work too.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trackId]
              properties:
                trackId: { type: string }
                playNext: { type: boolean, default: false }
      responses:
        '200': { description: host view, content: { application/json: { schema: { $ref: '#/components/schemas/JamSnapshot' } } } }
        '409': { description: already playing or coming up }
  /jams/{jamId}/queue/{position}:
    parameters:
      - { name: jamId, in: path, required: true, schema: { type: string } }
      - { name: position, in: path, required: true, schema: { type: integer } }
      - { name: trackId, in: query, required: false, schema: { type: string }, description: guard against a stale view }
    delete:
      tags: [jam]
      summary: Remove a queue entry (position in the host queue, as in JamEntry.position).
      responses:
        '200': { description: host view, content: { application/json: { schema: { $ref: '#/components/schemas/JamSnapshot' } } } }
        '409': { description: the entry at that position isn't `trackId` any more }
  /jams/{jamId}/guests/{guestId}:
    parameters:
      - { name: jamId, in: path, required: true, schema: { type: string } }
      - { name: guestId, in: path, required: true, schema: { type: string } }
    delete:
      tags: [jam]
      summary: |
        Kick a guest: their token dies, their pending requests are withdrawn, their socket gets `kicked` and closes
        with 4403. (They could rejoin with the link while it's valid; regenerate it to stop that.)
      responses:
        '200': { description: host view, content: { application/json: { schema: { $ref: '#/components/schemas/JamSnapshot' } } } }
  /jam/join/{code}:
    parameters: [{ name: code, in: path, required: true, schema: { type: string } }]
    get:
      tags: [jam]
      security: []
      summary: |
        Public. Preview a join link (rate-limited per IP). `signedInAs` = the username when the caller sent a valid
        session (cookie/bearer), so the guest page can offer "join as yourself".
      responses:
        '200':
          description: preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  hostName: { type: string }
                  guestCount: { type: integer }
                  linkExpiresAt: { type: string, format: date-time }
                  signedInAs: { type: [string, 'null'] }
        '404': { description: unknown or revoked link, or the Jam ended }
        '410': { description: the link expired }
        '429': { description: rate limited }
    post:
      tags: [jam]
      security: []
      summary: |
        Public. Join with a display name (trimmed, control/format characters removed, max 32; always plain text),
        or `asMember: true` with a valid session to join as yourself (409 for the host). Returns the guest token
        (send it as `X-Jam-Token`) and the guest view. Rate-limited per IP (10/min); max 50 guests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 200 }
                asMember: { type: boolean, default: false }
      responses:
        '200':
          description: joined
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    required: [token]
                    properties: { token: { type: string, description: 'jg_…; expires with the Jam' } }
                  - $ref: '#/components/schemas/JamSnapshot'
        '400': { description: no usable name }
        '401': { description: asMember without a session }
        '403': { description: the Jam is full }
        '404': { description: unknown or revoked link }
        '410': { description: the link expired }
        '429': { description: rate limited }
  /jam/me:
    get:
      tags: [jam]
      security: [{ jamGuest: [] }]
      summary: Guest view. 401 once the guest left, was kicked, the token expired or the Jam ended.
      responses:
        '200': { description: guest view, content: { application/json: { schema: { $ref: '#/components/schemas/JamSnapshot' } } } }
        '401': { description: not in a Jam any more }
    delete:
      tags: [jam]
      security: [{ jamGuest: [] }]
      summary: Leave the Jam (the token dies).
      responses:
        '204': { description: left }
  /jam/search:
    get:
      tags: [jam]
      security: [{ jamGuest: [] }]
      summary: Search the host's library for tracks (read-only, max 30, 20 searches/min per guest).
      parameters: [{ name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 100 } }]
      responses:
        '200':
          description: tracks
          content:
            application/json:
              schema: { type: object, properties: { tracks: { type: array, items: { $ref: '#/components/schemas/JamTrack' } } } }
        '429': { description: rate limited }
  /jam/requests:
    post:
      tags: [jam]
      security: [{ jamGuest: [] }]
      summary: |
        Ask for a song: straight into the host's queue (`queued: true`), or pending when the host approves adds.
        403 = "play next" not allowed, or you already have `maxPerGuest` songs waiting. 409 = already playing,
        coming up or requested. 10/min per guest.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trackId]
              properties:
                trackId: { type: string }
                playNext: { type: boolean, default: false }
      responses:
        '200':
          description: requested
          content:
            application/json:
              schema:
                type: object
                properties:
                  request: { $ref: '#/components/schemas/JamRequest' }
                  queued: { type: boolean }
        '403': { description: not allowed }
        '404': { description: no such track }
        '409': { description: duplicate }
        '429': { description: rate limited }
  /jam/requests/{requestId}:
    parameters: [{ name: requestId, in: path, required: true, schema: { type: string } }]
    delete:
      tags: [jam]
      security: [{ jamGuest: [] }]
      summary: Withdraw one of your pending requests.
      responses:
        '204': { description: withdrawn }
        '404': { description: not yours, or not pending }
  /jam/votes:
    post:
      tags: [jam]
      security: [{ jamGuest: [] }]
      summary: Vote on a track in the Jam (1 up, -1 down, 0 clear). Shown to everyone; doesn't reorder the queue.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trackId, value]
              properties:
                trackId: { type: string }
                value: { type: integer, enum: [-1, 0, 1] }
      responses:
        '204': { description: recorded }
  /jam/reactions:
    post:
      tags: [jam]
      security: [{ jamGuest: [] }]
      summary: 'Send a reaction to everyone in the Jam (not stored). Allowed: 🔥 ❤️ 😂 👏 🕺 🙌 😮 👎. 10 per 30 s.'
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [emoji], properties: { emoji: { type: string } } } } }
      responses:
        '204': { description: sent }
        '422': { description: not an allowed reaction }
  /jam/art/{albumId}:
    parameters:
      - { name: albumId, in: path, required: true, schema: { type: string } }
      - { name: size, in: query, required: false, schema: { type: integer, minimum: 16, maximum: 1024, default: 256 } }
      - { name: token, in: query, required: false, schema: { type: string }, description: the guest token, for <img> }
    get:
      tags: [jam]
      security: [{ jamGuest: [] }]
      summary: Album art for guests (JPEG). Accepts the guest token as `?token=` (redacted from logs).
      responses:
        '200': { description: JPEG, content: { image/jpeg: {} } }
        '404': { description: no art }
  /jam/ws:
    get:
      tags: [jam]
      security: []
      summary: |
        WebSocket (upgrade) with live Jam updates, separate from /connect and scoped to one Jam. Auth:
        `?token=<guest token>`, or the host's normal session (bearer / `?token=` / cookie) plus `?jam=<jamId>`.
        Server → client: `snapshot` (a full JamSnapshot for this viewer; on connect and after any change),
        `playback {nowPlaying: {positionMs, positionAt, playing, speed}, serverTime}` (same track, new position or
        pause), `reaction {emoji, name}`, `kicked` (then close 4403), `ended` (then close 4410). Close 4401 = bad
        or expired token. Client → server: `ping` → `pong`. Ignore unknown types.
      responses:
        '101': { description: switching protocols }
  /cast/speakers:
    get:
      summary: |
        Speakers this server can cast to (Chromecast/Google Cast, DLNA renderers, Home Assistant media players,
        Snapcast groups). They also appear in every user's Connect device list with `kind: speaker`; to play on
        one, `transfer` to its id (or send a `playTracks`/`playQueue` command with `targetDeviceId` = its id).
        The server then plays the queue on the speaker and reports PlaybackState like an active phone.
        While it connects and loads (at most ~10 s) PlaybackState has `connecting: true` and `playing: false`
        (show "Connecting…" with Cancel). If it can't connect, refuses the track, or drops later, the server
        sends `error {source: speaker, detail: "Couldn't connect to <name>" / "Lost connection to <name>"}` and
        hands playback back — paused, same position — to the device that picked the speaker (a `takeover`);
        if that device is gone, nothing is active. Cancel / "Stop casting" = `transfer` to yourself with
        `play: false` (the speaker stops; you take over paused where it was).
        404 when casting is disabled (`cast_enabled = false`).
      responses:
        '200':
          description: current speakers
          content: { application/json: { schema: { $ref: '#/components/schemas/SpeakerList' } } }
        '404': { description: casting disabled }
  /cast/speakers/refresh:
    post:
      summary: Admin only. Re-run discovery now (it also runs every 5 minutes).
      responses:
        '200':
          description: speakers after the refresh
          content: { application/json: { schema: { $ref: '#/components/schemas/SpeakerList' } } }
        '403': { description: not an admin }
  /cast/sign:
    post:
      summary: |
        Short-lived signed media + art URLs for tracks, for a client that casts by itself (the Android `full`
        flavour's Google Cast button). URLs point at the server's cast base URL (plain HTTP on the LAN), are
        scoped to one track and format, expire after the track's duration + `cast_url_ttl_s`, and carry no
        session token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trackIds]
              properties:
                trackIds: { type: array, items: { type: string }, minItems: 1, maxItems: 500 }
                format: { type: string, enum: [original, opus, mp3], default: original }
      responses:
        '200':
          description: one item per known track, in request order (unknown ids are skipped)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [trackId, url, artUrl, contentType, expiresAt]
                      properties:
                        trackId: { type: string }
                        url: { type: string }
                        artUrl: { type: string }
                        contentType: { type: string }
                        expiresAt: { type: integer, description: unix seconds }
  /cast/media/{trackId}:
    get:
      summary: |
        Audio for speakers. No session auth: the HMAC `sig` over (track, format, exp) is the credential.
        Also served alone on the plain-HTTP `cast_port`. `original` and `opus`/`mp3` (cached transcodes) support Range.
      security: []
      parameters:
        - { name: trackId, in: path, required: true, schema: { type: string } }
        - { name: f, in: query, schema: { type: string, enum: [original, opus, mp3], default: original } }
        - { name: exp, in: query, required: true, schema: { type: integer } }
        - { name: sig, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: audio, content: { audio/*: { schema: { type: string, format: binary } } } }
        '206': { description: partial content }
        '403': { description: bad or expired signature }
        '404': { description: not found }
  /cast/art/{albumId}:
    get:
      summary: Album art (512 px JPEG) for speakers. Signed like /cast/media.
      security: []
      parameters:
        - { name: albumId, in: path, required: true, schema: { type: string } }
        - { name: exp, in: query, required: true, schema: { type: integer } }
        - { name: sig, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: JPEG, content: { image/jpeg: { schema: { type: string, format: binary } } } }
        '403': { description: bad or expired signature }
        '404': { description: not found }
  /cast/spoken/{kind}/{id}:
    get:
      tags: [spoken]
      summary: |
        Audio for speakers playing an episode, an audiobook part (`id` = `<bookId>.<part>`) or a live station.
        No session auth: URLs come from /cast/sign-spoken and the HMAC `sig` over (kind, id, exp) is the credential.
      security: []
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string, enum: [episode, book, station] } }
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: exp, in: query, required: true, schema: { type: integer } }
        - { name: sig, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: audio, content: { audio/*: { schema: { type: string, format: binary } } } }
        '206': { description: partial content }
        '403': { description: bad or expired signature }
        '404': { description: not found }
  /cast/spoken-art/{kind}/{id}:
    get:
      tags: [spoken]
      summary: Cover (512 px) of a podcast, audiobook or station for speakers. Signed like /cast/spoken.
      security: []
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string, enum: [podcast, book, station] } }
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: exp, in: query, required: true, schema: { type: integer } }
        - { name: sig, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: image, content: { image/*: { schema: { type: string, format: binary } } } }
        '403': { description: bad or expired signature }
        '404': { description: not found }
  /admin/invites:
    get:
      summary: Admin only.
      responses:
        '200':
          description: invites, newest first
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Invite' } } } }
        '403': { description: not an admin }
    post:
      summary: Admin only. `url` = `<tunnelUrl or lanUrl>/join/<code>`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: [string, 'null'], maxLength: 200 }
                expiresInDays: { type: integer, default: 7, minimum: 1, maximum: 90 }
      responses:
        '200':
          description: created
          content:
            application/json:
              schema:
                type: object
                required: [code, url, expiresAt]
                properties:
                  code: { type: string }
                  url: { type: string }
                  expiresAt: { type: string, format: date-time }
  /admin/invites/{code}:
    delete:
      parameters: [ { name: code, in: path, required: true, schema: { type: string } } ]
      responses: { '204': { description: deleted }, '404': { description: not found } }
  /admin/users:
    get:
      summary: Admin only.
      responses:
        '200':
          description: users
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AdminUser' } } } }
  /admin/users/{userId}:
    patch:
      summary: Admin only. Disabling a user revokes their devices. Removing or disabling the last active admin → 409.
      parameters: [ { name: userId, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                disabled: { type: boolean }
                isAdmin: { type: boolean }
      responses:
        '200':
          description: updated
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminUser' } } }
        '404': { description: not found }
        '409': { description: would leave no active admin }
  /admin/users/{userId}/reset-password:
    post:
      summary: Admin only. Sets a new password and signs the user out everywhere.
      parameters: [ { name: userId, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [new], properties: { new: { type: string, minLength: 8 } } } } }
      responses: { '204': { description: reset }, '404': { description: not found } }
  /home:
    get:
      summary: |
        Home (docs/v3-ux.md §3.1): typed shelves in the user's order (settings `home.shelves`, hidden ones in
        `home.hidden`). Empty shelves are omitted, except `start_radio`, which always has its buttons (v6: smart shuffle first, then random radio).
        Shelf kinds here: start_radio, devices, recently_played, continue_listening, pinned.
      responses:
        '200':
          description: shelves
          content: { application/json: { schema: { $ref: '#/components/schemas/ShelfFeed' } } }
  /foryou:
    get:
      summary: |
        For You (docs/v3-ux.md §3.2): typed shelves. Kinds: mixes, radio, because_you_played (1–3 shelves),
        release_radar (two shelves: id "release_radar" = not owned, catalog items; id "release_radar:library" =
        in your library, album items; both carry `release`), suggestions, to_get, blends (blend items, invites
        first; a last item with id "new" and blend.status "new" offers to start one when someone can be invited),
        wrapped (wrapped items: "Your <year> so far", and last year's in January–March).
        Order and hiding follow settings `foryou.shelves` / `foryou.hidden`. Empty shelves are omitted.
        because_you_played shelves have id "byp:track:<seed track id>" and track items.
      responses:
        '200':
          description: shelves
          content: { application/json: { schema: { $ref: '#/components/schemas/ShelfFeed' } } }
  /pins:
    get:
      summary: The user's "Pinned" items, in order (also shown on Home).
      responses:
        '200':
          description: pinned items, resolved
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ShelfItem' } } } }
    post:
      summary: Pin an item to Home ("Pin to Home"). Idempotent; re-pinning moves it to `position`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, id]
              properties:
                type: { $ref: '#/components/schemas/PinType' }
                id: { type: string }
                position: { type: [integer, 'null'], description: 0 = first; omitted/null = last }
      responses:
        '200':
          description: all pins after the change
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ShelfItem' } } } }
        '404': { description: the item doesn't exist (or isn't yours) }
  /pins/{type}/{id}:
    delete:
      parameters:
        - { name: type, in: path, required: true, schema: { $ref: '#/components/schemas/PinType' } }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { '204': { description: unpinned (also when it wasn't pinned) } }
  /search:
    get:
      summary: |
        Global search (docs/v3-ux.md §4) across the library, the user's playlists and queues, and — with scope
        all|catalog — an online catalogue (Deezer public search + MusicBrainz) for "Not in your library".
        Catalogue results are cached server-side and rate-limited; if the catalogue is unreachable the library
        results still come back and `catalogError` says why.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
        - { name: scope, in: query, schema: { type: string, enum: [all, library, catalog], default: all } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 }, description: per group }
      responses:
        '200':
          description: grouped results
          content: { application/json: { schema: { $ref: '#/components/schemas/SearchResults' } } }
  /catalog/{catalogId}/preview:
    get:
      summary: 30-second sample of a catalogue item (album = its first track), proxied, fresh link each time, never stored.
      parameters:
        - { name: catalogId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: audio/mpeg (Range passed through; 206 when the upstream honours it) }
        '404': { description: unknown id or no sample }
        '502': { description: upstream unavailable }
  /catalog/{catalogId}/cover:
    get:
      parameters:
        - { name: catalogId, in: path, required: true, schema: { type: string } }
        - { name: size, in: query, schema: { type: integer, default: 512 } }
      responses:
        '200': { description: image/jpeg (resized, cached on disk) }
        '404': { description: unknown id or no cover }
        '502': { description: upstream unavailable }
  /toget:
    get:
      summary: The user's "To get" list (music to acquire), newest first.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [want, got, dismissed, all], default: want } }
      responses:
        '200':
          description: items
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ToGetItem' } } } }
    post:
      summary: |
        Add an album or song. Either `catalogId` (from search) or `type` + `title` + `artist`. Adding something
        already on the list returns the existing item (status reset to `want` if it was dismissed). Items the
        library already has are created as `got`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                catalogId: { type: string }
                type: { type: string, enum: [album, track] }
                title: { type: string, maxLength: 300 }
                artist: { type: string, maxLength: 300 }
                year: { type: [integer, 'null'] }
                mbid: { type: [string, 'null'], description: MusicBrainz release-group (album) or recording (track) id }
                note: { type: [string, 'null'], maxLength: 1000 }
      responses:
        '200':
          description: the item
          content: { application/json: { schema: { $ref: '#/components/schemas/ToGetItem' } } }
        '404': { description: unknown catalogId }
        '422': { description: neither catalogId nor type+title+artist }
  /toget/{id}:
    parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
    patch:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [want, got, dismissed] }
                note: { type: [string, 'null'], maxLength: 1000 }
      responses:
        '200':
          description: updated
          content: { application/json: { schema: { $ref: '#/components/schemas/ToGetItem' } } }
        '404': { description: not found (or not yours) }
    delete:
      responses: { '204': { description: deleted }, '404': { description: not found } }
  /radio:
    post:
      summary: |
        Start a radio (docs/v3-ux.md §5): the AI picks ~25 tracks and the server stores them as a queue named by
        the AI ("Song X radio", "Your Indie Rock radio"; radio != null on the queue). Starting the same radio
        again replaces that queue. Ask for more with POST /radio/{queueId}/more when ~5 remain.
        Queue changes are pushed over Connect as usual.
        AI radio (schema v6): seed.type=moment is the smart shuffle ("Play something for now"; queue name
        "Smart shuffle"), chosen for this moment from time of day, day of week, device, the last hour's plays and
        skips and freshness; send `context` hints (all optional). seed.type=vibe is describe-a-vibe: send `text`
        and/or `constraints` (chips from POST /radio/vibe/parse, possibly with some removed). Every radio is
        steerable (POST /radio/{queueId}/steer). The queue's `radio` carries the station's explanation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seed]
              properties:
                seed: { $ref: '#/components/schemas/RadioSeed' }
                context: { $ref: '#/components/schemas/RadioContext' }
                automix: { type: boolean, default: false, description: '0.7: order the tracks for DJ flow (the first pick stays first)' }
      responses:
        '200':
          description: the new radio queue
          content: { application/json: { schema: { $ref: '#/components/schemas/QueueDetail' } } }
        '400': { description: malformed seed (e.g. a vibe with neither text nor constraints) }
        '404': { description: seed item not found, or nothing analysed to build a radio from }
        '503': { description: AI engine without radio support yet }
  /radio/{queueId}/more:
    post:
      parameters: [ { name: queueId, in: path, required: true, schema: { type: string } } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                count: { type: integer, default: 25, minimum: 1, maximum: 100 }
                automix: { type: boolean, default: false, description: "0.7: order the new batch for DJ flow, continuing from the queue's last track" }
      responses:
        '200':
          description: the queue with new tracks appended (no repeats; unchanged once the library runs out)
          content: { application/json: { schema: { $ref: '#/components/schemas/QueueDetail' } } }
        '404': { description: not a radio queue of yours }
        '503': { description: AI engine without radio support yet }
  /radio/vibe/parse:
    post:
      summary: |
        Describe-a-vibe: interpret free text ("chill rainy evening", "gym, no slow songs", "focus, no lyrics",
        "2000s throwbacks", "like <artist in your library>") as constraint chips on the analysed feature space.
        CPU-cheap lexicon + library vocabulary; nothing is stored. Show the chips, let the user remove some
        (or edit the text and parse again), then POST /radio with seed {type: vibe, text, constraints}.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [text], properties: { text: { type: string, maxLength: 200 } } } } }
      responses:
        '200':
          description: the interpretation
          content:
            application/json:
              schema:
                type: object
                required: [text, title, constraints]
                properties:
                  text: { type: string }
                  title: { type: string }
                  constraints: { type: array, items: { $ref: '#/components/schemas/VibeConstraint' } }
        '503': { description: AI engine without AI radio yet }
  /radio/{queueId}/station:
    get:
      summary: The station behind a radio queue (any seed type) with its explanation and remembered steering.
      parameters: [ { name: queueId, in: path, required: true, schema: { type: string } } ]
      responses:
        '200':
          description: station
          content: { application/json: { schema: { $ref: '#/components/schemas/RadioStation' } } }
        '404': { description: not a radio queue of yours }
        '503': { description: AI engine without AI radio yet }
  /radio/{queueId}/steer:
    post:
      summary: |
        Steer a radio: more / less like this (track or artist), more energy / calmer, more variety / more
        familiar, never play this here (on this station only), remove one entry, reset. Remembered per station
        (the same seed, vibe chips, or smart shuffle on this kind of device) and applied to every later fetch.
        More/less/never also train the recommender. With refresh (default) the queue's tracks after the current
        and next one are replaced by fresh steered picks, so the change is heard right away; the queue is pushed
        over Connect. Clients playing locally should swap their own upcoming items for the returned queue's.
      parameters: [ { name: queueId, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [more_like, less_like, more_energy, calmer, more_variety, more_familiar, never_here, remove, reset] }
                trackId: { type: [string, 'null'], description: 'required for more_like, less_like, never_here (the track playing / tapped)' }
                scope: { type: string, enum: [track, artist], default: track, description: 'for more_like / less_like / never_here / remove' }
                refId: { type: [string, 'null'], description: 'remove: the track or artist id of the entry to undo' }
                currentIndex: { type: [integer, 'null'], minimum: 0, description: "the player's real index (default: the queue's saved one)" }
                refresh: { type: boolean, default: true }
                context: { $ref: '#/components/schemas/EventContext' }
      responses:
        '200':
          description: the station and the (possibly refreshed) queue
          content:
            application/json:
              schema:
                type: object
                required: [station, queue]
                properties:
                  station: { $ref: '#/components/schemas/RadioStation' }
                  queue: { $ref: '#/components/schemas/QueueDetail' }
        '400': { description: action needs a trackId / refId }
        '404': { description: not a radio queue of yours, or unknown track }
        '503': { description: AI engine without AI radio yet }
  /release-radar:
    get:
      summary: |
        Release Radar: albums, EPs and singles first released in the last ~8 weeks (or announced for the next
        30 days) by the artists you play most, from MusicBrainz; refreshed weekly (Friday 04:00, job
        `release_radar`). `notOwned` are catalog items ("mb:rg:<mbid>": cover via catalog/<id>/cover, add to
        To get with POST /toget {catalogId}); `inLibrary` are albums you own, incl. albums by those artists added
        to the library in that window. Every item has `release`.
      responses:
        '200':
          description: the radar
          content: { application/json: { schema: { $ref: '#/components/schemas/ReleaseRadar' } } }
  /wrapped:
    get:
      summary: |
        Your listening year from your own play/skip events (the year so far for the current year; `final` once
        it's over). Local time = your `timezone` setting, else the server's. Clients render the story cards and
        image export themselves.
      parameters:
        - { name: year, in: query, schema: { type: integer, minimum: 2000, maximum: 2100 }, description: default the current year }
      responses:
        '200':
          description: stats
          content: { application/json: { schema: { $ref: '#/components/schemas/Wrapped' } } }
        '404': { description: year out of range }
  /wrapped/years:
    get:
      summary: Years you have plays in (always includes the current year), newest first.
      responses:
        '200':
          description: years
          content: { application/json: { schema: { type: array, items: { type: integer } } } }
  /admin/wrapped:
    get:
      summary: Admin only. Server-wide Wrapped (aggregates over all users; no per-user breakdown).
      parameters:
        - { name: year, in: query, schema: { type: integer, minimum: 2000, maximum: 2100 } }
      responses:
        '200':
          description: stats
          content: { application/json: { schema: { $ref: '#/components/schemas/ServerWrapped' } } }
        '403': { description: not an admin }
  /blends:
    get:
      summary: Blends you're in or invited to (invites first).
      responses:
        '200':
          description: blends (without tracks)
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Blend' } } } }
    post:
      summary: |
        Start a blend and invite existing users by username. You join at once; each invitee must accept before
        any of their listening is used. 404 unknown/disabled user, 403 user turned invites off
        (setting `blends.allowInvites` = false), 409 someone is in 20 blends already, 422 yourself / > 8 people.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [usernames]
              properties:
                name: { type: [string, 'null'], maxLength: 80, description: 'default "alice + bob"' }
                usernames: { type: array, minItems: 1, maxItems: 7, items: { type: string } }
      responses:
        '201':
          description: created
          content: { application/json: { schema: { $ref: '#/components/schemas/Blend' } } }
  /blends/candidates:
    get:
      summary: Other users you can invite (enabled, accepting invites).
      responses:
        '200':
          description: users
          content: { application/json: { schema: { type: array, items: { type: object, required: [userId, username], properties: { userId: { type: string }, username: { type: string } } } } } }
  /blends/{blendId}:
    parameters:
      - { name: blendId, in: path, required: true, schema: { type: string } }
    get:
      summary: |
        One blend. Members see `tracks` (rebuilt nightly and whenever someone joins or leaves); invitees see the
        name and members only. 404 if you're not a member or invitee.
      responses:
        '200':
          description: blend
          content: { application/json: { schema: { $ref: '#/components/schemas/Blend' } } }
        '404': { description: not found }
    patch:
      summary: Rename (joined members).
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string, minLength: 1, maxLength: 80 } } } } }
      responses:
        '200':
          description: blend
          content: { application/json: { schema: { $ref: '#/components/schemas/Blend' } } }
  /blends/{blendId}/invite:
    post:
      summary: Invite more people (joined members). Someone who left or declined is asked again.
      parameters:
        - { name: blendId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [usernames], properties: { usernames: { type: array, items: { type: string } } } } } }
      responses:
        '200':
          description: blend
          content: { application/json: { schema: { $ref: '#/components/schemas/Blend' } } }
  /blends/{blendId}/accept:
    post:
      summary: Accept an invite (consent to your listening being used in this blend). The blend is rebuilt at once.
      parameters:
        - { name: blendId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: blend with tracks
          content: { application/json: { schema: { $ref: '#/components/schemas/Blend' } } }
        '404': { description: no pending invite }
  /blends/{blendId}/decline:
    post:
      summary: Decline an invite.
      parameters:
        - { name: blendId, in: path, required: true, schema: { type: string } }
      responses: { '204': { description: declined }, '404': { description: no pending invite } }
  /blends/{blendId}/leave:
    post:
      summary: |
        Leave (or withdraw from) a blend at any time. Your tracks and attribution are removed immediately; the blend
        is deleted when nobody is left.
      parameters:
        - { name: blendId, in: path, required: true, schema: { type: string } }
      responses: { '204': { description: left }, '404': { description: not a member } }
  /blends/{blendId}/refresh:
    post:
      summary: Rebuild now (joined members).
      parameters:
        - { name: blendId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: blend
          content: { application/json: { schema: { $ref: '#/components/schemas/Blend' } } }
  /me/bug-report:
    post:
      summary: |
        Send app logs / a crash dump to the server admins (stored on this server only, kept 30 days).
        Total body ≤ 2 MB (413 otherwise); at most 20 reports per user per day (429).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BugReportIn' } } }
      responses:
        '200':
          description: stored
          content: { application/json: { schema: { type: object, required: [id], properties: { id: { type: string } } } } }
        '413': { description: too large }
        '429': { description: too many reports today }
  /admin/tags/tracks/{trackId}:
    get:
      summary: |
        Admin only (v5). A track's tags as the file has them, the overrides, and the effective tags. The music
        library is read-only: edits are stored on the server and layered over the file's tags, survive rescans
        (also when the file itself changes), and are what every other endpoint, search and the AI see.
      parameters: [ { name: trackId, in: path, required: true, schema: { type: string } } ]
      responses:
        '200':
          description: tags
          content: { application/json: { schema: { $ref: '#/components/schemas/TrackTagDetail' } } }
        '403': { description: not an admin }
  /admin/family:
    get:
      summary: Admin only (v6). Every user's family mode.
      responses:
        '200':
          description: users
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AdminFamilyUser' } } } }
  /admin/users/{userId}/family:
    put:
      summary: |
        Admin only (v6). Set a user's family mode. `locked: true` turns it on and stops the user from loosening
        it (e.g. a child's account); `pin` (4-12 digits) lets someone unlock it on the user's device;
        `clearPin: true` makes it admin-only.
      parameters: [ { name: userId, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                enabled: { type: boolean }
                hideProbable: { type: boolean }
                hideUnknown: { type: boolean }
                locked: { type: boolean }
                pin: { type: string, pattern: '^[0-9]{4,12}$' }
                clearPin: { type: boolean }
      responses:
        '200':
          description: the user's family mode
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminFamilyUser' } } }
        '404': { description: no such user }
  /admin/explicit:
    get:
      summary: |
        Admin only (v6). Explicit-flag review list with each source's evidence. Default: probable + unknown
        (probable first). Sources in priority order: admin, tags, deezer, lyrics.
      parameters:
        - { name: status, in: query, schema: { type: array, items: { $ref: '#/components/schemas/ExplicitStatus' } }, style: form, explode: true }
        - { name: source, in: query, schema: { type: string, enum: [admin, tags, deezer, lyrics, none] } }
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - { name: limit, in: query, schema: { type: integer, default: 100, minimum: 1, maximum: 1000 } }
        - { name: offset, in: query, schema: { type: integer, default: 0, minimum: 0 } }
      responses:
        '200':
          description: review list
          content: { application/json: { schema: { $ref: '#/components/schemas/ExplicitReview' } } }
    post:
      summary: |
        Admin only (v6). Set (or with `value: null`, clear) the admin verdict on tracks and/or whole albums.
        Stored as the tag override `explicit` (audit log, /admin/tags/history), which beats every automatic source.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              additionalProperties: false
              properties:
                trackIds: { type: array, items: { type: string }, maxItems: 5000 }
                albumIds: { type: array, items: { type: string }, maxItems: 500 }
                value: { type: [string, 'null'], enum: [explicit, clean, null] }
      responses:
        '200':
          description: done
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TagEditResult'
                  - type: object
                    properties:
                      tracks: { type: integer }
                      status: { type: [object, 'null'], additionalProperties: { $ref: '#/components/schemas/ExplicitStatus' }, description: 'per track (null for more than 500)' }
        '404': { description: unknown track or album }
        '422': { description: no tracks / bad value }
  /admin/tags/edit:
    post:
      summary: |
        Admin only (v5). Edit and/or revert tags on one or many tracks (bulk = multi-select) in one logged
        batch. `revert` lists field names (title, artist, albumArtist, album, trackNo, discNo, year, genre,
        lyrics, cover, explicit) to put back to the file's tags; ["*"] = all ("revert to file tags"). Editing artist,
        album artist or album regroups tracks into albums/artists (album and artist ids may change; track ids
        never do). Overriding an artist drops the file's MusicBrainz artist id for it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trackIds]
              properties:
                trackIds: { type: array, items: { type: string }, minItems: 1, maxItems: 5000 }
                set: { $ref: '#/components/schemas/TagValues' }
                revert: { type: array, items: { type: string } }
      responses:
        '200':
          description: done
          content: { application/json: { schema: { $ref: '#/components/schemas/TagEditResult' } } }
        '404': { description: unknown track }
        '422': { description: bad field/value, or nothing to change }
  /admin/tags/albums/{albumId}:
    post:
      summary: Admin only (v5). Same as /admin/tags/edit for every track of the album (album-level edit).
      parameters: [ { name: albumId, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                set: { $ref: '#/components/schemas/TagValues' }
                revert: { type: array, items: { type: string } }
      responses:
        '200':
          description: done
          content: { application/json: { schema: { $ref: '#/components/schemas/TagEditResult' } } }
  /admin/tags/albums/{albumId}/cover:
    parameters: [ { name: albumId, in: path, required: true, schema: { type: string } } ]
    put:
      summary: |
        Admin only (v5). Upload album art: the raw image is the request body (JPEG/PNG/WebP, max 15 MB).
        It wins over folder and embedded art. GET /art/{albumId} then serves it (clients caching art by URL
        should refetch it for this album).
      requestBody:
        required: true
        content: { image/*: { schema: { type: string, format: binary } } }
      responses:
        '200':
          description: done
          content: { application/json: { schema: { $ref: '#/components/schemas/TagEditResult' } } }
        '413': { description: too large }
        '422': { description: not an image }
    delete:
      summary: Admin only (v5). Back to the folder/embedded art.
      responses:
        '200':
          description: done
          content: { application/json: { schema: { $ref: '#/components/schemas/TagEditResult' } } }
  /admin/tags/history:
    get:
      summary: Admin only (v5). Tag edit audit log, newest first.
      parameters:
        - { name: trackId, in: query, schema: { type: string } }
        - { name: albumId, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 1000 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: log
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TagEditLogEntry' } } } }
  /admin/tags/musicbrainz:
    get:
      summary: |
        Admin only (v5). Tag suggestions from MusicBrainz (free; the server sends at most ~1 request/s with a
        generic User-Agent). `trackId` → recordings; `albumId` → releases. `q` / `artist` override the search
        terms (default: the current tags). 502 if MusicBrainz is unreachable or rate limiting.
      parameters:
        - { name: trackId, in: query, schema: { type: string } }
        - { name: albumId, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { name: artist, in: query, schema: { type: string } }
      responses:
        '200':
          description: suggestions
          content:
            application/json:
              schema:
                type: object
                properties:
                  kind: { type: string, enum: [recordings, releases] }
                  results: { type: array, items: { $ref: '#/components/schemas/TagSuggestion' } }
  /admin/tags/musicbrainz/release/{mbid}:
    get:
      summary: Admin only (v5). A MusicBrainz release with its track list, to apply album-wide.
      parameters: [ { name: mbid, in: path, required: true, schema: { type: string } } ]
      responses:
        '200':
          description: release
          content:
            application/json:
              schema:
                type: object
                properties:
                  releaseMbid: { type: string }
                  album: { type: string }
                  albumArtist: { type: [string, 'null'] }
                  year: { type: [integer, 'null'] }
                  genre: { type: [string, 'null'] }
                  discCount: { type: integer }
                  tracks:
                    type: array
                    items: { type: object, properties: { discNo: { type: integer }, trackNo: { type: integer }, title: { type: string }, artist: { type: [string, 'null'] }, recordingMbid: { type: string } } }
  /admin/autotag/status:
    get:
      summary: |
        Admin only (v6). Progress of automatic tag fixing. The `autotag` job (POST /admin/jobs/autotag/run; also
        daily) fingerprints tracks with Chromaprint, looks them up on AcoustID (needs `acoustid_api_key` in
        config.toml) and builds suggestions from MusicBrainz releases. It is time-boxed and resumable.
      responses:
        '200':
          description: status
          content: { application/json: { schema: { $ref: '#/components/schemas/AutotagStatus' } } }
  /admin/autotag/groups:
    get:
      summary: |
        Admin only (v6). Suggestions grouped by album (one group per album and chosen MusicBrainz release),
        highest confidence first. `current` values are read live, so the diff stays right after manual edits.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, accepted, rejected], default: pending } }
        - { name: minConfidence, in: query, schema: { type: number, minimum: 0, maximum: 1, default: 0 }, description: on the group confidence }
        - { name: q, in: query, schema: { type: string }, description: 'filter: album, artist, title or suggested values' }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 500 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: groups
          content:
            application/json:
              schema:
                type: object
                required: [total, groups]
                properties:
                  total: { type: integer }
                  groups: { type: array, items: { $ref: '#/components/schemas/AutotagGroup' } }
  /admin/autotag/accept:
    post:
      summary: |
        Admin only (v6). Accept pending suggestions picked by trackIds and/or groupIds, and/or every pending
        track whose confidence >= minConfidence ("accept all above X%"). Writes tag overrides in one audit
        batch (see /admin/tags/history); files are never touched. `fields` = which fields to apply (default
        per track: `defaultFields`). `edits` replace suggested values per track (edited fields are applied).
        `cover`: true = set the Cover Art Archive front cover as album art, false = never, omitted = only for
        albums without art.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                trackIds: { type: array, items: { type: string } }
                groupIds: { type: array, items: { type: string } }
                minConfidence: { type: number, minimum: 0, maximum: 1 }
                fields: { type: array, items: { type: string }, description: 'TagValues/AutotagValues field names' }
                edits: { type: object, additionalProperties: { $ref: '#/components/schemas/AutotagValues' }, description: 'trackId -> values' }
                cover: { type: [boolean, 'null'] }
      responses:
        '200':
          description: done
          content:
            application/json:
              schema:
                type: object
                required: [accepted, changed]
                properties:
                  accepted: { type: integer }
                  batchId: { type: [string, 'null'] }
                  changed: { type: integer, description: (track, field) changes logged }
                  coverErrors: { type: array, items: { type: string } }
        '422': { description: no selection, or bad field/value }
  /admin/autotag/reject:
    post:
      summary: Admin only (v6). Reject pending suggestions (kept, listed under status=rejected; not rebuilt).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AutotagSelection' } } }
      responses:
        '200':
          description: done
          content: { application/json: { schema: { type: object, properties: { rejected: { type: integer } } } } }
  /admin/autotag/reopen:
    post:
      summary: |
        Admin only (v6). Undo a decision: back to pending. For accepted suggestions the overrides that accept
        wrote are reverted (fields edited since are left alone).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TrackIdList' } } }
      responses:
        '200':
          description: done
          content: { application/json: { schema: { type: object, properties: { reopened: { type: integer }, reverted: { type: integer } } } } }
  /admin/autotag/rematch:
    post:
      summary: Admin only (v6). Forget the AcoustID lookup and pending suggestion of these tracks; the next run redoes them.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TrackIdList' } } }
      responses:
        '200':
          description: done
          content: { application/json: { schema: { type: object, properties: { queued: { type: integer } } } } }
  /admin/autotag/cover/{releaseMbid}:
    get:
      summary: Admin only (v6). A release's Cover Art Archive front cover (proxied and cached by the server).
      parameters: [ { name: releaseMbid, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: image, content: { image/jpeg: {}, image/png: {} } }
        '404': { description: no cover }
        '502': { description: Cover Art Archive unreachable }
  /admin/duplicates:
    get:
      summary: |
        Admin only (v6). Groups of duplicate copies found by comparing audio fingerprints (needs the autotag
        job's fingerprints). Includes groups already resolved (hidden copies), so a choice can be changed.
      responses:
        '200':
          description: groups
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/DuplicateGroup' } } } }
  /admin/duplicates/resolve:
    post:
      summary: |
        Admin only (v6). Keep one copy and hide the others. Hidden tracks disappear from every listing (like
        missing files) and stay hidden across rescans; the files are never deleted. Playlist and queue entries
        move to the kept copy; favourites, ratings and play counts are copied onto it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keepTrackId, hideTrackIds]
              properties:
                keepTrackId: { type: string }
                hideTrackIds: { type: array, items: { type: string }, minItems: 1, maxItems: 100 }
      responses:
        '200':
          description: done
          content: { application/json: { schema: { type: object, properties: { hidden: { type: integer }, keptId: { type: string } } } } }
        '404': { description: unknown track }
        '422': { description: nothing to hide }
  /admin/duplicates/unhide:
    post:
      summary: Admin only (v6). Show hidden copies again.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TrackIdList' } } }
      responses:
        '200':
          description: done
          content: { application/json: { schema: { type: object, properties: { unhidden: { type: integer } } } } }
  /admin/users/{userId}/devices:
    get:
      summary: Admin only. A user's devices (online from Connect).
      parameters: [ { name: userId, in: path, required: true, schema: { type: string } } ]
      responses:
        '200':
          description: devices
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Device' } } } }
        '404': { description: not found }
  /admin/users/{userId}/detail:
    get:
      summary: Admin only. One user with devices, last activity and event count.
      parameters: [ { name: userId, in: path, required: true, schema: { type: string } } ]
      responses:
        '200':
          description: user detail
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminUserDetail' } } }
        '404': { description: not found }
  /admin/users/{userId}/devices/{deviceId}:
    delete:
      summary: Admin only. Sign one of a user's devices out.
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
        - { name: deviceId, in: path, required: true, schema: { type: string } }
      responses: { '204': { description: revoked }, '404': { description: not found } }
  /admin/status:
    get:
      summary: Admin only. Console dashboard — server, library, analysis (with ETA), LRCLIB cache and jobs.
      responses:
        '200':
          description: status
          content: { application/json: { schema: { $ref: '#/components/schemas/ServerStatus' } } }
  /admin/jobs:
    get:
      summary: Admin only. Every background job.
      responses:
        '200':
          description: jobs
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/JobStatus' } } } }
  /admin/jobs/{name}/run:
    post:
      summary: Admin only. Start a job now (background). `backup` makes a manual database backup.
      parameters:
        - { name: name, in: path, required: true, schema: { type: string, enum: [scan, full_scan, analyse, loudness, nightly, pretranscode, lyrics, discovery, release_radar, blends, cleanup, backup, explicit, autotag, upload_scan, smart, artist_info, podcasts, audiobooks, automix] } }
      responses:
        '200':
          description: the job's status (state running, or idle if it already finished)
          content: { application/json: { schema: { $ref: '#/components/schemas/JobStatus' } } }
        '409': { description: already running }
  /admin/jobs/history:
    get:
      summary: Admin only. Recent runs of all jobs (last 20 per job), newest first.
      parameters: [ { name: limit, in: query, schema: { type: integer, default: 50, maximum: 500 } } ]
      responses:
        '200':
          description: runs
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/JobRun' } } } }
  /admin/library/failed:
    get:
      summary: Admin only. Files that failed — audio analysis (stage analyse) or reading tags in the last scan (stage scan).
      responses:
        '200':
          description: failed files
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/FailedFile' } } } }
  /admin/library/failed/retry:
    post:
      summary: Admin only. Retry all (analysis failures are forgotten and re-analysed; unreadable files trigger a full rescan).
      responses:
        '200':
          description: queued
          content: { application/json: { schema: { type: object, properties: { queued: { type: integer } } } } }
  /admin/library/failed/{id}/retry:
    post:
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200':
          description: queued
          content: { application/json: { schema: { type: object, properties: { queued: { type: integer } } } } }
        '404': { description: not found }
  /admin/health:
    get:
      summary: |
        Admin only. Library health checks with counts: missing, duplicates, missing_tags, missing_art, unanalysed,
        orphan_cache, old_backups (beyond the newest 5). `fix` is set when the server can fix it and there is
        something to fix. The music files are never modified.
      responses:
        '200':
          description: checks
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/HealthCheck' } } } }
  /admin/health/{check}:
    get:
      summary: Admin only. The items of one check.
      parameters:
        - { name: check, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 200, maximum: 5000 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: items
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/HealthItem' } } } }
        '404': { description: unknown check }
  /admin/health/{check}/fix:
    post:
      summary: |
        Admin only. Fix all items or `ids`. missing: remove the tracks from the DATABASE with everything that refers
        to them (an automatic 'prune' backup is made first; playlists/queues/mixes stay dense). unanalysed: start
        analysis. orphan_cache: delete the files. old_backups: delete them. Other checks: 400 (read-only library).
      parameters: [ { name: check, in: path, required: true, schema: { type: string } } ]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { ids: { type: [array, 'null'], items: { type: string } } } } } }
      responses:
        '200':
          description: result
          content:
            application/json:
              schema:
                type: object
                properties:
                  fixed: { type: integer }
                  freedBytes: { type: [integer, 'null'] }
                  backup: { type: string, description: missing only — the backup made first }
        '400': { description: this check can't be fixed automatically }
        '404': { description: unknown check }
  /admin/server:
    get:
      summary: Admin only. Detailed server health (the dashboard essentials are also in /admin/status).
      responses:
        '200':
          description: health
          content: { application/json: { schema: { $ref: '#/components/schemas/ServerHealth' } } }
  /admin/opus-cache:
    delete:
      summary: Admin only. Empty the Opus transcode cache (files are recreated on demand / by pre-transcode).
      responses:
        '200':
          description: removed
          content: { application/json: { schema: { type: object, properties: { files: { type: integer }, bytes: { type: integer } } } } }
  /admin/logs:
    get:
      summary: Admin only. Recent server log records (in-memory ring buffer of 2000), oldest first, tokens redacted. Poll with `after`.
      parameters:
        - { name: after, in: query, schema: { type: integer }, description: only records with seq > after }
        - { name: level, in: query, schema: { type: string, enum: [DEBUG, INFO, WARNING, ERROR, CRITICAL], default: INFO } }
        - { name: q, in: query, schema: { type: string }, description: case-insensitive text in the message or logger }
        - { name: limit, in: query, schema: { type: integer, default: 200, maximum: 2000 } }
      responses:
        '200':
          description: records
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/LogEntry' } } } }
  /admin/logs/stream:
    get:
      summary: |
        Admin only. Optional live tail as Server-Sent Events (each `data:` line is a LogEntry JSON; ": keepalive"
        comments every 15 s). Same filters as /admin/logs. EventSource can't send headers: use the nm_session cookie
        (same origin) or `?token=`.
      parameters:
        - { name: after, in: query, schema: { type: integer } }
        - { name: level, in: query, schema: { type: string, enum: [DEBUG, INFO, WARNING, ERROR, CRITICAL], default: INFO } }
        - { name: q, in: query, schema: { type: string } }
        - { name: token, in: query, schema: { type: string } }
      responses:
        '200': { description: text/event-stream }
  /admin/backups:
    get:
      summary: Admin only. Database backups (manual, pre-prune, and the automatic pre-migration ones), newest first.
      responses:
        '200':
          description: backups
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Backup' } } } }
    post:
      summary: Admin only. Make a consistent backup now (SQLite online backup).
      requestBody:
        content: { application/json: { schema: { type: object, properties: { note: { type: [string, 'null'], maxLength: 200 } } } } }
      responses:
        '200':
          description: created
          content: { application/json: { schema: { $ref: '#/components/schemas/Backup' } } }
  /admin/backups/{id}:
    get:
      deprecated: true
      summary: Admin only. Old spelling of /admin/backups/{id}/download, kept for older clients.
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: the file }, '404': { description: not found } }
    delete:
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { '204': { description: deleted }, '404': { description: not found } }
  /admin/backups/{id}/download:
    get:
      summary: Admin only. Download (attachment, application/vnd.sqlite3).
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: the file }, '404': { description: not found } }
  /admin/now-playing:
    get:
      summary: Admin only. One row per online device (plus an offline active player), across all users.
      responses:
        '200':
          description: rows
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/NowPlayingRow' } } } }
  /admin/settings:
    get:
      summary: Admin only. Editable server settings (DB overrides of config.toml), effective values at the top level.
      responses:
        '200':
          description: settings
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminSettings' } } }
    put:
      summary: |
        Admin only. Partial update; null removes an override (back to config.toml); tunnelUrl "" = no tunnel address.
        Validated (422 with the reason). Everything applies immediately, so restartRequired is always [].
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AdminSettingValues' } } }
      responses:
        '200':
          description: saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  values: { $ref: '#/components/schemas/AdminSettingValues' }
                  restartRequired: { type: array, items: { type: string } }
                  overrides: { type: object }
                  fromConfig: { $ref: '#/components/schemas/AdminSettingValues' }
        '422': { description: invalid value }
  /admin/reports:
    get:
      summary: Admin only. Bug reports from the last 30 days, newest first (without logs).
      responses:
        '200':
          description: reports
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/BugReport' } } } }
  /admin/reports/{id}:
    parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
    get:
      responses:
        '200':
          description: the full report
          content: { application/json: { schema: { $ref: '#/components/schemas/BugReportDetail' } } }
        '404': { description: not found }
    patch:
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [open, closed] } } } } }
      responses:
        '200':
          description: updated (summary)
          content: { application/json: { schema: { $ref: '#/components/schemas/BugReport' } } }
        '404': { description: not found }
    delete:
      responses: { '204': { description: deleted }, '404': { description: not found } }
  /admin/wants:
    get:
      summary: |
        Admin only (schema v8). Every user's To get items, newest first, plus per-user counts (`users`, unfiltered).
        `status=active` (default) leaves out items the user dismissed. `done` filters on the admin's check-off;
        `q` searches title, artist, note and username.
      parameters:
        - { name: userId, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { type: string, enum: [album, track] } }
        - { name: status, in: query, schema: { type: string, enum: [active, want, got, dismissed, all], default: active } }
        - { name: done, in: query, schema: { type: boolean } }
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
      responses:
        '200':
          description: items and per-user counts
          content:
            application/json:
              schema:
                type: object
                required: [items, users]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AdminWantItem' } }
                  users: { type: array, items: { $ref: '#/components/schemas/AdminWantUser' } }
        '403': { description: not an admin }
  /admin/wants/{id}/done:
    parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
    put:
      summary: Admin only. Check the item off as added (optional note). Again = update the note, keep the time.
      requestBody:
        content: { application/json: { schema: { type: object, properties: { note: { type: [string, 'null'], maxLength: 500 } } } } }
      responses:
        '200':
          description: the item
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminWantItem' } } }
        '404': { description: not found }
    delete:
      summary: Admin only. Un-check the item.
      responses:
        '200':
          description: the item
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminWantItem' } } }
        '404': { description: not found }
  /admin/wants/check-found:
    post:
      summary: |
        Admin only. Check off the items found in the library (`suggestDone`), all of them or just `ids`, with the
        note "Found in the library". Re-matches wanted items against the library first.
      requestBody:
        content: { application/json: { schema: { type: object, properties: { ids: { type: array, items: { type: string } } } } } }
      responses:
        '200':
          description: how many were checked
          content: { application/json: { schema: { type: object, required: [checked], properties: { checked: { type: integer } } } } }
  /uploads:
    get:
      summary: |
        v7. Whether the caller may upload, quota and usage, their uploaded files and unfinished/recent upload
        sessions. `?all=true` (admins) lists everyone's files.
      parameters:
        - { name: all, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: uploads overview
          content: { application/json: { schema: { $ref: '#/components/schemas/UploadOverview' } } }
    post:
      summary: |
        v7. Start a resumable upload. Allowed: FLAC, MP3, M4A/AAC, Ogg (Vorbis/Opus), WAV (kept as uploaded).
        The content is sniffed (first chunk and again at the end) and must be audio. Stored as
        <upload_root>/<username>/<Artist>/<Album>/<NN Title>.<ext> from its tags, else
        <username>/Unsorted/<original name>.<ext>.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [filename, bytes]
              properties:
                filename: { type: string, maxLength: 512 }
                bytes: { type: integer, minimum: 1, description: total file size }
                visibility: { $ref: '#/components/schemas/UploadVisibility' }
      responses:
        '201':
          description: session created (offset 0)
          content: { application/json: { schema: { $ref: '#/components/schemas/UploadSession' } } }
        '403': { description: not allowed to upload (admins decide per user; default admins only) }
        '413': { description: file larger than the limit, or quota exceeded }
        '415': { description: file type not allowed }
        '429': { description: too many unfinished uploads }
        '503': { description: uploads are not set up on this server }
  /uploads/{id}:
    parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
    get:
      summary: v7. Session state; `offset` (also the `Upload-Offset` header) is where to resume.
      responses:
        '200':
          description: session
          content: { application/json: { schema: { $ref: '#/components/schemas/UploadSession' } } }
        '404': { description: no such upload (or not yours) }
    patch:
      summary: |
        v7. Append raw bytes at `Upload-Offset` (header, or `?offset=`). Body = the chunk
        (application/offset+octet-stream or application/octet-stream), at most 16 MiB.
      parameters:
        - { name: Upload-Offset, in: header, schema: { type: integer, minimum: 0 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
      requestBody:
        required: true
        content:
          application/offset+octet-stream: { schema: { type: string, format: binary } }
          application/octet-stream: { schema: { type: string, format: binary } }
      responses:
        '200':
          description: accepted; status done (with `upload`) after the last byte
          content: { application/json: { schema: { $ref: '#/components/schemas/UploadSession' } } }
        '404': { description: no such upload }
        '409':
          description: offset mismatch or the upload is no longer in progress; resume from `offset`
          content:
            application/json:
              schema: { type: object, required: [detail, offset], properties: { detail: { type: string }, offset: { type: integer } } }
        '413': { description: chunk too large, or more bytes than announced }
        '415': { description: not an audio file (the session is failed and its data deleted) }
        '422': { description: Upload-Offset missing, or an unsafe file name }
    delete:
      summary: v7. Cancel an unfinished upload (its partial data is deleted).
      responses: { '204': { description: cancelled }, '404': { description: no such upload } }
  /uploads/files/{id}:
    parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
    patch:
      summary: v7. Change who sees an uploaded track (uploader or admin).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [visibility]
              properties: { visibility: { $ref: '#/components/schemas/UploadVisibility' } }
      responses:
        '200':
          description: updated
          content: { application/json: { schema: { $ref: '#/components/schemas/UploadedFile' } } }
        '404': { description: no such upload (or not yours) }
    delete:
      summary: |
        v7. Delete an uploaded file (uploader or admin). Only ever removes a file under the upload folder;
        the main library is read-only and cannot be touched. The track disappears at once.
      responses:
        '200':
          description: deleted
          content:
            application/json:
              schema: { type: object, properties: { deleted: { type: string }, trackId: { type: string } } }
        '404': { description: no such upload (or not yours) }
  /admin/uploads:
    get:
      summary: Admin only (v7). Per-user upload permission, quota and usage.
      responses:
        '200':
          description: overview
          content:
            application/json:
              schema:
                type: object
                required: [enabled, users]
                properties:
                  enabled: { type: boolean, description: upload_root is configured }
                  defaultQuotaBytes: { type: [integer, 'null'], description: null = unlimited }
                  maxFileBytes: { type: integer }
                  users: { type: array, items: { $ref: '#/components/schemas/AdminUploadUser' } }
  /admin/users/{id}/uploads:
    parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
    put:
      summary: |
        Admin only (v7). Who may upload and how much. `canUpload: null` = default (admins only);
        `quotaBytes: null` = the server default, 0 = unlimited. Fields left out are kept.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                canUpload: { type: [boolean, 'null'] }
                quotaBytes: { type: [integer, 'null'], minimum: 0 }
      responses:
        '200':
          description: the user's upload settings
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminUploadUser' } } }
        '404': { description: no such user }
  /me/scrobble:
    get:
      summary: v7. Scrobbling status for ListenBrainz and Last.fm (tokens are never returned).
      responses:
        '200':
          description: status
          content: { application/json: { schema: { $ref: '#/components/schemas/ScrobbleStatus' } } }
  /me/scrobble/{service}:
    parameters:
      - { name: service, in: path, required: true, schema: { type: string, enum: [listenbrainz, lastfm] } }
    put:
      summary: v7. Turn scrobbling / "now playing" on or off for a connected service. 409 if not connected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                nowPlaying: { type: boolean }
      responses:
        '200':
          description: status
          content: { application/json: { schema: { $ref: '#/components/schemas/ScrobbleStatus' } } }
        '409': { description: not connected }
    delete:
      summary: v7. Disconnect (forgets the token and drops unsent scrobbles for that service).
      responses:
        '200':
          description: status
          content: { application/json: { schema: { $ref: '#/components/schemas/ScrobbleStatus' } } }
  /me/scrobble/listenbrainz/connect:
    post:
      summary: |
        v7. Connect ListenBrainz with the user token from https://listenbrainz.org/settings/ (validated with
        ListenBrainz; 400 if it is rejected, 502 if ListenBrainz is unreachable). Enables scrobbling.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, minLength: 8, maxLength: 200 }
      responses:
        '200':
          description: status
          content: { application/json: { schema: { $ref: '#/components/schemas/ScrobbleStatus' } } }
        '400': { description: token rejected }
  /me/scrobble/lastfm/connect:
    post:
      summary: |
        v7. Step 1 of Last.fm web auth: open `authUrl` in a browser and approve nas-music there, then call
        /me/scrobble/lastfm/complete (poll it every few seconds; 409 until approved). 503 when the server has no
        `lastfm_api_key` / `lastfm_api_secret` (ScrobbleService.available false).
      responses:
        '200':
          description: where to approve
          content:
            application/json:
              schema:
                type: object
                required: [authUrl]
                properties:
                  authUrl: { type: string }
        '503': { description: Last.fm not set up on this server }
  /me/scrobble/lastfm/complete:
    post:
      summary: v7. Step 2 of Last.fm web auth. 409 = not approved yet (keep polling), 410 = request expired.
      responses:
        '200':
          description: connected; status
          content: { application/json: { schema: { $ref: '#/components/schemas/ScrobbleStatus' } } }
        '409': { description: not approved yet, or no connect started }
        '410': { description: expired; start again }
  /me/scrobble/retry:
    post:
      summary: v7. Send failed scrobbles again, and everything waiting for a retry, now.
      responses:
        '200':
          description: status
          content: { application/json: { schema: { $ref: '#/components/schemas/ScrobbleStatus' } } }
  /me/scrobble/listenbrainz/import:
    post:
      summary: |
        v7. Import the user's ListenBrainz listen history (only listens matching tracks in this library, by
        recording MBID or artist + title) as play events marked imported, so the recommender learns from them.
        Idempotent; listens the server already has from a client are skipped; imported events are never
        scrobbled. Runs in the background (202): progress in ScrobbleStatus.import. 409 if not connected or
        already running.
      parameters:
        - { name: wait, in: query, schema: { type: boolean, default: false }, description: run inline }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                maxListens: { type: integer, minimum: 1, maximum: 100000, default: 100000 }
      responses:
        '202':
          description: started; status
          content: { application/json: { schema: { $ref: '#/components/schemas/ScrobbleStatus' } } }
    delete:
      summary: v7. Remove every imported listen (and the play counts they added).
      responses:
        '200':
          description: removed count + status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ScrobbleStatus'
                  - type: object
                    required: [removed]
                    properties:
                      removed: { type: integer }
  /me/import:
    get:
      summary: |
        Listens imported from other services (counts per source), the last Last.fm import job, and whether the
        server can import from Last.fm by user name (it has a Last.fm API key).
      responses:
        '200':
          description: status
          content: { application/json: { schema: { $ref: '#/components/schemas/ImportStatus' } } }
  /me/import/spotify:
    post:
      summary: |
        Import from a Spotify account data export, one file per request (body = the file's bytes, up to
        512 MiB): my_spotify_data.zip (or any zip of the export), a streaming-history JSON
        (Streaming_History_Audio_*.json / endsong_*.json extended history, or the 30-day StreamingHistory*.json),
        a Playlist*.json, or an Exportify playlist CSV (playlist name = file name). History rows played for at
        least 30 s and half the song (or 4 minutes) that match a library track become imported play events
        (source spotify; idempotent; plays already known from a client or another import are skipped).
        Each playlist becomes a new playlist of the matched tracks; songs not in the library go to To get
        unless addMissing=false. Re-sending a file is harmless (an identical playlist is not created twice).
        422 when the file is none of these.
      parameters:
        - { name: name, in: query, schema: { type: string, maxLength: 300 }, description: "the file name (names CSV playlists)" }
        - { name: addMissing, in: query, schema: { type: boolean, default: true }, description: add songs not in the library to To get }
        - name: missingMinPlays
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
          description: history only; also add to To get songs played at least this often that aren't in the library (0 = none)
      requestBody:
        required: true
        content:
          application/octet-stream: { schema: { type: string, format: binary } }
      responses:
        '200':
          description: what was imported
          content: { application/json: { schema: { $ref: '#/components/schemas/SpotifyImportResult' } } }
        '413': { description: file too large }
        '422': { description: not a Spotify export file }
  /me/import/lastfm:
    post:
      summary: |
        Import Last.fm scrobbles by user name (default: the connected Last.fm account) through
        user.getRecentTracks, newest first; matches become imported play events (source lastfm). Needs the
        server's Last.fm API key (503 otherwise: use /me/import/lastfm/csv) and a profile that doesn't hide its
        listening. Runs in the background (202); progress in ImportStatus.lastfm. 409 while one is running.
      parameters:
        - { name: wait, in: query, schema: { type: boolean, default: false }, description: run inline }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string, maxLength: 64 }
                maxScrobbles: { type: integer, minimum: 1, maximum: 200000, default: 200000 }
      responses:
        '202':
          description: started; status
          content: { application/json: { schema: { $ref: '#/components/schemas/ImportStatus' } } }
        '409': { description: already running }
        '422': { description: no user name }
        '503': { description: no Last.fm API key on this server }
  /me/import/lastfm/csv:
    post:
      summary: |
        Import a CSV of Last.fm scrobbles (body = the file, up to 20 MiB): artist, album, title, date with no
        header (lastfm-to-csv), or a header naming artist / title (or track) / date (or uts, timestamp).
      parameters:
        - { name: missingMinPlays, in: query, schema: { type: integer, minimum: 0, default: 0 }, description: "also add to To get songs scrobbled at least this often that aren't in the library (0 = none)" }
      requestBody:
        required: true
        content:
          text/csv: { schema: { type: string } }
      responses:
        '200':
          description: what was imported
          content: { application/json: { schema: { $ref: '#/components/schemas/ImportHistoryResult' } } }
        '422': { description: not a scrobbles CSV }
  /me/import/m3u:
    post:
      summary: |
        Import an .m3u / .m3u8 playlist (body = the file, up to 20 MiB) as a new playlist. Entries match by this
        server's stream URL, file path (relative to the library root, or any trailing part of an absolute
        path), then #EXTINF "Artist - Title". Missing songs with an #EXTINF go to To get unless addMissing=false.
      parameters:
        - { name: name, in: query, schema: { type: string, maxLength: 300 }, description: "file name, used when the file has no #PLAYLIST line" }
        - { name: addMissing, in: query, schema: { type: boolean, default: true } }
      requestBody:
        required: true
        content:
          audio/x-mpegurl: { schema: { type: string } }
      responses:
        '200':
          description: the playlist
          content: { application/json: { schema: { $ref: '#/components/schemas/ImportedPlaylist' } } }
        '422': { description: empty playlist file }
  /me/import/history/{source}:
    delete:
      summary: Remove every listen imported from one source (and the play counts it added).
      parameters:
        - { name: source, in: path, required: true, schema: { type: string, enum: [listenbrainz, lastfm, spotify] } }
      responses:
        '200':
          description: removed count + status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ImportStatus'
                  - type: object
                    required: [removed]
                    properties:
                      removed: { type: integer }
  /me/notifications:
    get:
      summary: |
        v7. The user's notifications (bell list), newest first. `since` (createdAt of the newest one you have
        shown) returns only newer ones: Android's periodic WorkManager check uses it to raise system
        notifications without Google push.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: unread, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: notifications
          content:
            application/json:
              schema:
                type: object
                required: [items, unread]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Notification' } }
                  unread: { type: integer, description: unread count (all, not just this page) }
  /me/notifications/read:
    post:
      summary: v7. Mark notifications read (`ids`; omitted = all).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids: { type: array, maxItems: 500, items: { type: string } }
      responses:
        '200':
          description: done
          content:
            application/json:
              schema:
                type: object
                required: [marked, unread]
                properties:
                  marked: { type: integer }
                  unread: { type: integer }
  /library/new:
    get:
      summary: |
        v7. "New this week": albums first added in the last `days` (newest first), then songs added to albums
        that already existed. Family mode applies.
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 90, default: 7 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        '200':
          description: new music
          content:
            application/json:
              schema:
                type: object
                required: [since, days, albums, tracks]
                properties:
                  since: { type: string, format: date-time }
                  days: { type: integer }
                  albums:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Album'
                        - type: object
                          properties:
                            addedAt: { type: string, format: date-time }
                  tracks: { type: array, items: { $ref: '#/components/schemas/Track' } }
  /podcasts:
    get:
      tags: [spoken]
      summary: The caller's subscriptions, newest episode first (family mode hides explicit shows).
      responses:
        '200': { description: subscriptions, content: { application/json: { schema: { type: object, required: [podcasts], properties: { podcasts: { type: array, items: { $ref: '#/components/schemas/Podcast' } } } } } } }
    post:
      tags: [spoken]
      summary: Subscribe by feed URL. The server fetches the feed if new to it. 422 = not a reachable podcast feed; 403 = explicit show while family mode is on.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [feedUrl], properties: { feedUrl: { type: string } } } } } }
      responses:
        '201': { description: subscribed, content: { application/json: { schema: { $ref: '#/components/schemas/Podcast' } } } }
        '403': { description: hidden by family mode }
        '422': { description: bad URL or not a feed }
  /podcasts/search:
    get:
      tags: [spoken]
      summary: Directory search (Podcast Index when the server has a key, and the iTunes Search API). Discovery only - subscribe with the returned feedUrl.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 200 } }
        - { name: limit, in: query, schema: { type: integer, default: 25, minimum: 1, maximum: 50 } }
      responses:
        '200': { description: results, content: { application/json: { schema: { type: object, required: [results, errors], properties: { results: { type: array, items: { $ref: '#/components/schemas/PodcastSearchResult' } }, errors: { type: array, items: { type: string } } } } } } }
  /podcasts/episodes:
    get:
      tags: [spoken]
      summary: Latest episodes across all subscriptions (the "new episodes" inbox).
      parameters:
        - { name: filter, in: query, schema: { type: string, enum: [all, unplayed, in_progress, downloaded], default: unplayed } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 500 } }
      responses:
        '200': { description: episodes, content: { application/json: { schema: { $ref: '#/components/schemas/EpisodeList' } } } }
  /podcasts/episodes/{id}:
    parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
    get:
      tags: [spoken]
      summary: One episode with full description, chapters (feed, Podcasting 2.0 JSON, or embedded) and the show's speed / skip-silence for the caller.
      responses:
        '200': { description: episode, content: { application/json: { schema: { $ref: '#/components/schemas/EpisodeDetail' } } } }
        '404': { description: not found or hidden }
  /podcasts/{id}:
    parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
    get:
      tags: [spoken]
      responses:
        '200': { description: show, content: { application/json: { schema: { $ref: '#/components/schemas/Podcast' } } } }
        '404': { description: not found or hidden }
    patch:
      tags: [spoken]
      summary: Per-user show settings (speed, skipSilence, autoDownload on the phone); serverKeepLast is shared by all subscribers (0 = stream from the feed).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                speed: { type: number, minimum: 0.5, maximum: 3 }
                skipSilence: { type: boolean }
                autoDownload: { type: boolean }
                serverKeepLast: { type: integer, minimum: 0, maximum: 100 }
      responses:
        '200': { description: show, content: { application/json: { schema: { $ref: '#/components/schemas/Podcast' } } } }
        '404': { description: not subscribed }
    delete:
      tags: [spoken]
      summary: Unsubscribe. When nobody subscribes any more the server forgets the feed and deletes its downloads.
      responses: { '204': { description: unsubscribed }, '404': { description: not subscribed } }
  /podcasts/{id}/episodes:
    parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
    get:
      tags: [spoken]
      parameters:
        - { name: filter, in: query, schema: { type: string, enum: [all, unplayed, in_progress, downloaded], default: all } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 1000 } }
      responses:
        '200': { description: episodes newest first, content: { application/json: { schema: { $ref: '#/components/schemas/EpisodeList' } } } }
  /podcasts/{id}/refresh:
    parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
    post:
      tags: [spoken]
      summary: Fetch the feed now.
      responses:
        '200': { description: result, content: { application/json: { schema: { type: object, properties: { id: { type: string }, ok: { type: boolean }, new: { type: integer }, error: { type: string } } } } } }
  /podcasts/{id}/played:
    parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
    post:
      tags: [spoken]
      summary: Mark every episode of the show played.
      responses:
        '200': { description: count, content: { application/json: { schema: { type: object, properties: { marked: { type: integer } } } } } }
  /stream/episode/{id}:
    parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
    get:
      tags: [spoken]
      summary: Episode audio - the server's downloaded copy, else proxied from the feed's enclosure URL with Range passed through. Accepts ?token=.
      responses:
        '200': { description: audio, content: { audio/*: {} } }
        '206': { description: partial audio }
        '404': { description: not found or hidden }
        '502': { description: the podcast host failed }
  /art/podcast/{id}:
    parameters: [ { name: id, in: path, required: true, schema: { type: string } }, { name: size, in: query, schema: { type: integer, default: 512 } } ]
    get:
      tags: [spoken]
      summary: Show cover (JPEG, cached on the server). Accepts ?token=.
      responses: { '200': { description: image, content: { image/jpeg: {} } }, '404': { description: no art } }
  /audiobooks:
    get:
      tags: [spoken]
      parameters:
        - { name: sort, in: query, schema: { type: string, enum: [title, author, added, recent], default: title } }
      responses:
        '200': { description: 'books (enabled = the server has an audiobooks_root)', content: { application/json: { schema: { type: object, required: [enabled, books], properties: { enabled: { type: boolean }, books: { type: array, items: { $ref: '#/components/schemas/Audiobook' } } } } } } }
  /audiobooks/{id}:
    parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
    get:
      tags: [spoken]
      responses:
        '200': { description: book, content: { application/json: { schema: { $ref: '#/components/schemas/AudiobookDetail' } } } }
        '404': { description: not found }
  /audiobooks/{id}/bookmarks:
    parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
    post:
      tags: [spoken]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [positionS], properties: { positionS: { type: number, minimum: 0 }, note: { type: [string, 'null'], maxLength: 1000 } } } } } }
      responses:
        '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/Bookmark' } } } }
  /audiobooks/{id}/bookmarks/{bookmarkId}:
    parameters: [ { name: id, in: path, required: true, schema: { type: string } }, { name: bookmarkId, in: path, required: true, schema: { type: string } } ]
    delete:
      tags: [spoken]
      responses: { '204': { description: deleted }, '404': { description: not found } }
  /stream/book/{id}/{part}:
    parameters: [ { name: id, in: path, required: true, schema: { type: string } }, { name: part, in: path, required: true, schema: { type: integer } } ]
    get:
      tags: [spoken]
      summary: An audiobook part, the original file (Range supported). Accepts ?token=.
      responses: { '200': { description: audio, content: { audio/*: {} } }, '404': { description: not found } }
  /art/book/{id}:
    parameters: [ { name: id, in: path, required: true, schema: { type: string } }, { name: size, in: query, schema: { type: integer, default: 512 } } ]
    get:
      tags: [spoken]
      responses: { '200': { description: image, content: { image/jpeg: {} } }, '404': { description: no art } }
  /stations:
    get:
      tags: [spoken]
      summary: The caller's favourite internet radio stations, most recently played first.
      responses:
        '200': { description: stations, content: { application/json: { schema: { type: object, required: [stations], properties: { stations: { type: array, items: { $ref: '#/components/schemas/Station' } } } } } } }
    post:
      tags: [spoken]
      summary: Add a station (by stream URL, or a Radio Browser result's fields) and make it a favourite. With probe (default) the server connects once, follows .pls/.m3u playlists and reads icy-name/genre/bitrate. HLS is refused (422).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [streamUrl]
              properties:
                streamUrl: { type: string }
                name: { type: string }
                homepage: { type: string }
                imageUrl: { type: string }
                country: { type: string }
                tags: { type: array, items: { type: string } }
                codec: { type: string }
                bitrate: { type: integer }
                explicit: { type: boolean }
                radiobrowserUuid: { type: string }
                probe: { type: boolean, default: true }
      responses:
        '201': { description: added, content: { application/json: { schema: { $ref: '#/components/schemas/Station' } } } }
        '403': { description: explicit station while family mode is on }
        '422': { description: not a playable stream }
  /stations/search:
    get:
      tags: [spoken]
      summary: Search the Radio Browser community directory (at least one of q, tag, country). HLS-only stations are left out.
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: country, in: query, schema: { type: string, description: 'ISO code (2 letters) or name' } }
        - { name: limit, in: query, schema: { type: integer, default: 40, maximum: 100 } }
      responses:
        '200': { description: results, content: { application/json: { schema: { type: object, required: [results], properties: { results: { type: array, items: { $ref: '#/components/schemas/StationSearchResult' } } } } } } }
        '502': { description: directory unavailable }
  /stations/{id}:
    parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
    get:
      tags: [spoken]
      responses: { '200': { description: station, content: { application/json: { schema: { $ref: '#/components/schemas/Station' } } } }, '404': { description: not found } }
    delete:
      tags: [spoken]
      summary: Remove from favourites.
      responses: { '204': { description: removed }, '404': { description: not a favourite } }
  /stations/{id}/now-playing:
    parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
    get:
      tags: [spoken]
      summary: Current ICY StreamTitle (from the server's proxy, or a short probe when nobody listens through it). Poll every ~15 s while playing.
      responses:
        '200': { description: now playing, content: { application/json: { schema: { type: object, required: [stationId, title], properties: { stationId: { type: string }, title: { type: [string, 'null'] }, updatedAt: { type: [string, 'null'] } } } } } }
  /stream/station/{id}:
    parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
    get:
      tags: [spoken]
      summary: The live stream through the server (never ends; not seekable; ICY metadata removed). Accepts ?token=.
      responses: { '200': { description: live audio, content: { audio/*: {} } }, '502': { description: station unreachable } }
  /art/station/{id}:
    parameters: [ { name: id, in: path, required: true, schema: { type: string } }, { name: size, in: query, schema: { type: integer, default: 256 } } ]
    get:
      tags: [spoken]
      responses: { '200': { description: image, content: { image/jpeg: {} } }, '404': { description: no art } }
  /spoken/progress:
    get:
      tags: [spoken]
      summary: Resume positions changed after `since` (all when omitted), oldest change first.
      parameters: [ { name: since, in: query, schema: { type: string } } ]
      responses:
        '200': { description: positions, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/SpokenProgress' } } } } } } }
    put:
      tags: [spoken]
      summary: |
        Store positions (batch; offline devices send their queue). A write whose updatedAt is older than the
        stored one is not applied (applied false, current state returned). Omitted fields keep their value.
        Reaching the last 30 s (or 98 %) marks it played; played true without a position resets it to 0.
        Book positions are book-wide seconds (see AudiobookDetail.parts[].startS).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    required: [kind, id]
                    properties:
                      kind: { type: string, enum: [episode, book] }
                      id: { type: string }
                      positionS: { type: number, minimum: 0 }
                      durationS: { type: number }
                      played: { type: boolean }
                      speed: { type: number, minimum: 0.5, maximum: 3, description: "books only (episodes use the show's speed)" }
                      updatedAt: { type: string, description: when the client recorded it }
      responses:
        '200':
          description: per item
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { type: object, properties: { kind: { type: string }, id: { type: string }, applied: { type: boolean }, progress: { oneOf: [ { $ref: '#/components/schemas/SpokenProgress' }, { type: 'null' } ] } } } }
  /continue:
    get:
      summary: |
        0.8.0 Continue listening, everywhere: music queues left part-way (a playlist, album, mix or radio you
        listened into and didn't finish; not the one playing right now) and podcast episodes / audiobooks in
        progress, most recently played first. Items are ShelfItems of type `queue` (resume with Connect
        `playQueue` without index, or locally at progress.index + progress.positionMs), `episode` or `book`
        (resume at progress.positionMs). Dismissed items are left out until they are played again.
      parameters: [ { name: limit, in: query, schema: { type: integer, default: 20, maximum: 50 } } ]
      responses:
        '200':
          description: items
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ShelfItem' } }
  /continue/{type}/{id}:
    parameters:
      - { name: type, in: path, required: true, schema: { type: string, enum: [queue, episode, book] } }
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      summary: Dismiss an item from Continue listening (it comes back once it is played again).
      responses:
        '204': { description: dismissed }
  /spoken/continue:
    get:
      tags: [spoken]
      summary: Episodes and books in progress, most recently touched first.
      parameters: [ { name: limit, in: query, schema: { type: integer, default: 20 } } ]
      responses:
        '200':
          description: items
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [kind, progress]
                      properties:
                        kind: { type: string, enum: [episode, book] }
                        episode: { $ref: '#/components/schemas/Episode' }
                        book: { $ref: '#/components/schemas/Audiobook' }
                        progress: { $ref: '#/components/schemas/SpokenProgress' }
  /cast/sign-spoken:
    post:
      tags: [spoken]
      summary: Signed URLs for casting an episode, an audiobook (one item per part, or just `part`) or a live station (live true; no duration). Same base URL rules as /cast/sign.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [kind, id], properties: { kind: { type: string, enum: [episode, book, station] }, id: { type: string }, part: { type: integer } } } } } }
      responses:
        '200':
          description: items
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        url: { type: string }
                        artUrl: { type: [string, 'null'] }
                        contentType: { type: string }
                        title: { type: string }
                        subtitle: { type: [string, 'null'] }
                        durationS: { type: [number, 'null'] }
                        startS: { type: number }
                        part: { type: integer }
                        live: { type: boolean }
                        expiresAt: { type: integer }
        '404': { description: not found or hidden }
  /tracks/{trackId}/mix:
    get:
      summary: 0.7 DJ automix analysis of a track, with the energy curve (the compact part is Track.mix).
      parameters: [ { name: trackId, in: path, required: true, schema: { type: string } } ]
      responses:
        '200':
          description: analysis (status failed = the analyser couldn't read it; retried after 14 days or a file change)
          content: { application/json: { schema: { $ref: '#/components/schemas/TrackMixDetail' } } }
        '404': { description: no such track, or not analysed yet }
  /automix/order:
    post:
      summary: |
        0.7 Reorder tracks for DJ flow: tempo (within ±8 %, or half/double time), harmonic key (Camelot), energy
        jumps, and for finite lists (`arc`) an energy arc that builds to ~70 % and eases off. Keeps the list's
        intent: no track moves more than `window` places and with `keepFirst` the first stays first (pass the
        now-playing track first and the upcoming ones after it). Tracks not analysed yet keep their places as far
        as possible. Same multiset of ids back. Clients use it for "Automix" on mixes and playlists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trackIds]
              properties:
                trackIds: { type: array, items: { type: string }, maxItems: 1000 }
                keepFirst: { type: boolean, default: true }
                window: { type: integer, default: 6, minimum: 1, maximum: 50 }
                arc: { type: boolean, default: true }
      responses:
        '200':
          description: the order, and what each transition can be
          content:
            application/json:
              schema:
                type: object
                required: [trackIds, transitions]
                properties:
                  trackIds: { type: array, items: { type: string } }
                  transitions:
                    type: array
                    items:
                      type: object
                      required: [fromId, toId, beatmatch]
                      properties:
                        fromId: { type: string }
                        toId: { type: string }
                        tempoRatio: { type: [number, 'null'], description: 'playback rate for toId so its beats match fromId (× tempoMultiplier)' }
                        tempoMultiplier: { type: [number, 'null'], enum: [1, 2, 0.5, null], description: '2 = toId runs at half the tempo (its beats are every other beat)' }
                        keyDistance: { type: [integer, 'null'], description: 'Camelot steps: 0 same key, 1 adjacent/relative, 2 energy boost, ...' }
                        beatmatch: { type: boolean, description: 'both grids stable and |tempoRatio-1| <= 0.08' }
  /dj/status:
    get:
      summary: |
        0.8.2 Radio DJ voice: whether the server can speak intros, and the caller's DJ settings. `state`: ready |
        downloading (the voice is being fetched on first use; asking starts it) | unavailable (built without
        Piper, or no voice model) | disabled (off in config.toml) | error (`detail` says why). Clients show the
        "Radio DJ" switch when state is not unavailable/disabled.
      responses:
        '200':
          description: status
          content:
            application/json:
              schema:
                type: object
                required: [state, voice, enabled, every]
                properties:
                  state: { type: string, enum: [ready, downloading, unavailable, disabled, error] }
                  voice: { type: string, description: 'Piper voice name, e.g. en_GB-cori-medium' }
                  detail: { type: [string, 'null'] }
                  enabled: { type: boolean, description: "user setting `dj.voice` (default false)" }
                  every: { type: integer, minimum: 1, maximum: 10, description: "user setting `dj.every` (default 3)" }
  /dj/intro:
    post:
      summary: |
        0.8.2 Radio DJ voice: the spoken intro before a song in AI radio or a mix (Piper TTS on the server; facts
        from the song's tags and the artist-page cache). Clients ask for the upcoming song while the one before
        it plays, then play the clip over the song's opening with the music ducked (about 30 %), and only on
        automatic moves to the next song (not after a manual skip), never while casting or on a remote. The
        server decides whether the DJ talks here: only when the user's `dj.voice` is true, before the first
        song (position 0, with the station's name when `queueId` is a radio or mix queue) and then every
        `dj.every` songs; otherwise 204. `force` skips that check (a "say something" button). The same
        (queue, position, songs) on the same day gives the same words and clip.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trackId, position]
              properties:
                trackId: { type: string, description: the song about to play }
                previousTrackId: { type: [string, 'null'], description: the song that just played (back-announced) }
                queueId: { type: [string, 'null'] }
                position: { type: integer, minimum: 0, description: "trackId's position in the queue" }
                force: { type: boolean, default: false }
      responses:
        '200':
          description: the intro
          content:
            application/json:
              schema:
                type: object
                required: [clipId, text, url, durationMs, voice]
                properties:
                  clipId: { type: string }
                  text: { type: string, description: what is said (for captions / accessibility) }
                  url: { type: string, description: 'relative to the API base: stream/dj/{clipId}' }
                  durationMs: { type: integer }
                  voice: { type: string }
        '204': { description: the DJ stays quiet before this song }
        '404': { description: unknown track }
        '503': { description: "the voice isn't ready (see GET /dj/status); play the song without an intro" }
  /stream/dj/{clipId}:
    get:
      summary: |
        0.8.2 A spoken DJ clip (Ogg Opus, mono). Like other /stream paths it also accepts `?token=` for
        <audio> elements in cross-origin clients. Clips are cached on the server and may be pruned after a while.
      parameters: [ { name: clipId, in: path, required: true, schema: { type: string, pattern: '^[0-9a-f]{32}$' } } ]
      responses:
        '200':
          description: the clip
          content: { audio/ogg: { schema: { type: string, format: binary } } }
        '404': { description: 'no such clip (expired, so ask /dj/intro again)' }
components:
  securitySchemes:
    device: { type: http, scheme: bearer }
    voice: { type: http, scheme: bearer, description: 'voice token (nmv_…) from POST /me/voice/tokens; only for /voice/command' }
    jamGuest: { type: apiKey, in: header, name: X-Jam-Token, description: 'Jam guest token (jg_…) from POST /jam/join/{code}' }
  schemas:
    VoiceResult:
      type: object
      required: [ok, intent, speech]
      properties:
        ok: { type: boolean }
        intent: { type: string, enum: [play, pause, resume, next, previous, volume, now_playing, unknown] }
        speech: { type: string, description: 'what to say back, e.g. "Playing Pop radio on Elijah bedroom display."' }
        device:
          type: object
          required: [id, name]
          properties: { id: { type: string }, name: { type: string } }
        item:
          type: object
          description: what was (or would be) played / is playing
          required: [kind, title]
          properties:
            kind: { type: string, description: 'playlist | album | artist | song | mix | radio | vibe | moment' }
            id: { type: [string, 'null'] }
            title: { type: string }
        queueId: { type: string }
    VoiceToken:
      type: object
      required: [id, name, createdAt, lastUsed]
      properties:
        id: { type: string }
        name: { type: string }
        createdAt: { type: string }
        lastUsed: { type: [string, 'null'] }
    VoiceDevice:
      type: object
      required: [id, name, kind, online, aliases, isDefault]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, description: 'android | web | desktop | watch | speaker | other (accept unknown kinds)' }
        castType: { type: string }
        online: { type: boolean }
        aliases: { type: array, items: { type: string } }
        isDefault: { type: boolean }
    UploadVisibility:
      type: string
      enum: [everyone, private]
      default: everyone
      description: v7. private = only the uploader sees the track
    UploadOverview:
      type: object
      required: [canUpload, enabled, usedBytes, maxFileBytes, chunkBytes, maxChunkBytes, formats, files, sessions]
      properties:
        canUpload: { type: boolean }
        enabled: { type: boolean, description: the server has an upload folder }
        quotaBytes: { type: [integer, 'null'], description: null = unlimited }
        usedBytes: { type: integer, description: finished uploads plus space reserved by unfinished ones }
        maxFileBytes: { type: integer }
        chunkBytes: { type: integer, description: recommended chunk size }
        maxChunkBytes: { type: integer }
        formats: { type: array, items: { type: string, enum: [flac, mp3, m4a, aac, ogg, opus, wav] } }
        files: { type: array, items: { $ref: '#/components/schemas/UploadedFile' } }
        sessions: { type: array, items: { $ref: '#/components/schemas/UploadSession' } }
    UploadSession:
      type: object
      required: [id, filename, bytes, offset, visibility, status]
      properties:
        id: { type: string }
        filename: { type: string }
        bytes: { type: integer }
        offset: { type: integer, description: bytes the server has }
        visibility: { $ref: '#/components/schemas/UploadVisibility' }
        status: { type: string, enum: [uploading, done, failed] }
        error: { type: [string, 'null'] }
        createdAt: { type: string }
        updatedAt: { type: string }
        upload: { oneOf: [ { $ref: '#/components/schemas/UploadedFile' }, { type: 'null' } ] }
    UploadedFile:
      type: object
      required: [id, path, trackId, bytes, format, visibility, indexed]
      properties:
        id: { type: string }
        userId: { type: [string, 'null'] }
        username: { type: [string, 'null'] }
        path: { type: string, description: relative to the upload folder }
        trackId: { type: string, description: the library track (once indexed) }
        bytes: { type: integer }
        originalName: { type: string }
        format: { type: string, enum: [flac, mp3, m4a, aac, ogg, opus, wav] }
        visibility: { $ref: '#/components/schemas/UploadVisibility' }
        createdAt: { type: string }
        indexed: { type: boolean, description: the track is in the library }
        title: { type: [string, 'null'] }
        artist: { type: [string, 'null'] }
        album: { type: [string, 'null'] }
        durationS: { type: [number, 'null'] }
    AdminUploadUser:
      type: object
      required: [userId, username, canUpload, usedBytes, files]
      properties:
        userId: { type: string }
        username: { type: string }
        isAdmin: { type: boolean }
        canUpload: { type: boolean }
        explicit: { type: boolean, description: an admin set canUpload (else the default) }
        quotaBytes: { type: [integer, 'null'], description: null = unlimited }
        usedBytes: { type: integer }
        files: { type: integer }
    JamSettings:
      type: object
      required: [approval, allowPlayNext, maxPerGuest]
      properties:
        approval: { type: boolean, description: guest adds wait for the host's approval }
        allowPlayNext: { type: boolean, description: guests may add right after the current song }
        maxPerGuest: { type: [integer, 'null'], minimum: 1, maximum: 50, description: 'songs waiting per guest (pending + upcoming); null = no cap' }
    JamSettingsPatch:
      type: object
      properties:
        approval: { type: boolean }
        allowPlayNext: { type: boolean }
        maxPerGuest: { type: [integer, 'null'], minimum: 1, maximum: 50 }
    JamTrack:
      type: object
      description: What guests see of a track (no paths, sizes, ratings or other per-user data).
      required: [id, title, artist, album, albumId, durationS]
      properties:
        id: { type: string }
        title: { type: string }
        artist: { type: string }
        album: { type: string }
        albumId: { type: string }
        durationS: { type: number }
    JamAdder:
      type: object
      required: [name, isHost]
      properties:
        guestId: { type: [string, 'null'] }
        name: { type: string, description: plain text, never HTML }
        isHost: { type: boolean }
    JamVotes:
      type: object
      properties:
        up: { type: integer }
        down: { type: integer }
        mine: { type: integer, enum: [-1, 0, 1] }
    JamEntry:
      type: object
      properties:
        position: { type: integer, description: index in the host queue }
        track: { $ref: '#/components/schemas/JamTrack' }
        addedBy: { $ref: '#/components/schemas/JamAdder' }
        votes: { $ref: '#/components/schemas/JamVotes' }
    JamNowPlaying:
      allOf:
        - $ref: '#/components/schemas/JamEntry'
        - type: object
          description: Extrapolate like Connect - positionMs + (serverTime-corrected now - positionAt) * speed while playing.
          properties:
            positionMs: { type: integer }
            positionAt: { type: string, format: date-time }
            playing: { type: boolean }
            speed: { type: number }
    JamRequest:
      type: object
      properties:
        id: { type: string }
        trackId: { type: string }
        track: { oneOf: [{ $ref: '#/components/schemas/JamTrack' }, { type: 'null' }] }
        playNext: { type: boolean }
        status: { type: string, enum: [pending, queued, rejected, withdrawn, removed] }
        createdAt: { type: string, format: date-time }
        by: { oneOf: [{ type: object, properties: { guestId: { type: string }, name: { type: string } } }, { type: 'null' }], description: null = the host }
    JamSnapshot:
      type: object
      description: |
        Everything a Jam screen shows. Host view adds jam.joinCode/joinUrl/lanJoinUrl/joinExpiresAt/queueId and
        lists every pending request; a guest sees only their own pending requests plus `me.waiting`/`remaining`.
      properties:
        jam:
          type: object
          properties:
            id: { type: string }
            hostName: { type: string }
            settings: { $ref: '#/components/schemas/JamSettings' }
            createdAt: { type: string, format: date-time }
            expiresAt: { type: string, format: date-time }
            ended: { type: boolean }
            joinCode: { type: [string, 'null'], description: host only; null = link closed }
            joinUrl: { type: [string, 'null'], description: 'host only: public link (tunnel_url/jam/<code>)' }
            lanJoinUrl: { type: [string, 'null'], description: 'host only: LAN link (self-signed certificate warning on guests'' phones)' }
            joinExpiresAt: { type: [string, 'null'], format: date-time }
            queueId: { type: string, description: host only; the queue guests add to }
        serverTime: { type: string, format: date-time }
        nowPlaying: { oneOf: [{ $ref: '#/components/schemas/JamNowPlaying' }, { type: 'null' }] }
        upcoming: { type: array, items: { $ref: '#/components/schemas/JamEntry' }, description: up to 100 after the current song }
        pending: { type: array, items: { $ref: '#/components/schemas/JamRequest' } }
        guests:
          type: array
          items: { type: object, properties: { id: { type: string }, name: { type: string }, isMember: { type: boolean } } }
        me:
          type: object
          properties:
            guestId: { type: [string, 'null'] }
            name: { type: string }
            isHost: { type: boolean }
            isMember: { type: boolean, description: a signed-in user of this server (may listen along on their own device) }
            waiting: { type: integer }
            remaining: { type: [integer, 'null'] }
            expiresAt: { type: string, format: date-time }
    AdminUserDetail:
      allOf:
        - $ref: '#/components/schemas/AdminUser'
        - type: object
          properties:
            devices: { type: array, items: { $ref: '#/components/schemas/Device' } }
            lastActivity: { type: [string, 'null'], format: date-time }
            eventCount: { type: integer }
    JobStatus:
      type: object
      required: [name, state]
      properties:
        name: { type: string }
        state: { type: string, enum: [idle, running, failed], description: failed = the last run failed }
        startedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        ok: { type: [boolean, 'null'] }
        durationS: { type: [number, 'null'] }
        error: { type: [string, 'null'] }
        result: { description: the last run's result object }
        nextRunAt: { type: [string, 'null'], format: date-time, description: ISO-8601 UTC; null if not scheduled }
        running: { type: boolean }
        history: { type: array, items: { type: object }, description: the last 20 run records of this job }
    JobRun:
      type: object
      required: [id, name, startedAt]
      properties:
        id: { type: string }
        name: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        ok: { type: [boolean, 'null'] }
        durationS: { type: [number, 'null'] }
        error: { type: [string, 'null'] }
        trigger: { type: string, enum: [schedule, manual, chained] }
        summary: { type: [string, 'null'], description: 'e.g. "added=0, updated=0, unchanged=1409"' }
    ServerStatus:
      type: object
      properties:
        version: { type: string }
        uptimeS: { type: number }
        cpuPct: { type: [number, 'null'] }
        load: { type: array, items: { type: number }, description: 1, 5, 15-minute load averages }
        memUsedBytes: { type: [integer, 'null'] }
        memTotalBytes: { type: [integer, 'null'] }
        disks:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              path: { type: string }
              usedBytes: { type: integer }
              totalBytes: { type: integer }
        dataBytes: { type: integer, description: size of the data volume's contents }
        library:
          type: object
          properties:
            tracks: { type: integer }
            albums: { type: integer }
            artists: { type: integer }
            missing: { type: integer }
            hours: { type: number }
            gb: { type: number }
            users: { type: integer }
            lastScan: { type: [object, 'null'] }
        analysis:
          type: object
          properties:
            done: { type: integer }
            total: { type: integer }
            failed: { type: integer }
            pending: { type: integer }
            ratePerHour: { type: [number, 'null'] }
            etaS: { type: [number, 'null'] }
            modelVersion: { type: [string, 'null'], description: version being written (may be a fallback) }
            configured: { type: string }
            fallbackReason: { type: [string, 'null'] }
            running: { type: boolean }
        explicit:
          type: object
          description: v6 explicit-flag counts over present tracks
          properties:
            deezerEnabled: { type: boolean }
            explicit: { type: integer }
            probable: { type: integer }
            clean: { type: integer }
            unknown: { type: integer }
        lyrics:
          type: object
          properties:
            lrclibEnabled: { type: boolean }
            cached: { type: integer }
            found: { type: integer }
            notFound: { type: integer }
        jobs: { type: array, items: { $ref: '#/components/schemas/JobStatus' } }
    FailedFile:
      type: object
      required: [id, path, stage, error, attempts]
      properties:
        id: { type: string }
        path: { type: string }
        stage: { type: string, enum: [scan, analyse, transcode] }
        error: { type: string }
        attempts: { type: integer }
        lastTriedAt: { type: [string, 'null'], format: date-time }
        trackId: { type: [string, 'null'] }
    HealthCheck:
      type: object
      required: [id, title, count]
      properties:
        id: { type: string, enum: [missing, duplicates, missing_tags, missing_art, unanalysed, orphan_cache, old_backups] }
        title: { type: string }
        description: { type: string }
        count: { type: integer }
        bytes: { type: [integer, 'null'] }
        fix: { oneOf: [ { type: object, properties: { label: { type: string }, destructive: { type: boolean } } }, { type: 'null' } ] }
    HealthItem:
      type: object
      required: [id, title]
      properties:
        id: { type: string, description: 'track id (missing, missing_tags, unanalysed), album id (missing_art), "<kind>:<file>" (orphan_cache), backup id (old_backups), "<reason>:<key>" (duplicates)' }
        title: { type: string }
        detail: { type: [string, 'null'] }
        path: { type: [string, 'null'] }
        bytes: { type: [integer, 'null'] }
        group: { type: [string, 'null'], description: duplicates — all copies' paths joined with " · " }
        trackIds: { type: array, items: { type: string }, description: duplicates only }
        paths: { type: array, items: { type: string }, description: duplicates only }
        missing: { type: array, items: { type: string }, description: missing_tags only }
    ServerHealth:
      type: object
      properties:
        version: { type: string }
        serverId: { type: string }
        startedAt: { type: string, format: date-time }
        uptimeS: { type: number }
        python: { type: string }
        sqlite: { type: string }
        cpu: { type: object, properties: { cores: { type: integer }, percent: { type: [number, 'null'] }, load1: { type: [number, 'null'] }, load5: { type: [number, 'null'] }, load15: { type: [number, 'null'] } } }
        memory: { type: object, properties: { totalBytes: { type: [integer, 'null'] }, availableBytes: { type: [integer, 'null'] }, processRssBytes: { type: [integer, 'null'] } } }
        disks: { type: object, additionalProperties: { type: object, properties: { path: { type: string }, totalBytes: { type: integer }, freeBytes: { type: integer } } } }
        dataDirBytes: { type: integer }
        databaseBytes: { type: integer }
        opusCache: { type: object, properties: { files: { type: integer }, bytes: { type: integer }, limitBytes: { type: integer } } }
        artCacheBytes: { type: integer }
    LogEntry:
      type: object
      properties:
        seq: { type: integer }
        at: { type: string, format: date-time }
        level: { type: string, enum: [DEBUG, INFO, WARNING, ERROR, CRITICAL] }
        logger: { type: string }
        message: { type: string }
    Backup:
      type: object
      properties:
        id: { type: string, description: also the file name }
        name: { type: string }
        kind: { type: string, enum: [manual, migration, prune] }
        note: { type: [string, 'null'] }
        bytes: { type: integer }
        createdAt: { type: string, format: date-time }
    NowPlayingRow:
      type: object
      properties:
        userId: { type: string }
        username: { type: string }
        deviceId: { type: string }
        deviceName: { type: string }
        kind: { $ref: '#/components/schemas/DeviceKind' }
        online: { type: boolean }
        isActive: { type: boolean }
        playing: { type: boolean }
        positionMs: { type: integer, description: extrapolated to now while playing }
        track: { oneOf: [ { $ref: '#/components/schemas/Track' }, { type: 'null' } ] }
    AdminSettingValues:
      type: object
      description: Any subset on PUT; null removes an override.
      properties:
        lanUrl: { type: [string, 'null'], description: 'public LAN address incl. port, e.g. https://192.168.68.2:8443 (QR, /server-info)' }
        tunnelUrl: { type: [string, 'null'], description: 'https://host[:port][/path]; "" = no tunnel address' }
        timezone: { type: [string, 'null'], description: IANA zone }
        opusCacheMaxGb: { type: [number, 'null'], minimum: 1, maximum: 2000 }
        lrclib: { type: [boolean, 'null'], description: LRCLIB lyrics fallback on/off }
        explicitDeezer: { type: [boolean, 'null'], description: 'v6: the explicit job asks Deezer about untagged tracks' }
        serverName: { type: [string, 'null'], maxLength: 60 }
    AdminSettings:
      allOf:
        - $ref: '#/components/schemas/AdminSettingValues'
        - type: object
          properties:
            overrides: { type: object, description: the keys set in the database }
            fromConfig: { $ref: '#/components/schemas/AdminSettingValues' }
    BugReportIn:
      type: object
      required: [logs]
      properties:
        description: { type: [string, 'null'], maxLength: 5000, description: 'first line becomes the title' }
        appVersion: { type: [string, 'null'], maxLength: 50 }
        platform: { type: [string, 'null'], maxLength: 100, description: 'e.g. "Android 15 · Pixel 8"' }
        logs: { type: string, description: app log text }
        crash: { type: [string, 'null'], description: crash dump / stack trace }
        extra: { type: [object, 'null'], description: 'free-form diagnostic fields (shown to admins as context)' }
    BugReport:
      type: object
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        title: { type: string, description: 'description''s first line (<= 80 chars), else the crash''s, else "Report from <device>"' }
        status: { type: string, enum: [open, closed] }
        username: { type: string }
        user: { type: object, properties: { id: { type: string }, username: { type: string } } }
        deviceId: { type: [string, 'null'] }
        deviceName: { type: [string, 'null'] }
        kind: { type: [string, 'null'] }
        appVersion: { type: [string, 'null'] }
        platform: { type: [string, 'null'] }
        hasCrash: { type: boolean }
        bytes: { type: integer }
        expiresAt: { type: string, format: date-time }
    BugReportDetail:
      allOf:
        - $ref: '#/components/schemas/BugReport'
        - type: object
          properties:
            description: { type: string }
            logs: { type: string }
            crash: { type: [string, 'null'] }
            context: { type: [object, 'null'] }
    ShelfFeed:
      type: object
      required: [shelves]
      properties:
        shelves: { type: array, items: { $ref: '#/components/schemas/Shelf' } }
    Shelf:
      type: object
      description: A typed, generically renderable row of items. Unknown kinds/types must be skipped by clients.
      required: [id, kind, title, items]
      properties:
        id: { type: string, description: 'stable id for ordering/hiding (e.g. "recently_played", "byp:album:<id>")' }
        kind: { type: string, enum: [start_radio, devices, recently_played, continue_listening, pinned, mixes, radio, because_you_played, release_radar, suggestions, to_get, blends, wrapped] }
        title: { type: string }
        subtitle: { type: [string, 'null'] }
        layout: { type: string, enum: [button, row, grid2], description: 'hint: grid2 = 2-row quick-pick grid (Recently played)' }
        items: { type: array, items: { $ref: '#/components/schemas/ShelfItem' } }
    ShelfItem:
      type: object
      description: |
        Generic card. `type` says what tapping it does; the matching optional object carries the details.
        `artUrl` is RELATIVE TO THE API BASE (/api/v1/), e.g. "art/<albumId>" or "catalog/<id>/cover"; null = no art.
      required: [type, id, title]
      properties:
        type: { type: string, enum: [track, album, artist, playlist, mix, radio, queue, device, catalog, suggestion, toget, smart_list, smart_playlist, genre, folder, blend, wrapped, episode, book] }
        id: { type: string }
        title: { type: string }
        subtitle: { type: [string, 'null'] }
        artUrl: { type: [string, 'null'] }
        track: { $ref: '#/components/schemas/Track' }
        album: { $ref: '#/components/schemas/Album' }
        artist: { $ref: '#/components/schemas/Artist' }
        playlist: { $ref: '#/components/schemas/Playlist' }
        queue: { $ref: '#/components/schemas/Queue' }
        mix: { type: object, properties: { kind: { type: string }, trackCount: { type: integer }, durationS: { type: number } } }
        seed: { $ref: '#/components/schemas/RadioSeed' }
        smartPlaylist: { $ref: '#/components/schemas/SmartPlaylist' }
        device:
          type: object
          properties:
            kind: { $ref: '#/components/schemas/DeviceKind' }
            canPlay: { type: boolean }
            isActive: { type: boolean }
            playing: { type: boolean }
            nowPlaying: { oneOf: [ { $ref: '#/components/schemas/Track' }, { type: 'null' } ] }
        progress:
          type: object
          description: >-
            continue_listening — where you left off. Queues: index/count/positionMs/queueId (resume = playQueue
            without index). Episodes/books (0.8.0): positionMs (book-wide), durationMs and fraction (0..1, null
            when the length is unknown).
          properties:
            index: { type: integer }
            count: { type: integer }
            positionMs: { type: integer }
            queueId: { type: [string, 'null'] }
            durationMs: { type: [integer, 'null'] }
            fraction: { type: [number, 'null'] }
        updatedAt: { type: [string, 'null'], description: 'continue_listening (0.8.0): when it was last played' }
        episode: { $ref: '#/components/schemas/Episode', description: 'type episode (0.8.0)' }
        book: { $ref: '#/components/schemas/Audiobook', description: 'type book (0.8.0)' }
        catalog: { $ref: '#/components/schemas/CatalogItem' }
        suggestion: { $ref: '#/components/schemas/Suggestion' }
        toget: { $ref: '#/components/schemas/ToGetItem' }
        playedAt: { type: [string, 'null'], format: date-time }
        release: { $ref: '#/components/schemas/ReleaseInfo' }
        addedAt: { type: [string, 'null'], description: 'release_radar:library — when the album was added' }
        blend:
          type: object
          description: blends shelf — status "new" = the "Start a blend" card
          properties:
            status: { type: string, enum: [joined, invited, new] }
            matchPct: { type: [integer, 'null'] }
            trackCount: { type: integer }
            members: { type: array, items: { type: string }, description: usernames }
        wrapped:
          type: object
          properties:
            year: { type: integer }
            final: { type: boolean }
    ReleaseInfo:
      type: object
      properties:
        date: { type: [string, 'null'], description: 'YYYY[-MM[-DD]] first release date' }
        type: { type: [string, 'null'], description: Album, EP, Single }
        upcoming: { type: boolean, description: announced, not out yet }
        artist: { type: [string, 'null'] }
    ReleaseRadar:
      type: object
      required: [inLibrary, notOwned]
      properties:
        updatedAt: { type: [string, 'null'], description: last weekly refresh; null = never ran }
        windowDays: { type: integer }
        inLibrary: { type: array, items: { $ref: '#/components/schemas/ShelfItem' }, description: album items }
        notOwned: { type: array, items: { $ref: '#/components/schemas/ShelfItem' }, description: catalog items }
    WrappedCount:
      type: object
      properties:
        plays: { type: integer }
        minutes: { type: number }
    WrappedArtist:
      allOf:
        - $ref: '#/components/schemas/WrappedCount'
        - type: object
          properties:
            artist: { $ref: '#/components/schemas/Artist' }
            artUrl: { type: [string, 'null'] }
    WrappedStatsBase:
      type: object
      required: [year, final, totals, topTracks, topArtists, topAlbums, topGenres, byHour, byWeekday, byMonth]
      properties:
        year: { type: integer }
        final: { type: boolean, description: the year is over }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time, description: end of the year, or now while it's running }
        timezone: { type: string }
        totals:
          type: object
          properties:
            minutes: { type: integer }
            plays: { type: integer }
            skips: { type: integer }
            tracks: { type: integer, description: distinct tracks played }
            artists: { type: integer }
            albums: { type: integer }
            days: { type: integer, description: days with at least one play }
        topTracks: { type: array, items: { allOf: [ { $ref: '#/components/schemas/WrappedCount' }, { type: object, properties: { track: { $ref: '#/components/schemas/Track' } } } ] } }
        topArtists: { type: array, items: { $ref: '#/components/schemas/WrappedArtist' }, description: by minutes }
        topAlbums: { type: array, items: { allOf: [ { $ref: '#/components/schemas/WrappedCount' }, { type: object, properties: { album: { $ref: '#/components/schemas/Album' } } } ] } }
        topGenres: { type: array, items: { type: object, properties: { name: { type: string }, minutes: { type: number }, share: { type: number, description: 0..1 } } } }
        byHour: { type: array, items: { type: number }, description: 24 values, minutes per local hour }
        byWeekday: { type: array, items: { type: number }, description: '7 values, Monday first' }
        byMonth: { type: array, items: { type: number }, description: 12 values }
        peakHour: { type: [integer, 'null'] }
        peakWeekday: { type: [integer, 'null'], description: 0 = Monday }
        topDay: { oneOf: [ { type: object, properties: { date: { type: string, format: date }, minutes: { type: integer } } }, { type: 'null' } ] }
        aura: { oneOf: [ { $ref: '#/components/schemas/AudioAura' }, { type: 'null' } ], description: null until tracks are analysed }
    Wrapped:
      allOf:
        - $ref: '#/components/schemas/WrappedStatsBase'
        - type: object
          properties:
            streaks:
              type: object
              properties:
                longest: { type: integer, description: consecutive local days with plays }
                longestFrom: { type: [string, 'null'], format: date }
                longestTo: { type: [string, 'null'], format: date }
                current: { type: integer, description: counting back from today (or yesterday); 0 for a past year }
            discoveries:
              type: object
              description: artists / tracks you first played in this period
              properties:
                artists: { type: integer }
                tracks: { type: integer }
                share: { type: number, description: share of minutes spent on newly discovered artists }
                topArtists: { type: array, items: { $ref: '#/components/schemas/WrappedArtist' } }
            firstPlay: { oneOf: [ { type: object, properties: { track: { $ref: '#/components/schemas/Track' }, at: { type: string, format: date-time } } }, { type: 'null' } ] }
    ServerWrapped:
      allOf:
        - $ref: '#/components/schemas/WrappedStatsBase'
        - type: object
          properties:
            listeners: { type: integer, description: users with at least one play }
            users: { type: integer, description: enabled accounts }
    AudioAura:
      type: object
      description: Minutes-weighted average of the Essentia features of what you played.
      properties:
        label: { type: string, description: 'Electric, Fierce, Charged, Sunlit, Midnight, Drift, Golden, Velvet, Balanced' }
        description: { type: string }
        energy: { type: number }
        danceability: { type: [number, 'null'] }
        valence: { type: [number, 'null'], description: happy − sad, −1..1; null without mood models }
        bpm: { type: [integer, 'null'] }
        moods: { type: array, items: { type: object, properties: { name: { type: string, enum: [happy, sad, relaxed, aggressive, party] }, score: { type: number } } } }
        colors: { type: array, items: { type: string }, minItems: 2, maxItems: 2, description: '"#rrggbb" gradient' }
    BlendMember:
      type: object
      properties:
        userId: { type: string }
        username: { type: string }
        status: { type: string, enum: [joined, invited] }
        joinedAt: { type: [string, 'null'] }
    Blend:
      type: object
      required: [id, name, members, myStatus]
      properties:
        id: { type: string }
        name: { type: string }
        createdBy: { type: object, properties: { userId: { type: string }, username: { type: string } } }
        myStatus: { type: string, enum: [joined, invited] }
        invitedBy: { type: [string, 'null'], description: username, for an invite }
        members: { type: array, items: { $ref: '#/components/schemas/BlendMember' } }
        matchPct: { type: [integer, 'null'], description: 'taste match 0–100 of the joined members (mean of pairs); members only' }
        pairs: { type: array, items: { type: object, properties: { a: { type: string }, b: { type: string }, aName: { type: string }, bName: { type: string }, pct: { type: [integer, 'null'] } } } }
        trackCount: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string, description: last rebuild }
        tracks:
          type: array
          description: members only (empty for invitees and in lists)
          items:
            type: object
            properties:
              track: { $ref: '#/components/schemas/Track' }
              forUsers: { type: array, items: { type: string }, description: 'user ids whose taste put it here (first = main); render "because Alex plays…"' }
              reason: { type: string, enum: [shared, top, match], description: "shared = two or more members love it; top = one member's favourite; match = theirs, likely to suit the others" }
    PinType:
      type: string
      enum: [album, artist, playlist, mix, queue, smart_list, smart_playlist, genre, folder]
    RadioSeed:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [random, track, artist, album, playlist, smart_playlist, moment, vibe] }
        id: { type: [string, 'null'], description: required unless type=random / moment / vibe }
        title: { type: [string, 'null'], description: set by the server in responses }
        text: { type: [string, 'null'], maxLength: 200, description: 'vibe: what the user typed or said' }
        constraints: { type: [array, 'null'], items: { $ref: '#/components/schemas/VibeConstraint' }, description: 'vibe: chips (from /radio/vibe/parse); the server re-validates them' }
        explanation: { type: [string, 'null'], description: 'responses: why these picks ("Because it''s Friday evening and you''ve been playing upbeat pop.")' }
        steering: { type: [string, 'null'], description: 'responses: short steering summary, e.g. "more energy, less like Coldplay"' }
    RadioContext:
      type: object
      description: Smart-shuffle hints; all optional. Missing hour / weekday come from the server clock in the user's timezone, the device from the registered device kind.
      properties:
        localHour: { type: [integer, 'null'], minimum: 0, maximum: 23 }
        weekday: { type: [integer, 'null'], minimum: 1, maximum: 7, description: ISO, 1 = Monday }
        deviceKind: { type: [string, 'null'], enum: [phone, car, speaker, desktop, watch, web, tv, null] }
        output: { type: [string, 'null'], description: 'as EventContext.output (car / cast / bluetooth:<name> ...)' }
        motion: { type: [string, 'null'] }
        workout: { type: [string, 'null'] }
    VibeConstraint:
      type: object
      description: One interpreted chip. Clients show `label` and may remove chips; they need not understand the rest.
      required: [id, kind, label]
      properties:
        id: { type: string, description: stable for the same meaning }
        kind: { type: string, enum: [energy, tempo, danceability, year, vocals, mood, genre, familiarity, like] }
        label: { type: string, example: High energy }
        min: { type: number }
        max: { type: number }
        value: { type: string, description: 'vocals: instrumental | vocal; mood: canonical mood; genre: words; familiarity: familiar | discover; like: artist id' }
        weight: { type: number, description: 'mood: 1 or -1 ("not sad")' }
        exclude: { type: boolean, description: 'genre: "no metal"' }
        name: { type: string, description: 'like: artist name' }
    RadioSteerRef:
      type: object
      required: [type, id]
      properties:
        type: { type: string, enum: [track, artist] }
        id: { type: string }
        name: { type: [string, 'null'] }
    RadioStation:
      type: object
      required: [radioId, kind, title, stationKey, steering]
      properties:
        queueId: { type: string }
        radioId: { type: string }
        kind: { type: string, enum: [random, track, artist, album, playlist, moment, vibe] }
        seedId: { type: [string, 'null'] }
        title: { type: string }
        stationKey: { type: string, description: "what steering is remembered under: 'moment:car', 'vibe:…', 'artist:<id>', 'random'" }
        explanation: { type: [string, 'null'] }
        text: { type: [string, 'null'] }
        constraints: { type: [array, 'null'], items: { $ref: '#/components/schemas/VibeConstraint' } }
        context: { type: [object, 'null'], description: 'moment: {localHour, weekday, deviceKind, motion, workout} it was chosen for' }
        steeringSummary: { type: [string, 'null'] }
        steering:
          type: object
          required: [energy, variety, moreLike, lessLike, never]
          properties:
            energy: { type: integer, minimum: -3, maximum: 3 }
            variety: { type: integer, minimum: -2, maximum: 2, description: '+ more variety, - more familiar' }
            moreLike: { type: array, items: { $ref: '#/components/schemas/RadioSteerRef' } }
            lessLike: { type: array, items: { $ref: '#/components/schemas/RadioSteerRef' } }
            never: { type: array, items: { $ref: '#/components/schemas/RadioSteerRef' } }
    SearchResults:
      type: object
      required: [query, top, tracks, albums, artists, playlists, queues, catalog]
      properties:
        query: { type: string }
        top: { oneOf: [ { $ref: '#/components/schemas/ShelfItem' }, { type: 'null' } ], description: best single match (library first, else catalogue) }
        tracks: { type: array, items: { $ref: '#/components/schemas/Track' } }
        albums: { type: array, items: { $ref: '#/components/schemas/Album' } }
        artists: { type: array, items: { $ref: '#/components/schemas/Artist' } }
        playlists: { type: array, items: { $ref: '#/components/schemas/Playlist' } }
        queues: { type: array, items: { $ref: '#/components/schemas/Queue' } }
        catalog: { type: array, items: { $ref: '#/components/schemas/CatalogItem' }, description: '"Not in your library" — owned items are filtered out unless scope=catalog' }
        catalogError: { type: [string, 'null'] }
    CatalogItem:
      type: object
      description: |
        Music from the online catalogue. `id` is opaque (e.g. "dz:album:302127", "dz:track:3135556",
        "dz:artist:27", "mb:rg:<mbid>"). `owned` = matched to the library by MBID, else by normalised names.
      required: [id, type, title, owned, hasPreview, links]
      properties:
        id: { type: string }
        type: { type: string, enum: [album, track, artist] }
        title: { type: string }
        artist: { type: [string, 'null'] }
        album: { type: [string, 'null'], description: for tracks }
        year: { type: [integer, 'null'] }
        durationS: { type: [number, 'null'] }
        mbid: { type: [string, 'null'] }
        artUrl: { type: [string, 'null'], description: 'relative to the API base, "catalog/<id>/cover"' }
        hasPreview: { type: boolean, description: 'GET catalog/<id>/preview plays a 30 s sample' }
        owned: { type: boolean }
        ownedId: { type: [string, 'null'], description: the library album/track/artist id when owned }
        toGet: { oneOf: [ { type: object, properties: { id: { type: string }, status: { type: string } } }, { type: 'null' } ] }
        links: { type: array, items: { type: object, properties: { name: { type: string }, url: { type: string } } }, description: buy/search links (Bandcamp, Qobuz) }
    ToGetItem:
      type: object
      required: [id, type, title, artist, status, createdAt, links]
      properties:
        id: { type: string }
        type: { type: string, enum: [album, track] }
        title: { type: string }
        artist: { type: string }
        year: { type: [integer, 'null'] }
        mbid: { type: [string, 'null'] }
        catalogId: { type: [string, 'null'] }
        artUrl: { type: [string, 'null'] }
        hasPreview: { type: boolean }
        note: { type: [string, 'null'] }
        status: { type: string, enum: [want, got, dismissed] }
        source: { type: string, enum: [search, suggestion, manual] }
        suggestionId: { type: [string, 'null'] }
        ownedId: { type: [string, 'null'], description: library album/track id once got by a scan }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        gotAt: { type: [string, 'null'], format: date-time }
        links: { type: array, items: { type: object, properties: { name: { type: string }, url: { type: string } } } }
        adminAdded:
          description: Schema v8. The admin checked this item off as added to the library (null = not yet).
          oneOf:
            - type: 'null'
            - type: object
              required: [at]
              properties:
                at: { type: string, format: date-time }
                note: { type: [string, 'null'] }
    AdminWantItem:
      description: Schema v8. A ToGetItem of any user, with the admin's check-off.
      allOf:
        - $ref: '#/components/schemas/ToGetItem'
        - type: object
          required: [userId, username, done, suggestDone]
          properties:
            userId: { type: string }
            username: { type: string }
            done: { type: boolean, description: checked off by an admin }
            doneAt: { type: [string, 'null'], format: date-time }
            doneNote: { type: [string, 'null'] }
            doneBy: { type: [string, 'null'], description: username of the admin who checked it }
            doneAuto: { type: boolean, description: checked via "found in the library" }
            suggestDone:
              type: boolean
              description: not checked yet, but found in the library (a scan/upload matched it, or the user marked it got)
    AdminWantUser:
      type: object
      required: [userId, username, open, done, found, total]
      properties:
        userId: { type: string }
        username: { type: string }
        open: { type: integer, description: not checked and not dismissed }
        done: { type: integer }
        found: { type: integer, description: not checked but found in the library }
        total: { type: integer }
    DeviceKind:
      type: string
      enum: [android, web, desktop, watch, other]
    Session:
      type: object
      required: [userId, username, isAdmin, deviceId, deviceToken]
      properties:
        userId: { type: string }
        username: { type: string }
        isAdmin: { type: boolean }
        deviceId: { type: string }
        deviceToken: { type: string }
    ServerInfo:
      type: object
      required: [serverId, name, version, lanUrl, registration]
      properties:
        serverId: { type: string }
        name: { type: string }
        version: { type: string }
        lanUrl: { type: string }
        tunnelUrl: { type: [string, 'null'] }
        certSha256: { type: [string, 'null'], description: LAN certificate SHA-256 (DER), colon-separated upper-case hex }
        registration: { type: string, enum: [invite] }
    User:
      type: object
      required: [id, username, isAdmin, createdAt]
      properties:
        id: { type: string }
        username: { type: string }
        isAdmin: { type: boolean }
        createdAt: { type: string, format: date-time }
        lastLogin: { type: [string, 'null'], format: date-time }
    AdminUser:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [disabled, deviceCount]
          properties:
            disabled: { type: boolean }
            deviceCount: { type: integer, description: active (non-revoked) devices }
            lastActivity: { type: [string, 'null'], format: date-time, description: 'v4: latest of last login, device last seen, last event' }
    Device:
      type: object
      required: [id, name, kind, createdAt, online, current]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { $ref: '#/components/schemas/DeviceKind' }
        appVersion: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        lastSeen: { type: [string, 'null'], format: date-time }
        online: { type: boolean, description: connected to /connect right now }
        current: { type: boolean, description: the device making this request }
    Invite:
      type: object
      required: [code, url, createdAt, expiresAt, createdBy]
      properties:
        code: { type: string }
        url: { type: string }
        note: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        createdBy: { type: string, description: username }
        usedBy: { type: [string, 'null'], description: username }
        usedAt: { type: [string, 'null'], format: date-time }
    TrackInfo:
      allOf:
        - $ref: '#/components/schemas/Track'
        - type: object
          properties:
            fileName: { type: string }
            folder: { type: string, description: relative to the library root }
            albumArtist: { type: [string, 'null'] }
            composer: { type: [string, 'null'] }
            lyricist: { type: [string, 'null'] }
            comment: { type: [string, 'null'] }
            codec: { type: [string, 'null'], description: 'e.g. FLAC, MP3, AAC, Opus, Vorbis' }
            bitrateKbps: { type: [integer, 'null'] }
            sampleRate: { type: [integer, 'null'], description: Hz }
            bitsPerSample: { type: [integer, 'null'] }
            channels: { type: [integer, 'null'] }
            fileBytes: { type: integer }
            addedAt: { type: string, format: date-time }
            playCount: { type: integer, description: the caller's }
            skipCount: { type: integer }
            lastPlayed: { type: [string, 'null'], format: date-time }
    Playlist:
      type: object
      required: [id, name, createdAt, updatedAt, trackCount, durationS]
      properties:
        id: { type: string }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        trackCount: { type: integer }
        durationS: { type: number }
        ownerId: { type: string, description: v5 }
        owner: { type: [string, 'null'], description: 'v5: owner username' }
        role: { type: string, enum: [owner, editor, viewer], description: 'v5: the caller''s role' }
        rev: { type: integer, description: 'v5: bumped on every change (compare with Connect `playlist` messages)' }
        memberCount: { type: integer, description: 'v5: members besides the owner' }
        collaborative: { type: boolean, description: 'v5: memberCount > 0' }
    PlaylistDetail:
      allOf:
        - $ref: '#/components/schemas/Playlist'
        - type: object
          required: [tracks]
          properties:
            tracks: { type: array, items: { $ref: '#/components/schemas/Track' }, description: 'in order; array index = position. Tracks whose file is gone stay listed with missing=true.' }
            entries:
              type: array
              description: 'v5: parallel to `tracks` (same length and order): the entry id to use in entry operations, and who added it'
              items: { $ref: '#/components/schemas/PlaylistEntry' }
    PlaylistEntry:
      type: object
      required: [id, trackId, addedAt]
      properties:
        id: { type: string }
        trackId: { type: string }
        addedAt: { type: string, format: date-time }
        addedById: { type: [string, 'null'] }
        addedBy: { type: [string, 'null'], description: username (null if that user was deleted) }
    PlaylistMember:
      type: object
      required: [userId, username, role]
      properties:
        userId: { type: string }
        username: { type: string }
        role: { type: string, enum: [owner, editor, viewer] }
        addedAt: { type: string, format: date-time }
    PlaylistActivity:
      type: object
      required: [id, at, action]
      properties:
        id: { type: integer }
        at: { type: string, format: date-time }
        userId: { type: [string, 'null'] }
        user: { type: [string, 'null'] }
        action: { type: string, enum: [create, rename, add, remove, move, member_add, member_role, member_remove, leave] }
        trackId: { type: [string, 'null'], description: 'add/remove/move: the (first) track' }
        trackTitle: { type: [string, 'null'] }
        detail: { type: object, description: 'count, from/to (rename), user/role (members)' }
    TagValues:
      type: object
      description: 'Tag fields. In an edit, omitted = unchanged; null or "" = clear the tag (lyrics: back to the file''s).'
      properties:
        title: { type: [string, 'null'] }
        artist: { type: [string, 'null'] }
        albumArtist: { type: [string, 'null'] }
        album: { type: [string, 'null'] }
        trackNo: { type: [integer, 'null'] }
        discNo: { type: [integer, 'null'] }
        year: { type: [integer, 'null'] }
        genre: { type: [string, 'null'] }
        lyrics: { type: [string, 'null'], description: 'only in edits: LRC or plain text, shown to everyone (lyrics source `library`)' }
        explicit: { type: [string, 'null'], enum: [explicit, clean, null], description: 'v6, only in edits: admin verdict; null = automatic' }
    TagEditResult:
      type: object
      required: [batchId, changed]
      properties:
        batchId: { type: string }
        changed: { type: integer, description: number of (track, field) changes logged }
        albumId: { type: string, description: 'cover upload only: the album id afterwards' }
    TrackTagDetail:
      type: object
      required: [trackId, path, file, effective, overridden]
      properties:
        trackId: { type: string }
        path: { type: string }
        albumId: { type: string }
        file: { $ref: '#/components/schemas/TagValues', description: what the music file says }
        effective: { $ref: '#/components/schemas/TagValues', description: 'what everyone sees (file + overrides)' }
        overridden: { type: array, items: { type: string }, description: 'field names with an override (incl. lyrics, cover)' }
        overrides:
          type: array
          items:
            type: object
            properties: { field: { type: string }, value: {}, updatedAt: { type: string }, updatedBy: { type: [string, 'null'] } }
        lyrics: { type: [string, 'null'], description: the library-wide lyrics override }
        hasCoverOverride: { type: boolean }
        explicit: { $ref: '#/components/schemas/ExplicitEvidence' }
    TagEditLogEntry:
      type: object
      properties:
        id: { type: integer }
        batchId: { type: string, description: one admin action; a bulk edit is one batch }
        trackId: { type: string }
        trackTitle: { type: string }
        path: { type: string }
        at: { type: string, format: date-time }
        user: { type: [string, 'null'] }
        action: { type: string, enum: [set, revert] }
        field: { type: string }
        oldValue: { description: effective value before (lyrics truncated to 200 chars) }
        newValue: { description: effective value after }
    TagSuggestion:
      type: object
      description: 'A MusicBrainz candidate. Recordings: title/artist/album/... per release. Releases: album-level fields.'
      properties:
        score: { type: [integer, 'null'] }
        recordingMbid: { type: [string, 'null'] }
        releaseMbid: { type: [string, 'null'] }
        title: { type: [string, 'null'] }
        artist: { type: [string, 'null'] }
        album: { type: [string, 'null'] }
        albumArtist: { type: [string, 'null'] }
        year: { type: [integer, 'null'] }
        trackNo: { type: [integer, 'null'] }
        discNo: { type: [integer, 'null'] }
        country: { type: [string, 'null'] }
        trackCount: { type: [integer, 'null'] }
        format: { type: [string, 'null'] }
    AutotagValues:
      description: 'v6: TagValues plus MusicBrainz ids (applied as tag overrides; artist ids change artist ids to mb:<mbid>)'
      allOf:
        - $ref: '#/components/schemas/TagValues'
        - type: object
          properties:
            mbRecordingId: { type: [string, 'null'] }
            mbReleaseGroupId: { type: [string, 'null'] }
            mbArtistId: { type: [string, 'null'] }
            mbAlbumArtistId: { type: [string, 'null'] }
    AutotagStatus:
      type: object
      properties:
        apiKeyConfigured: { type: boolean }
        fpcalcAvailable: { type: boolean }
        running: { type: boolean }
        tracks: { type: integer }
        fingerprinted: { type: integer }
        fingerprintFailed: { type: integer }
        matched: { type: integer, description: AcoustID found recordings }
        noMatch: { type: integer }
        lookupErrors: { type: integer }
        pending: { type: integer }
        accepted: { type: integer }
        rejected: { type: integer }
    AutotagGroup:
      type: object
      required: [groupId, albumId, confidence, tracks]
      properties:
        groupId: { type: string }
        albumId: { type: string, description: the album when it was matched }
        currentAlbum: { type: [string, 'null'] }
        currentAlbumArtist: { type: [string, 'null'] }
        albumHasArt: { type: boolean }
        confidence: { type: number, description: '0..1: mean track confidence, lowered when the release explains only part of the album' }
        albumTrackCount: { type: integer }
        release:
          type: [object, 'null']
          description: the chosen MusicBrainz release (null = recording-only matches)
          properties:
            mbid: { type: string }
            title: { type: [string, 'null'] }
            artist: { type: [string, 'null'] }
            year: { type: [integer, 'null'] }
            country: { type: [string, 'null'] }
            format: { type: [string, 'null'] }
            trackCount: { type: [integer, 'null'] }
            type: { type: [string, 'null'] }
            hasCover: { type: boolean, description: 'GET /admin/autotag/cover/{mbid}' }
        tracks: { type: array, items: { $ref: '#/components/schemas/AutotagSuggestion' } }
    AutotagSuggestion:
      type: object
      required: [trackId, path, status, confidence, current, suggested, changes, defaultFields]
      properties:
        trackId: { type: string }
        path: { type: string }
        status: { type: string, enum: [pending, accepted, rejected] }
        confidence: { type: number, description: '0..1: AcoustID score x duration match x agreement with the current tags x release match' }
        current: { $ref: '#/components/schemas/AutotagValues' }
        suggested: { $ref: '#/components/schemas/AutotagValues', description: only the fields MusicBrainz provides }
        changes: { type: array, items: { type: string }, description: suggested fields that differ from current }
        defaultFields: { type: array, items: { type: string }, description: 'what an accept applies by default: core tags and recording/release-group ids; genre only when empty; artist ids are opt-in' }
        recordingMbid: { type: [string, 'null'] }
        releaseMbid: { type: [string, 'null'] }
        durationS: { type: number }
        detail: { type: object, description: 'acoustidScore, durationDiffS, agreement, onRelease, releaseTitle, ...' }
        decidedAt: { type: [string, 'null'] }
        batchId: { type: [string, 'null'], description: 'accepted: the tag edit batch' }
    AutotagSelection:
      type: object
      properties:
        trackIds: { type: array, items: { type: string } }
        groupIds: { type: array, items: { type: string } }
    TrackIdList:
      type: object
      required: [trackIds]
      properties:
        trackIds: { type: array, items: { type: string }, minItems: 1 }
    DuplicateGroup:
      type: object
      required: [groupId, tracks]
      properties:
        groupId: { type: string }
        similarity: { type: [number, 'null'], description: lowest pairwise fingerprint similarity (0..1) }
        hiddenCount: { type: integer }
        tracks:
          type: array
          description: best copy to keep first
          items:
            type: object
            properties:
              id: { type: string }
              path: { type: string }
              title: { type: string }
              artist: { type: string }
              album: { type: string }
              durationS: { type: number }
              codec: { type: [string, 'null'] }
              bitrate: { type: [integer, 'null'] }
              sampleRate: { type: [integer, 'null'] }
              bitsPerSample: { type: [integer, 'null'] }
              bytes: { type: integer }
              hidden: { type: boolean }
              keptId: { type: [string, 'null'], description: 'hidden: the copy kept instead' }
              recommended: { type: boolean }
    Queue:
      type: object
      required: [id, name, slot, currentIndex, positionMs, trackCount, durationS, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        slot: { type: integer, minimum: 1, maximum: 20, description: 'display number, as in "20. Search: conver"' }
        currentIndex: { type: integer }
        positionMs: { type: integer }
        trackCount: { type: integer }
        durationS: { type: number }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        source: { oneOf: [ { $ref: '#/components/schemas/QueueSource' }, { type: 'null' } ] }
        radio: { oneOf: [ { $ref: '#/components/schemas/RadioSeed' }, { type: 'null' } ], description: 'set on radio queues (POST /radio)' }
    QueueSource:
      type: object
      description: What a queue was started from; drives Home's Recently played / Continue listening.
      required: [type]
      properties:
        type: { type: string, enum: [album, artist, playlist, mix, radio, genre, folder, smart_list, smart_playlist, search, other] }
        id: { type: [string, 'null'] }
    QueueDetail:
      allOf:
        - $ref: '#/components/schemas/Queue'
        - type: object
          required: [tracks]
          properties:
            tracks: { type: array, items: { $ref: '#/components/schemas/Track' }, description: 'array index = position; missing files stay listed with missing=true' }
    Move:
      type: object
      required: [from, to]
      properties:
        from: { type: integer, minimum: 0 }
        to: { type: integer, minimum: 0, description: the moved item's index after the move }
    PlaybackState:
      type: object
      description: Connect playback state (docs/v2.md §5). `rev` is set by the server and increments on every change.
      properties:
        activeDeviceId: { type: [string, 'null'] }
        queueId: { type: [string, 'null'] }
        index: { type: integer }
        trackId: { type: [string, 'null'] }
        positionMs: { type: integer }
        positionAt: { type: string, format: date-time, description: when positionMs was true; extrapolate while playing }
        playing: { type: boolean }
        volume: { type: number, minimum: 0, maximum: 1 }
        shuffle: { type: boolean }
        repeat: { type: string, enum: ['off', all, one] }
        speed: { type: number }
        castTo:
          type: [string, 'null']
          description: >-
            the active phone is playing through a Google Cast session it started (full Android build) — the
            speaker's name. Show "Casting to <castTo>". Omitted in a state report = not casting.
        connecting:
          type: boolean
          description: >-
            set by the server (clients don't report it): the active device is a speaker that is still
            connecting/loading. `playing` is false until it has started.
        media:
          description: >-
            0.8.0: a podcast episode, audiobook or live station is playing instead of the music queue (queueId and
            trackId are null; positionMs is the position in the whole episode/book, 0 for a station). null or
            omitted = music. A state report with trackId/queueId and no `media` clears it.
          oneOf:
            - { type: 'null' }
            - type: object
              required: [kind, id]
              properties:
                kind: { type: string, enum: [episode, book, station] }
                id: { type: string }
        rev: { type: integer }
    ConnectDevice:
      type: object
      required: [id, name, kind, canPlay, online, isActive]
      properties:
        id: { type: string, description: 'speakers: `spk:<castType>:<id>`' }
        name: { type: string }
        kind:
          type: string
          enum: [android, web, desktop, watch, other, speaker]
          description: a DeviceKind, or `speaker` for a server-side cast target (clients must accept unknown kinds)
        canPlay: { type: boolean }
        online: { type: boolean }
        isActive: { type: boolean }
        castType:
          type: [string, 'null']
          enum: [chromecast, dlna, homeassistant, snapcast, null]
          description: speakers only
    Speaker:
      type: object
      required: [id, name, castType, kind, canPlay, online, busy]
      properties:
        id: { type: string }
        name: { type: string }
        castType: { type: string, enum: [chromecast, dlna, homeassistant, snapcast] }
        kind: { type: string, enum: [speaker] }
        canPlay: { type: boolean }
        online: { type: boolean }
        busy: { type: boolean, description: playing for some user right now }
    SpeakerList:
      type: object
      required: [speakers, mediaBaseUrl]
      properties:
        speakers: { type: array, items: { $ref: '#/components/schemas/Speaker' } }
        mediaBaseUrl: { type: string, description: where speakers fetch audio (cast_media_url or http://lan_host:cast_port) }
        errors: { type: object, additionalProperties: { type: string }, description: discovery errors per backend }
    UserSettings:
      type: object
      required: [settings]
      properties:
        settings: { type: object, additionalProperties: true, description: 'key → JSON value' }
    DataSummary:
      type: object
      required: [events, signals]
      properties:
        events:
          type: object
          properties:
            count: { type: integer }
            withContext: { type: integer }
            first: { type: [string, 'null'], format: date-time }
            last: { type: [string, 'null'], format: date-time }
        signals:
          type: object
          description: 'per signal name (listening, output, device, motion, location, weather, search, time, health)'
          additionalProperties:
            type: object
            properties:
              enabled: { type: boolean, description: the user-level switch }
              fields: { type: array, items: { type: string } }
              count: { type: integer, description: events carrying at least one of these fields }
              first: { type: [string, 'null'], format: date-time }
              last: { type: [string, 'null'], format: date-time }
    EventContext:
      type: object
      description: |
        Optional listening context (docs/v2.md §10). Clients include only fields whose switch is on; the server
        drops fields whose switch is off (user setting `context.<signal>`, or a `device.<deviceId>.context.<signal>`
        override) and fields it doesn't know, and fills `weather` itself from `geohash5` when `context.weather` is
        on (geohash5 is only stored when `context.location` is on). Signals → fields: listening (seeks,
        volumeChanges, repeatOfPrevious, addedFrom, sessionId, sessionPosition), output (output), device
        (deviceKind, network, charging, batteryPct, screenOn), motion (motion, cadenceSpm), location (place,
        geohash5), weather (weather), search (searchQuery), time (localHour, weekday, holiday), health
        (heartRate, workout).
      additionalProperties: false
      properties:
        seeks: { type: array, items: { type: object, properties: { fromMs: { type: integer }, toMs: { type: integer } } } }
        volumeChanges: { type: array, items: { type: object, properties: { atMs: { type: integer }, volume: { type: number } } } }
        repeatOfPrevious: { type: boolean }
        addedFrom: { type: string, description: 'search, queue, mix, playlist, album, artist, folder, …' }
        sessionId: { type: string }
        sessionPosition: { type: integer }
        output: { type: string, description: 'speaker | wired | bluetooth:<device name> | cast | car' }
        deviceKind: { type: string }
        network: { type: string, enum: [wifi, cellular, ethernet, none] }
        charging: { type: boolean }
        batteryPct: { type: integer }
        screenOn: { type: boolean }
        motion: { type: string, enum: [still, walking, running, vehicle] }
        cadenceSpm: { type: number }
        place: { type: string, description: 'user-named cluster label: home, work, gym, place-3' }
        geohash5: { type: string, minLength: 5, maxLength: 5 }
        weather: { type: object, description: 'set by the server', properties: { condition: { type: string }, tempC: { type: number }, code: { type: integer } } }
        searchQuery: { type: string }
        localHour: { type: integer, minimum: 0, maximum: 23 }
        weekday: { type: integer, minimum: 1, maximum: 7, description: ISO weekday, 1 = Monday }
        holiday: { type: [string, 'null'] }
        heartRate: { type: number }
        workout: { type: string }
    SmartRule:
      type: object
      required: [field, op]
      description: |
        One condition. Field types (from /smart-playlists/fields): number/percent (ops eq ne gt gte lt lte between;
        percent values are 0..1, between takes [lo, hi]), text (is isNot contains notContains startsWith;
        case-insensitive), date (inLast notInLast with `unit` days|weeks|months|years, before/after YYYY-MM-DD,
        never, ever), bool (is isNot with true/false), enum (is isNot one of `options`), playlist (is isNot
        with a playlist or smart playlist id). Fields: playCount skipCount skipRate lastPlayed addedAt
        favouritedAt favourite rating thumbs(up|down|none) genre artist album title year decade("1990")
        durationS energy danceability tempo mood(happy|sad|relaxed|aggressive|party|acoustic) explicit inPlaylist.
      properties:
        field: { type: string }
        op: { type: string }
        value: { description: 'number, [number, number], string, boolean or date by field type; omitted for never/ever' }
        unit: { type: string, enum: [days, weeks, months, years] }
    SmartRuleGroup:
      type: object
      required: [match, rules]
      properties:
        match: { type: string, enum: [all, any] }
        rules:
          type: array
          maxItems: 60
          items: { oneOf: [ { $ref: '#/components/schemas/SmartRule' }, { $ref: '#/components/schemas/SmartRuleGroup' } ] }
    SmartPlaylistDefinition:
      description: A rule group (nested at most 3 deep, at most 60 rules) plus sort and limit. No rules = all tracks.
      allOf:
        - $ref: '#/components/schemas/SmartRuleGroup'
        - type: object
          properties:
            sort:
              type: string
              default: random
              enum: [random, most_played, least_played, recently_added, oldest_added, recently_played,
                     least_recently_played, recently_favourited, rating, title, artist, album, year_newest,
                     year_oldest, duration_longest, duration_shortest, energy_high, energy_low, tempo_fast, tempo_slow]
              description: random is a stable shuffle that changes daily
            limit:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [songs, minutes, none] }
                value: { type: integer, minimum: 1 }
    SmartPlaylist:
      type: object
      required: [id, name, definition, trackCount, durationS, rev]
      properties:
        id: { type: string }
        name: { type: string }
        definition: { $ref: '#/components/schemas/SmartPlaylistDefinition' }
        preset: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        refreshedAt: { type: [string, 'null'], format: date-time }
        trackCount: { type: integer }
        durationS: { type: number }
        rev: { type: integer, description: bumped whenever the track list changes (re-download when it does) }
    SmartPlaylistDetail:
      allOf:
        - $ref: '#/components/schemas/SmartPlaylist'
        - type: object
          required: [tracks]
          properties:
            tracks: { type: array, items: { $ref: '#/components/schemas/Track' } }
    SmartPlaylistFields:
      type: object
      required: [fields, sorts, units, presets]
      properties:
        fields:
          type: array
          items:
            type: object
            required: [id, label, type, ops]
            properties:
              id: { type: string }
              label: { type: string }
              type: { type: string, enum: [number, percent, text, date, bool, enum, playlist] }
              ops: { type: array, items: { type: string } }
              options: { type: array, items: { type: string } }
              suggest: { type: string, enum: [genres, artists], description: where clients can get value suggestions }
              unit: { type: string }
        sorts: { type: array, items: { type: object, properties: { id: { type: string }, label: { type: string } } } }
        units: { type: array, items: { type: string } }
        presets:
          type: array
          items:
            type: object
            required: [id, name, definition]
            properties:
              id: { type: string }
              name: { type: string }
              description: { type: string }
              definition: { $ref: '#/components/schemas/SmartPlaylistDefinition' }
    ArtistLink:
      type: object
      required: [kind, url]
      properties:
        kind: { type: string, enum: [musicbrainz, wikipedia, wikidata, official, discogs, bandcamp, allmusic, lastfm, songkick, soundcloud, youtube] }
        url: { type: string }
    ArtistInfo:
      type: object
      required: [status]
      description: 'Online metadata (MusicBrainz, Wikidata, Wikipedia, Wikimedia Commons), cached on the server and refreshed rarely.'
      properties:
        status: { type: string, enum: [ok, not_found, error, pending, none], description: 'pending = a lookup is running; none = lookups are turned off on the server' }
        fetchedAt: { type: string, format: date-time }
        mbid: { type: [string, 'null'] }
        type: { type: [string, 'null'], description: 'Person, Group, ...' }
        disambiguation: { type: [string, 'null'] }
        country: { type: [string, 'null'] }
        area: { type: [string, 'null'] }
        beginArea: { type: [string, 'null'] }
        lifeSpan: { type: object, properties: { begin: { type: [string, 'null'] }, end: { type: [string, 'null'] }, ended: { type: boolean } } }
        yearsActive: { type: object, properties: { from: { type: [integer, 'null'] }, to: { type: [integer, 'null'] } } }
        genres: { type: array, items: { type: string } }
        links: { type: array, items: { $ref: '#/components/schemas/ArtistLink' } }
        bio:
          type: [object, 'null']
          description: Wikipedia summary; show its source link and licence
          properties:
            text: { type: string }
            source: { type: string }
            url: { type: string }
            license: { type: string }
            licenseUrl: { type: string }
        image:
          type: [object, 'null']
          description: Credits of the photo at photoUrl (always show author + licence with the photo)
          properties:
            source: { type: string }
            author: { type: [string, 'null'] }
            license: { type: [string, 'null'] }
            licenseUrl: { type: [string, 'null'] }
            filePage: { type: [string, 'null'] }
            credit: { type: [string, 'null'] }
    ArtistPage:
      type: object
      required: [id, name, info, stats, topTracks, albums, singles, appearsOn, similar, radioSeed]
      properties:
        id: { type: string }
        name: { type: string }
        mbid: { type: [string, 'null'] }
        artUrl: { type: [string, 'null'], description: 'photo, else an album cover; relative to the API base' }
        photoUrl: { type: [string, 'null'], description: 'art/artist/<id> when a photo is cached' }
        info: { $ref: '#/components/schemas/ArtistInfo' }
        stats:
          type: object
          properties:
            trackCount: { type: integer }
            durationS: { type: number }
            playCount: { type: integer, description: the caller's plays }
            albumCount: { type: integer }
            singleCount: { type: integer }
        topTracks:
          description: by the caller's plays (then everyone's, then album order), up to 10
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/Track'
              - type: object
                properties: { playCount: { type: integer } }
        albums: { type: array, items: { $ref: '#/components/schemas/Album' } }
        singles: { type: array, items: { $ref: '#/components/schemas/Album' }, description: 'releases with 3 tracks or fewer' }
        appearsOn: { type: array, items: { $ref: '#/components/schemas/Album' }, description: other artists' albums with tracks by this artist }
        similar:
          type: array
          description: library artists that sound alike (AI audio embeddings), best first
          items:
            allOf:
              - $ref: '#/components/schemas/Artist'
              - type: object
                properties:
                  similarity: { type: number, minimum: 0, maximum: 1 }
                  artUrl: { type: [string, 'null'] }
        radioSeed: { $ref: '#/components/schemas/RadioSeed' }
    Artist:
      type: object
      required: [id, name, albumCount]
      properties:
        id: { type: string }
        name: { type: string }
        albumCount: { type: integer }
        mbid: { type: [string, 'null'] }
    Album:
      type: object
      required: [id, title, artistId, artist, trackCount]
      properties:
        id: { type: string }
        title: { type: string }
        artistId: { type: string }
        artist: { type: string }
        year: { type: [integer, 'null'] }
        trackCount: { type: integer }
        durationS: { type: number }
        hasArt: { type: boolean }
        mbid: { type: [string, 'null'] }
        explicit: { type: boolean, description: 'v6: contains explicit tracks (among those the caller can see): "E" badge' }
    Track:
      type: object
      required: [id, title, artistId, artist, albumId, album, durationS, starred]
      properties:
        id: { type: string }
        title: { type: string }
        artistId: { type: string }
        artist: { type: string }
        albumId: { type: string }
        album: { type: string }
        trackNo: { type: [integer, 'null'] }
        discNo: { type: [integer, 'null'] }
        year: { type: [integer, 'null'] }
        genre: { type: [string, 'null'] }
        durationS: { type: number }
        flacBytes: { type: integer, description: size of the original file }
        starred: { type: boolean }
        rating: { type: [integer, 'null'], minimum: 1, maximum: 5, description: the caller's }
        missing: { type: boolean, description: 'only present (true) in playlists/queues when the file is gone' }
        replayGain:
          $ref: '#/components/schemas/ReplayGain'
        explicit:
          $ref: '#/components/schemas/ExplicitStatus'
        familyHidden: { type: boolean, description: 'v6, queues/playlists only (true): hidden by the caller''s family mode; skip it' }
        mix:
          $ref: '#/components/schemas/TrackMix'
    ExplicitStatus:
      type: string
      enum: [explicit, probable, clean, unknown]
      description: 'v6. probable = the lyrics word list found swearing (not certain). Show "E" for explicit.'
    FamilyMode:
      type: object
      required: [enabled, hideProbable, hideUnknown, locked, hasPin]
      properties:
        enabled: { type: boolean }
        hideProbable: { type: boolean, description: default true }
        hideUnknown: { type: boolean, description: default false }
        locked: { type: boolean, description: set by an admin; the user can only tighten it }
        hasPin: { type: boolean, description: 'an unlock PIN exists (else admin-only unlock)' }
    AdminFamilyUser:
      allOf:
        - $ref: '#/components/schemas/FamilyMode'
        - type: object
          properties:
            userId: { type: string }
            username: { type: string }
            isAdmin: { type: boolean }
            lockedBy: { type: [string, 'null'] }
    ExplicitEvidence:
      type: object
      properties:
        status: { $ref: '#/components/schemas/ExplicitStatus' }
        source: { type: [string, 'null'], enum: [admin, tags, deezer, lyrics, null] }
        admin: { type: [string, 'null'], enum: [explicit, clean, null] }
        tags: { type: [string, 'null'], enum: [explicit, clean, null] }
        deezer: { type: [string, 'null'], enum: [explicit, clean, not_found, null] }
        deezerId: { type: [integer, 'null'] }
        lyrics: { type: [string, 'null'], enum: [probable, clean, none, null] }
        lyricsHits: { type: [integer, 'null'] }
        updatedAt: { type: [string, 'null'] }
    ExplicitReview:
      type: object
      properties:
        total: { type: integer }
        counts: { type: object, additionalProperties: { type: integer } }
        items:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/ExplicitEvidence'
              - type: object
                properties:
                  trackId: { type: string }
                  title: { type: string }
                  artist: { type: string }
                  album: { type: string }
                  albumId: { type: string }
    AutoEqEntry:
      type: object
      required: [id, name, source, form]
      properties:
        id: { type: string, description: 'path under AutoEq results/, e.g. "oratory1990/over-ear/Sennheiser HD 650"' }
        name: { type: string }
        source: { type: string, description: who measured it }
        rig: { type: [string, 'null'], description: measurement rig when the source used several }
        form: { type: string, description: 'over-ear, in-ear, earbud' }
    AutoEqProfile:
      allOf:
        - $ref: '#/components/schemas/AutoEqEntry'
        - type: object
          required: [preampDb, filters]
          properties:
            preampDb: { type: number, description: '<= 0; apply before the filters to avoid clipping' }
            filters:
              type: array
              items:
                type: object
                required: [type, fc, gainDb, q]
                properties:
                  type: { type: string, enum: [PK, LSC, HSC], description: 'peaking, low shelf, high shelf (RBJ cookbook, Q as given)' }
                  fc: { type: number, description: Hz }
                  gainDb: { type: number }
                  q: { type: number }
    ReplayGain:
      type: object
      description: |
        Volume levelling values on the ReplayGain 2.0 scale (reference -18 LUFS). Absent from a Track until the file's
        gain tags were read or its loudness was measured (EBU R128, ffmpeg ebur128). Clients multiply the signal by
        10^((gain + preamp)/20), limited so that peak * factor <= 1 when clipping prevention is on.
      required: [trackGain]
      properties:
        trackGain: { type: number, description: dB }
        trackPeak: { type: [number, 'null'], description: 'linear sample peak, 1.0 = full scale' }
        albumGain: { type: [number, 'null'], description: 'dB; null until every track of the album is levelled' }
        albumPeak: { type: [number, 'null'] }
    Lyrics:
      type: object
      required: [trackId, synced, source, lines, text]
      properties:
        trackId: { type: string }
        synced: { type: boolean, description: 'true when every line has a timeMs (LRC timestamps)' }
        source: { type: string, enum: [user, library, embedded, lrc_file, lrclib], description: 'library = edited by an admin for everyone (v5)' }
        sources: { type: array, items: { type: string, enum: [user, library, embedded, lrc_file, lrclib] }, description: 'every source that has lyrics for this track (for the source dropdown)' }
        canEdit: { type: boolean, description: 'always true in v2: the caller may PUT their own lyrics' }
        lines:
          type: array
          description: In display order. Synced lines are sorted by timeMs; a line repeated at several timestamps appears once per timestamp.
          items:
            type: object
            required: [text]
            properties:
              timeMs: { type: [integer, 'null'], description: 'start time in ms (LRC offset tag already applied); null when unsynced' }
              text: { type: string, description: 'may be empty for instrumental gaps' }
              words:
                type: array
                description: >-
                  0.8.1, optional: word-by-word timings when the lyrics are enhanced LRC
                  (`[00:12.00]<00:12.00>Hello <00:12.50>world`). Each entry is a piece of `text` (with its trailing
                  space) and when it starts; the pieces joined give `text`. Absent for plain line-synced lyrics.
                items:
                  type: object
                  required: [timeMs, text]
                  properties:
                    timeMs: { type: integer, description: 'start time in ms, offset applied like the line''s' }
                    text: { type: string }
        text: { type: string, description: 'plain lyrics without timestamps, one line per lyric line' }
    MixTrack:
      type: object
      required: [track, reason]
      properties:
        track: { $ref: '#/components/schemas/Track' }
        reason: { type: string, description: short "why this song" line }
    Mix:
      type: object
      required: [id, kind, title, createdAt, tracks]
      properties:
        id: { type: string }
        kind: { type: string, enum: [daily, morning, evening, deep_cuts, more_like, context], description: 'context = listening-context mixes (Workout, Drive, Late night, At <place>; docs/v2.md §10)' }
        title: { type: string }
        createdAt: { type: string, format: date-time }
        durationS: { type: number }
        tracks: { type: array, items: { $ref: '#/components/schemas/MixTrack' } }
    SyncManifest:
      type: object
      required: [generatedAt, items]
      properties:
        generatedAt: { type: string, format: date-time }
        items:
          type: array
          items:
            type: object
            required: [trackId, format, why]
            properties:
              trackId: { type: string }
              format: { type: string, enum: [opus, flac] }
              why: { type: string, enum: [mix, favourite] }
              mixIds: { type: array, items: { type: string } }
              durationS: { type: number }
              bytes: { type: integer, description: size of the file /stream will return for this format }
              bytesExact:
                type: boolean
                description: |
                  true = `bytes` is exact (FLAC, or Opus already in the transcode cache). false = estimate
                  from duration x bitrate; the server pre-transcodes manifest tracks after the nightly run,
                  so by sync time Opus sizes are normally exact.
    SmartCandidates:
      type: object
      required: [generatedAt, items]
      properties:
        generatedAt: { type: string, format: date-time }
        items:
          type: array
          items:
            type: object
            required: [trackId, reasons, score]
            properties:
              trackId: { type: string }
              reasons:
                type: array
                items: { type: string, enum: [favourite, mix, week_mix, recent, release_radar, foryou, predicted] }
              score: { type: number, minimum: 0, maximum: 1, description: "AI likelihood the user wants this track soon (percentile rank); 0 when unknown" }
              plays: { type: integer }
              lastPlayedAt: { type: [string, 'null'], format: date-time }
              durationS: { type: [number, 'null'] }
              flacBytes: { type: [integer, 'null'], description: size of the original file (format=flac stream) }
              track: { oneOf: [ { $ref: '#/components/schemas/Track' }, { type: 'null' } ] }
    Event:
      type: object
      required: [id, type, trackId, at]
      properties:
        id: { type: string, description: client-generated UUID, used for idempotency }
        type:
          type: string
          enum: [play, skip, star, unstar, rate, thumb_up, thumb_down, thumb_clear]
          description: thumb_clear removes an earlier thumb_up or thumb_down (and unblocks the track).
        trackId: { type: string }
        at: { type: string, format: date-time }
        positionS: { type: [number, 'null'], description: playback position when the event happened (skip second) }
        durationS: { type: [number, 'null'], description: track length }
        source: { type: [string, 'null'], enum: [mix, library, favourites, more_like, search, null] }
        mixId: { type: [string, 'null'] }
        rating: { type: [integer, 'null'], minimum: 1, maximum: 5 }
        offline: { type: boolean, default: false, description: true if recorded without a connection and uploaded later }
        context: { oneOf: [ { $ref: '#/components/schemas/EventContext' }, { type: 'null' } ] }
    Suggestion:
      type: object
      required: [id, artist, album, reason, status]
      properties:
        id: { type: string }
        artist: { type: string }
        album: { type: string }
        year: { type: [integer, 'null'] }
        artistMbid: { type: [string, 'null'] }
        releaseGroupMbid: { type: [string, 'null'] }
        hasCover: { type: boolean, description: 'if true, fetch GET /suggestions/{id}/cover' }
        hasPreview: { type: boolean, description: 'if true, play GET /suggestions/{id}/preview' }
        coverUrl: { type: [string, 'null'], description: 'upstream source used by the server; the app must not fetch it' }
        previewUrl: { type: [string, 'null'], description: 'upstream source used by the server; the app must not fetch it' }
        buyLinks: { type: array, items: { type: object, properties: { name: { type: string }, url: { type: string } } } }
        reason: { type: string }
        status: { type: string, enum: [new, want, not_interested, have] }
        createdAt: { type: string, format: date-time }
    ScrobbleService:
      type: object
      required: [service, available, connected, enabled, nowPlaying, needsReauth, pending, failed, sent]
      properties:
        service: { type: string, enum: [listenbrainz, lastfm] }
        available: { type: boolean, description: 'lastfm: false when the server has no Last.fm API key/secret' }
        connected: { type: boolean }
        enabled: { type: boolean }
        username: { type: [string, 'null'], description: the account name on that service }
        nowPlaying: { type: boolean, description: send "now playing" updates }
        needsReauth: { type: boolean, description: 'the service rejected the token: paused (nothing lost) until reconnected' }
        authPending: { type: boolean, description: 'lastfm: a connect was started and not completed' }
        connectedAt: { type: [string, 'null'], format: date-time }
        lastScrobbleAt: { type: [string, 'null'], format: date-time }
        lastError: { type: [string, 'null'] }
        lastErrorAt: { type: [string, 'null'], format: date-time }
        pending: { type: integer, description: queued, waiting to be sent or retried }
        failed: { type: integer, description: given up (POST /me/scrobble/retry sends them again) }
        sent: { type: integer }
        ignored: { type: integer, description: rejected by the service (e.g. Last.fm drops plays older than 14 days) }
    ScrobbleStatus:
      type: object
      required: [services, importedEvents]
      properties:
        services: { type: array, items: { $ref: '#/components/schemas/ScrobbleService' }, description: 'listenbrainz, lastfm (in that order)' }
        import:
          type: [object, 'null']
          description: last ListenBrainz import
          properties:
            state: { type: string, enum: [running, done, error] }
            startedAt: { type: string, format: date-time }
            finishedAt: { type: string, format: date-time }
            scanned: { type: integer }
            matched: { type: integer }
            imported: { type: integer }
            alreadyKnown: { type: integer }
            unmatched: { type: integer }
            error: { type: string }
        importedEvents: { type: integer, description: imported events currently stored }
    ImportHistoryResult:
      type: object
      description: one history import (Spotify, Last.fm)
      properties:
        scanned: { type: integer, description: listens read }
        matched: { type: integer }
        imported: { type: integer }
        alreadyKnown: { type: integer, description: already here from a client or another import }
        unmatched: { type: integer, description: not in this library }
        tooShort: { type: integer, description: 'Spotify: played too briefly to count' }
        topMissing:
          type: array
          description: most-played songs not in the library (up to 50)
          items:
            type: object
            properties:
              artist: { type: string }
              title: { type: string }
              plays: { type: integer }
        toGetAdded: { type: integer }
    ImportedPlaylist:
      type: object
      required: [name, total, matched, missing, playlistId, unchanged, toGetAdded]
      properties:
        name: { type: string }
        total: { type: integer }
        matched: { type: integer }
        missing: { type: integer }
        playlistId: { type: [string, 'null'], description: "null when nothing matched" }
        unchanged: { type: boolean, description: "the user already had this playlist with exactly these tracks; nothing created" }
        toGetAdded: { type: integer }
        missingSongs:
          type: array
          description: up to 50
          items:
            type: object
            properties:
              artist: { type: [string, 'null'] }
              title: { type: [string, 'null'] }
    SpotifyImportResult:
      type: object
      required: [files, playlists, history, toGetAdded]
      properties:
        files: { type: array, items: { type: string }, description: "files used (inside a zip, their names)" }
        playlists: { type: array, items: { $ref: '#/components/schemas/ImportedPlaylist' } }
        history:
          oneOf:
            - $ref: '#/components/schemas/ImportHistoryResult'
            - type: 'null'
        toGetAdded: { type: integer }
    ImportStatus:
      type: object
      required: [imported, lastfmAvailable]
      properties:
        imported:
          type: object
          description: imported play events stored, per source
          properties:
            listenbrainz: { type: integer }
            lastfm: { type: integer }
            spotify: { type: integer }
        lastfm:
          type: [object, 'null']
          description: last Last.fm import by user name (ImportHistoryResult fields plus these)
          properties:
            state: { type: string, enum: [running, done, error] }
            username: { type: string }
            startedAt: { type: string, format: date-time }
            finishedAt: { type: string, format: date-time }
            page: { type: integer }
            pages: { type: integer }
            scanned: { type: integer }
            imported: { type: integer }
            alreadyKnown: { type: integer }
            unmatched: { type: integer }
            error: { type: string }
        lastfmAvailable: { type: boolean, description: the server has a Last.fm API key }
        lastfmUsername: { type: [string, 'null'], description: the connected Last.fm account, if any }
    Notification:
      type: object
      required: [id, kind, title, body, data, createdAt, read]
      properties:
        id: { type: string }
