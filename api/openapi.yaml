    Station:
      type: object
      required: [id, name, streamUrl, tags, explicit, hasImage, favourite]
      properties:
        id: { type: string }
        name: { type: string }
        streamUrl: { type: string, description: 'upstream URL (play through stream/station/{id}, not this)' }
        homepage: { type: [string, 'null'] }
        country: { type: [string, 'null'] }
        tags: { type: array, items: { type: string } }
        codec: { type: [string, 'null'] }
        bitrate: { type: [integer, 'null'] }
        explicit: { type: boolean }
        hasImage: { type: boolean }
        favourite: { type: boolean }
        lastPlayedAt: { type: [string, 'null'] }
    StationSearchResult:
      type: object
      required: [id, name, streamUrl, explicit, favourite]
      properties:
        id: { type: string, description: the id the station will have once added }
        name: { type: string }
        streamUrl: { type: string }
        homepage: { type: [string, 'null'] }
        imageUrl: { type: [string, 'null'] }
        country: { type: [string, 'null'] }
        tags: { type: array, items: { type: string } }
        codec: { type: [string, 'null'] }
        bitrate: { type: [integer, 'null'] }
        explicit: { type: boolean }
        radiobrowserUuid: { type: [string, 'null'] }
        favourite: { type: boolean }
    TrackMix:
      type: object
      description: |
        0.7 DJ automix analysis (absent until the `automix` job has analysed the track). Times are seconds into the
        file. The beat grid is constant-tempo: beat k is at beatS + k*60/bpm and bars start at downbeatS + n*bar.
        Only beat-match when `gridStable` (else the tempo drifts: use a normal crossfade).
        Client transition recipe (web/src/lib/automix.ts, android .../playback/Automix.kt): start at the outgoing
        track's mixOutS (moved earlier so the transition ends by lastBeatS), start the incoming track at its mixInS,
        play it at rate outgoing.bpm/(incoming.bpm × m), m ∈ {1, 2, ½}, only within ±8 % (pitch preserved), keep
        downbeats aligned, swap the bass at the midpoint and crossfade over 8–32 beats; then ease the rate back to 1.
      required: [gridStable]
      properties:
        bpm: { type: number }
        beatS: { type: number, description: first grid beat >= 0 }
        downbeatS: { type: number, description: first bar start (beat 1) >= 0 }
        beatsPerBar: { type: integer, description: 4 (time signature detection is not attempted) }
        gridStable: { type: boolean }
        key: { type: string, description: "e.g. 'A minor'" }
        camelot: { type: string, description: "e.g. '8A'" }
        mixInS: { type: number, description: where an incoming transition starts this track (a downbeat, after leading silence) }
        mixOutS: { type: number, description: where an outgoing transition should start (a downbeat at the outro) }
        introEndS: { type: number }
        outroStartS: { type: number }
        lastBeatS: { type: number, description: end of the music, before trailing silence }
        energy: { type: number, minimum: 0, maximum: 1 }
    TrackMixDetail:
      type: object
      required: [trackId, status]
      properties:
        trackId: { type: string }
        status: { type: string, enum: [done, failed] }
        version: { type: string, description: "dj-essentia-1 (Essentia RhythmExtractor2013 + KeyExtractor) or dj-basic-1 (numpy fallback)" }
        error: { type: [string, 'null'] }
        analysedAt: { type: string, format: date-time }
        bpmConfidence: { type: [number, 'null'], description: share of beats on the fitted grid }
        keyStrength: { type: [number, 'null'] }
        energyCurve: { type: array, items: { type: number }, description: '0..1 per curveStepS (a bar when the grid is stable)' }
        curveStepS: { type: [number, 'null'] }
        durationS: { type: [number, 'null'] }
        mix: { $ref: '#/components/schemas/TrackMix' }
