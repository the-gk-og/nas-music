openapi: 3.1.0
info:
  title: nas-music API
  version: 0.4.0
  description: |
    Contract between the nas-music server and its clients (Android app, web player, desktop app). All paths
    are under /api/v1. v2 (docs/v2.md): multi-user and invite-only; everything about listening is per user.
    Auth: `Authorization: Bearer <deviceToken>` on every endpoint except /health, /server-info, /auth/login,
    /auth/register and /pair. The web player may instead rely on the httpOnly `nm_session` cookie (same token)
    set by login/register with `"cookie": true`. Cross-origin requests (Tauri desktop app) must use the bearer
    header; CORS allows `tauri://localhost` and `http(s)://tauri.localhost` without credentials.
    Errors are `{"detail": "..."}` with a 4xx/5xx status. A disabled user's tokens get 401.
    v3 (docs/v3-ux.md phase 1): Home / For You shelf feeds, pins, global search incl. an online catalogue,
    To get list, radio. `artUrl` fields in shelves/catalogue are relative to the API base (/api/v1/).
    GET /stream and GET /art also accept `?token=<deviceToken>` (for <audio>/<img> in cross-origin clients);
    the server redacts it from its access log.
    v4: lyrics fall back to LRCLIB (source "lrclib"); admin console API under /admin/*; POST /me/bug-report.
    Over the Cloudflare tunnel the app also sends `CF-Access-Client-Id` and `CF-Access-Client-Secret`.
    Times are ISO-8601 UTC strings. IDs are opaque strings.
servers:
  - url: /api/v1
security:
  - device: []
paths:
  /health:
    get:
      security: []
      summary: Liveness + identity. Used by the app to test if the LAN address is reachable.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [status, serverId, version]
                properties:
                  status: { type: string, enum: [ok] }
                  serverId: { type: string, description: Stable random id of this server install }
                  version: { type: string }
  /pair:
    post:
      security: []
      summary: |
        Exchange a one-time pairing code (QR from POST /me/pair-code or the admin web UI) for a device token.
        The code belongs to the user who created it; the device is logged in as that user. The response is a
        full Session (a superset of the v1 `{deviceId, deviceToken}`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pairCode, deviceName]
              properties:
                pairCode: { type: string }
                deviceName: { type: string }
                deviceKind: { $ref: '#/components/schemas/DeviceKind' }
                appVersion: { type: [string, 'null'] }
      responses:
        '200':
          description: paired
          content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } }
        '403': { description: code invalid or expired (codes live 10 minutes, single use) }
  /library/artists:
    get:
      parameters:
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, default: 200, maximum: 1000 } }
      responses:
        '200':
          description: artists sorted by name
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Artist' } }
  /library/artists/{artistId}:
    get:
      parameters: [ { name: artistId, in: path, required: true, schema: { type: string } } ]
      responses:
        '200':
          description: artist with albums
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Artist'
                  - type: object
                    properties:
                      albums: { type: array, items: { $ref: '#/components/schemas/Album' } }
        '404': { description: not found }
  /library/albums:
    get:
      parameters:
        - { name: artistId, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [name, year, added], default: name } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, default: 200, maximum: 1000 } }
      responses:
        '200':
          description: albums
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Album' } }
  /library/albums/{albumId}:
    get:
      parameters: [ { name: albumId, in: path, required: true, schema: { type: string } } ]
      responses:
        '200':
          description: album with tracks in disc/track order
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Album'
                  - type: object
                    properties:
                      tracks: { type: array, items: { $ref: '#/components/schemas/Track' } }
        '404': { description: not found }
  /library/tracks/{trackId}:
    get:
      parameters: [ { name: trackId, in: path, required: true, schema: { type: string } } ]
      responses:
        '200':
          description: track
          content: { application/json: { schema: { $ref: '#/components/schemas/Track' } } }
        '404': { description: not found }
  /library/search:
    get:
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
      responses:
        '200':
          description: matches
          content:
            application/json:
              schema:
                type: object
                properties:
                  artists: { type: array, items: { $ref: '#/components/schemas/Artist' } }
                  albums: { type: array, items: { $ref: '#/components/schemas/Album' } }
                  tracks: { type: array, items: { $ref: '#/components/schemas/Track' } }
  /stream/{trackId}:
    get:
      summary: Audio bytes. Supports HTTP Range for seeking. Opus is transcoded with ffmpeg and cached on disk.
      parameters:
        - { name: trackId, in: path, required: true, schema: { type: string } }
        - { name: format, in: query, schema: { type: string, enum: [opus, flac], default: opus } }
        - { name: bitrate, in: query, schema: { type: integer, default: 160, description: kbps, opus only } }
        - { name: token, in: query, schema: { type: string }, description: 'device token, for <audio> elements that cannot send headers' }
      responses:
        '200': { description: full body (audio/ogg for opus, audio/flac for flac); Content-Length set }
        '206': { description: partial content }
        '404': { description: not found }
  /art/{albumId}:
    get:
      parameters:
        - { name: albumId, in: path, required: true, schema: { type: string } }
        - { name: size, in: query, schema: { type: integer, default: 512 } }
        - { name: token, in: query, schema: { type: string }, description: device token (for <img>) }
      responses:
        '200': { description: image/jpeg }
        '404': { description: no art }
  /favourites:
    get:
      responses:
        '200':
          description: starred tracks, most recently starred first
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Track' } }
  /favourites/{trackId}:
    put:
      summary: Star. Idempotent. (The app may also send a `star` event; either path works.)
      parameters: [ { name: trackId, in: path, required: true, schema: { type: string } } ]
      responses: { '204': { description: starred } }
    delete:
      parameters: [ { name: trackId, in: path, required: true, schema: { type: string } } ]
      responses: { '204': { description: unstarred } }
  /mixes/today:
    get:
      summary: Mixes built by the last nightly run (may be empty before the first run).
      responses:
        '200':
          description: mixes
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Mix' } }
  /mixes/{mixId}:
    get:
      parameters: [ { name: mixId, in: path, required: true, schema: { type: string } } ]
      responses:
        '200':
          description: mix
          content: { application/json: { schema: { $ref: '#/components/schemas/Mix' } } }
        '404': { description: not found }
  /mixes/more-like/{trackId}:
    post:
      summary: Build a fresh mix around a seed track, on demand.
      parameters:
        - { name: trackId, in: path, required: true, schema: { type: string } }
        - { name: minutes, in: query, schema: { type: integer, default: 40, minimum: 10, maximum: 240 } }
      responses:
        '200':
          description: new mix (kind=more_like)
          content: { application/json: { schema: { $ref: '#/components/schemas/Mix' } } }
        '404': { description: track unknown or not analysed yet }
        '503': { description: AI engine unavailable }
  /tracks/{trackId}/why:
    get:
      summary: Human-readable reason a track was picked (latest mix it appears in, else a general taste explanation).
      parameters: [ { name: trackId, in: path, required: true, schema: { type: string } } ]
      responses:
        '200':
          description: reason
          content:
            application/json:
              schema:
                type: object
                required: [reason]
                properties:
                  reason: { type: string }
                  similarTo: { type: array, items: { $ref: '#/components/schemas/Track' }, description: up to 3 tracks it sounds like }
  /tracks/{trackId}/lyrics:
    get:
      summary: |
        Lyrics for a track, read from the file itself: embedded tags (FLAC/Vorbis LYRICS, UNSYNCEDLYRICS,
        SYNCEDLYRICS; MP3 USLT/SYLT; M4A ©lyr) or a sidecar `.lrc` file with the same name. Synced (LRC)
        lyrics are preferred when both exist. The app caches these for downloaded tracks so they work offline.
        v2: the caller's own edit (PUT) wins over the file (`source: "user"`); `?source=` picks one explicitly.
        v4: also ID3 USLT (any language/description), SYLT, TXXX:LYRICS/UNSYNCEDLYRICS/SYNCEDLYRICS, COMM frames
        holding LRC, APEv2 `Lyrics`, any Vorbis key containing "lyric", MP4 ©lyr and ----:...:LYRICS, and `.lrc`
        / `.txt` sidecars matched case-insensitively (`lrc_file` = any sidecar). When the file has none and the
        admin hasn't turned LRCLIB off, lyrics come from lrclib.net (`source: "lrclib"`, cached on the server;
        "not found" is retried after 30 days). A background job pre-fetches them for favourites and today's mixes.
      parameters:
        - { name: trackId, in: path, required: true, schema: { type: string } }
        - { name: source, in: query, schema: { type: string, enum: [user, embedded, lrc_file, lrclib] }, description: 'default: your edit, else the file (embedded, then sidecar), else LRCLIB' }
      responses:
        '200':
          description: lyrics
          content: { application/json: { schema: { $ref: '#/components/schemas/Lyrics' } } }
        '404': { description: unknown track, or no lyrics (from that source) }
    put:
      summary: Save the caller's own lyrics for this track (LRC or plain text). Never written to the music file.
      parameters: [ { name: trackId, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [raw], properties: { raw: { type: string, maxLength: 200000 } } } } }
      responses:
        '200':
          description: the saved lyrics, parsed (source=user)
          content: { application/json: { schema: { $ref: '#/components/schemas/Lyrics' } } }
        '422': { description: empty lyrics }
    delete:
      summary: Remove the caller's edit; GET falls back to the file's lyrics.
      parameters: [ { name: trackId, in: path, required: true, schema: { type: string } } ]
      responses: { '204': { description: removed (also when there was none) } }
  /sync/manifest:
    get:
      summary: |
        The full set of tracks the phone should hold offline right now (today's mixes + favourites).
        The app downloads what it lacks and deletes downloaded tracks not in this list.
      parameters:
        - { name: favouritesFormat, in: query, schema: { type: string, enum: [opus, flac], default: opus } }
      responses:
        '200':
          description: manifest
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncManifest' }
  /events:
    post:
      summary: Batch upload of listening feedback. Idempotent by event id; duplicates are ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events: { type: array, maxItems: 1000, items: { $ref: '#/components/schemas/Event' } }
      responses:
        '200':
          description: accepted
          content:
            application/json:
              schema:
                type: object
                required: [accepted, duplicates]
                properties:
                  accepted: { type: integer }
                  duplicates: { type: integer }
  /suggestions:
    get:
      summary: Current weekly album suggestions (status new first).
      responses:
        '200':
          description: suggestions
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Suggestion' } }
  /suggestions/{suggestionId}:
    post:
      parameters: [ { name: suggestionId, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [want, not_interested, have] }
      responses: { '204': { description: saved } }
  /suggestions/{suggestionId}/preview:
    get:
      summary: |
        30-second preview audio, proxied by the server (third-party preview links expire within minutes,
        and proxying keeps the phone from contacting third parties). Streamed through, never stored.
      parameters: [ { name: suggestionId, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: audio/mpeg }
        '404': { description: no preview for this suggestion }
        '502': { description: upstream preview unavailable }
  /suggestions/{suggestionId}/cover:
    get:
      summary: Cover image, proxied by the server (may be cached on disk).
      parameters:
        - { name: suggestionId, in: path, required: true, schema: { type: string } }
        - { name: size, in: query, schema: { type: integer, default: 512 } }
      responses:
        '200': { description: image/jpeg }
        '404': { description: no cover }
  /server-info:
    get:
      security: []
      summary: Identity and addresses of this server, so a client logged in via one address learns the other and the LAN cert pin.
      responses:
        '200':
          description: server info
          content: { application/json: { schema: { $ref: '#/components/schemas/ServerInfo' } } }
  /auth/login:
    post:
      security: []
      summary: Log in with username + password; creates a device and returns its token. Rate-limited (5 failed tries/min/IP → 429).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, deviceName, deviceKind]
              properties:
                username: { type: string }
                password: { type: string }
                deviceName: { type: string, maxLength: 100 }
                deviceKind: { $ref: '#/components/schemas/DeviceKind' }
                appVersion: { type: [string, 'null'] }
                cookie: { type: boolean, default: false, description: 'also set the httpOnly `nm_session` cookie (web player)' }
      responses:
        '200':
          description: logged in
          content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } }
        '401': { description: wrong username or password }
        '403': { description: account disabled }
        '429': { description: too many failed attempts; retry later }
  /auth/register:
    post:
      security: []
      summary: Create an account with an invite code. Username 3–32 chars `[A-Za-z0-9_.-]`, password ≥ 8. Rate-limited like login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inviteCode, username, password, deviceName, deviceKind]
              properties:
                inviteCode: { type: string }
                username: { type: string, minLength: 3, maxLength: 32, pattern: '^[A-Za-z0-9_.-]+$' }
                password: { type: string, minLength: 8 }
                deviceName: { type: string, maxLength: 100 }
                deviceKind: { $ref: '#/components/schemas/DeviceKind' }
                appVersion: { type: [string, 'null'] }
                cookie: { type: boolean, default: false }
      responses:
        '200':
          description: account created and logged in
          content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } }
        '403': { description: invite code unknown, used or expired }
        '409': { description: username taken }
        '422': { description: invalid username or password }
        '429': { description: too many failed attempts }
  /auth/logout:
    post:
      summary: Revoke the calling device's token and clear the `nm_session` cookie.
      responses: { '204': { description: logged out } }
  /me:
    get:
      responses:
        '200':
          description: the signed-in user
          content: { application/json: { schema: { $ref: '#/components/schemas/User' } } }
  /me/password:
    put:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current, new]
              properties:
                current: { type: string }
                new: { type: string, minLength: 8 }
      responses:
        '204': { description: changed }
        '403': { description: current password wrong }
  /me/devices:
    get:
      summary: The user's own devices (revoked ones are not listed).
      responses:
        '200':
          description: devices
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Device' } } } }
  /me/devices/{deviceId}:
    delete:
      summary: Sign a device out (revokes its token, closes its Connect socket).
      parameters: [ { name: deviceId, in: path, required: true, schema: { type: string } } ]
      responses:
        '204': { description: revoked }
        '404': { description: not one of your devices }
  /me/pair-code:
    post:
      summary: One-time code (10 min) that logs another device in as this user via POST /pair (QR shortcut).
      responses:
        '200':
          description: code + QR payload (docs/pairing.md)
          content:
            application/json:
              schema:
                type: object
                required: [pairCode, expiresAt, qrPayload]
                properties:
                  pairCode: { type: string }
                  expiresAt: { type: string, format: date-time }
                  qrPayload: { type: object, description: 'the docs/pairing.md JSON object; encode it compactly into the QR' }
  /me/settings:
    get:
      summary: |
        The user's synced settings: a flat map of client-defined keys to JSON values, shared by all their devices.
        Known keys: `offline.favourites` (bool) and the §10 data switches `context.listening`, `context.output`,
        `context.device`, `context.motion`, `context.location`, `context.weather`, `context.search`, `context.time`,
        `context.health` (bool, default false). A per-device override is stored as `device.<deviceId>.<key>`.
        v3 appearance keys (docs/v3-ux.md §7; validated on PUT): `appearance.animations` off|quick|expressive
        (default quick), `appearance.defaultView` grid|list, `appearance.albumPage` big|simple,
        `appearance.accent` green|blue|purple|pink|orange|red|teal or "#rrggbb", `home.shelves` / `foryou.shelves`
        (array of shelf ids, display order), `home.hidden` / `foryou.hidden` (array of shelf ids),
        `library.view.<chip>` grid|list (usually per device: `device.<id>.library.view.albums`).
      responses:
        '200':
          description: settings
          content: { application/json: { schema: { $ref: '#/components/schemas/UserSettings' } } }
    put:
      summary: Merge keys into the settings (a null value deletes the key). Returns the full map.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UserSettings' } } }
      responses:
        '200':
          description: settings after the merge
          content: { application/json: { schema: { $ref: '#/components/schemas/UserSettings' } } }
  /me/data:
    get:
      summary: What has been collected about the user (counts per context signal and date range).
      responses:
        '200':
          description: summary
          content: { application/json: { schema: { $ref: '#/components/schemas/DataSummary' } } }
    delete:
      summary: |
        Erase collected context for one signal (the fields listed in DataSummary.signals) or `all`.
        `signal=all` erases ALL listening history too (events, play/skip counts, taste snapshots) and needs
        `confirm=true`. Favourites, ratings, thumbs, playlists and queues are kept.
      parameters:
        - { name: signal, in: query, required: true, schema: { type: string, enum: [listening, output, device, motion, location, weather, search, time, health, all] } }
        - { name: confirm, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: what was erased
          content:
            application/json:
              schema:
                type: object
                properties:
                  eventsUpdated: { type: integer }
                  eventsDeleted: { type: integer }
        '400': { description: signal=all without confirm=true }
  /me/data/export:
    get:
      summary: Everything stored about the user as one JSON document (attachment).
      responses:
        '200':
          description: export (Content-Disposition attachment)
          content:
            application/json:
              schema:
                type: object
                properties:
                  exportedAt: { type: string, format: date-time }
                  user: { $ref: '#/components/schemas/User' }
                  settings: { type: object }
                  devices: { type: array, items: { $ref: '#/components/schemas/Device' } }
                  tracks: { type: array, items: { type: object }, description: 'per-track state: trackId, path, starredAt, rating, blocked, playCount, skipCount, lastPlayed' }
                  events: { type: array, items: { type: object }, description: 'all events incl. context' }
                  playlists: { type: array, items: { $ref: '#/components/schemas/PlaylistDetail' } }
                  queues: { type: array, items: { $ref: '#/components/schemas/QueueDetail' } }
                  lyricsOverrides: { type: array, items: { type: object } }
                  suggestions: { type: array, items: { $ref: '#/components/schemas/Suggestion' } }
  /library/folders:
    get:
      summary: Browse the library by folder. `path` is relative to the library root; "" is the root.
      parameters:
        - { name: path, in: query, schema: { type: string, default: '' } }
      responses:
        '200':
          description: one folder level
          content:
            application/json:
              schema:
                type: object
                required: [path, parent, folders, tracks]
                properties:
                  path: { type: string }
                  parent: { type: [string, 'null'], description: null at the root }
                  folders:
                    type: array
                    items:
                      type: object
                      required: [name, path, trackCount]
                      properties:
                        name: { type: string }
                        path: { type: string }
                        trackCount: { type: integer, description: tracks in this folder and below }
                  tracks: { type: array, items: { $ref: '#/components/schemas/Track' }, description: 'tracks directly in this folder, by file name' }
        '404': { description: no such folder }
  /library/genres:
    get:
      responses:
        '200':
          description: genres (tag values as written), by name
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [name, trackCount, albumCount]
                  properties:
                    name: { type: string }
                    trackCount: { type: integer }
                    albumCount: { type: integer }
  /library/genres/{genre}/tracks:
    get:
      parameters:
        - { name: genre, in: path, required: true, schema: { type: string }, description: URL-encoded genre name (case-insensitive) }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, default: 200, maximum: 1000 } }
      responses:
        '200':
          description: tracks by artist, album, disc, track number
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Track' } } } }
  /library/tracks:
    get:
      summary: All songs.
      parameters:
        - { name: sort, in: query, schema: { type: string, enum: [title, added, year], default: title } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, default: 200, maximum: 1000 } }
      responses:
        '200':
          description: tracks
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Track' } } } }
  /library/tracks/{trackId}/info:
    get:
      parameters: [ { name: trackId, in: path, required: true, schema: { type: string } } ]
      responses:
        '200':
          description: song info
          content: { application/json: { schema: { $ref: '#/components/schemas/TrackInfo' } } }
        '404': { description: not found }
  /lists/{kind}:
    get:
      summary: Smart lists for the calling user.
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string, enum: [favourites, recently_added, recently_played, most_played, not_played] } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, default: 200, maximum: 1000 } }
      responses:
        '200':
          description: tracks
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Track' } } } }
  /playlists:
    get:
      responses:
        '200':
          description: the user's playlists, most recently updated first
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Playlist' } } } }
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                trackIds: { type: array, items: { type: string } }
      responses:
        '200':
          description: created
          content: { application/json: { schema: { $ref: '#/components/schemas/PlaylistDetail' } } }
  /playlists/{playlistId}:
    parameters: [ { name: playlistId, in: path, required: true, schema: { type: string } } ]
    get:
      responses:
        '200':
          description: playlist with tracks
          content: { application/json: { schema: { $ref: '#/components/schemas/PlaylistDetail' } } }
        '404': { description: not found (or not yours) }
    patch:
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { name: { type: string, minLength: 1, maxLength: 200 } } } } }
      responses:
        '200':
          description: updated
          content: { application/json: { schema: { $ref: '#/components/schemas/PlaylistDetail' } } }
    delete:
      responses: { '204': { description: deleted } }
  /playlists/{playlistId}/tracks:
    post:
      parameters: [ { name: playlistId, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trackIds]
              properties:
                trackIds: { type: array, items: { type: string }, maxItems: 5000 }
                position: { type: [integer, 'null'], description: insert before this position; omitted/null = append }
      responses:
        '200':
          description: playlist after the change
          content: { application/json: { schema: { $ref: '#/components/schemas/PlaylistDetail' } } }
        '404': { description: playlist or a track not found }
  /playlists/{playlistId}/tracks/{position}:
    delete:
      parameters:
        - { name: playlistId, in: path, required: true, schema: { type: string } }
        - { name: position, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: playlist after the change
          content: { application/json: { schema: { $ref: '#/components/schemas/PlaylistDetail' } } }
  /playlists/{playlistId}/move:
    post:
      parameters: [ { name: playlistId, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Move' } } } }
      responses:
        '200':
          description: playlist after the change
          content: { application/json: { schema: { $ref: '#/components/schemas/PlaylistDetail' } } }
  /queues:
    get:
      responses:
        '200':
          description: the user's queues by slot (max 20)
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Queue' } } } }
    post:
      summary: Create a queue in the lowest free slot. With 20 queues already, the least recently updated one that isn't currently playing is replaced (its slot is reused), like Musicolet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, trackIds]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                trackIds: { type: array, items: { type: string }, maxItems: 10000 }
                startIndex: { type: integer, default: 0 }
                source: { $ref: '#/components/schemas/QueueSource' }
      responses:
        '200':
          description: created
          content: { application/json: { schema: { $ref: '#/components/schemas/QueueDetail' } } }
  /queues/{queueId}:
    parameters: [ { name: queueId, in: path, required: true, schema: { type: string } } ]
    get:
      responses:
        '200':
          description: queue with tracks
          content: { application/json: { schema: { $ref: '#/components/schemas/QueueDetail' } } }
        '404': { description: not found (or not yours) }
    patch:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                currentIndex: { type: integer, minimum: 0 }
                positionMs: { type: integer, minimum: 0 }
      responses:
        '200':
          description: updated (tracks included)
          content: { application/json: { schema: { $ref: '#/components/schemas/QueueDetail' } } }
    delete:
      responses: { '204': { description: deleted } }
  /queues/{queueId}/tracks:
    put:
      summary: Replace all tracks (sort, clear, shuffle-in-place). currentIndex defaults to the current track's new index, else 0.
      parameters: [ { name: queueId, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trackIds]
              properties:
                trackIds: { type: array, items: { type: string }, maxItems: 10000 }
                currentIndex: { type: [integer, 'null'], minimum: 0 }
      responses:
        '200':
          description: queue after the change
          content: { application/json: { schema: { $ref: '#/components/schemas/QueueDetail' } } }
    post:
      parameters: [ { name: queueId, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trackIds]
              properties:
                trackIds: { type: array, items: { type: string }, maxItems: 10000 }
                position:
                  description: 'insert before this index, or "next" (after the current track), or "end" (default)'
                  oneOf: [ { type: integer }, { type: string, enum: [next, end] } ]
      responses:
        '200':
          description: queue after the change
          content: { application/json: { schema: { $ref: '#/components/schemas/QueueDetail' } } }
  /queues/{queueId}/tracks/{position}:
    delete:
      parameters:
        - { name: queueId, in: path, required: true, schema: { type: string } }
        - { name: position, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: queue after the change (currentIndex adjusted)
          content: { application/json: { schema: { $ref: '#/components/schemas/QueueDetail' } } }
  /queues/{queueId}/move:
    post:
      parameters: [ { name: queueId, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Move' } } } }
      responses:
        '200':
          description: queue after the change (currentIndex follows the current track)
          content: { application/json: { schema: { $ref: '#/components/schemas/QueueDetail' } } }
  /queues/{queueId}/save-as-playlist:
    post:
      parameters: [ { name: queueId, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string, minLength: 1, maxLength: 200 } } } } }
      responses:
        '200':
          description: the new playlist
          content: { application/json: { schema: { $ref: '#/components/schemas/PlaylistDetail' } } }
  /connect:
    get:
      summary: |
        WebSocket (upgrade) for Connect device control — see docs/v2.md §5. Auth: `Authorization: Bearer`,
        or `?token=<deviceToken>` (browsers), or the `nm_session` cookie. Messages are JSON `{"type": ...}`.
        Client → server: `hello`, `state` (PlaybackState, active device only), `command`, `transfer`, `ping`.
        Server → client: `welcome {deviceId, devices, state}`, `devices {devices}`, `state` (PlaybackState),
        `command {action, args, fromDeviceId}`, `takeover {state}`, `release`, `queues {queueId}`, `pong`,
        `error {detail}`. The server sends WebSocket protocol pings every 20 s (keeps the Cloudflare tunnel open);
        clients still send `ping` every 25 s. A newer socket from the same device replaces the older one.
      responses:
        '101': { description: switching protocols }
        '403': { description: bad token (the socket is closed with code 4401) }
  /admin/invites:
    get:
      summary: Admin only.
      responses:
        '200':
          description: invites, newest first
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Invite' } } } }
        '403': { description: not an admin }
    post:
      summary: Admin only. `url` = `<tunnelUrl or lanUrl>/join/<code>`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: [string, 'null'], maxLength: 200 }
                expiresInDays: { type: integer, default: 7, minimum: 1, maximum: 90 }
      responses:
        '200':
          description: created
          content:
            application/json:
              schema:
                type: object
                required: [code, url, expiresAt]
                properties:
                  code: { type: string }
                  url: { type: string }
                  expiresAt: { type: string, format: date-time }
  /admin/invites/{code}:
    delete:
      parameters: [ { name: code, in: path, required: true, schema: { type: string } } ]
      responses: { '204': { description: deleted }, '404': { description: not found } }
  /admin/users:
    get:
      summary: Admin only.
      responses:
        '200':
          description: users
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AdminUser' } } } }
  /admin/users/{userId}:
    patch:
      summary: Admin only. Disabling a user revokes their devices. Removing or disabling the last active admin → 409.
      parameters: [ { name: userId, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                disabled: { type: boolean }
                isAdmin: { type: boolean }
      responses:
        '200':
          description: updated
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminUser' } } }
        '404': { description: not found }
        '409': { description: would leave no active admin }
  /admin/users/{userId}/reset-password:
    post:
      summary: Admin only. Sets a new password and signs the user out everywhere.
      parameters: [ { name: userId, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [new], properties: { new: { type: string, minLength: 8 } } } } }
      responses: { '204': { description: reset }, '404': { description: not found } }
  /home:
    get:
      summary: |
        Home (docs/v3-ux.md §3.1): typed shelves in the user's order (settings `home.shelves`, hidden ones in
        `home.hidden`). Empty shelves are omitted, except `start_radio`, which always has one item.
        Shelf kinds here: start_radio, devices, recently_played, continue_listening, pinned.
      responses:
        '200':
          description: shelves
          content: { application/json: { schema: { $ref: '#/components/schemas/ShelfFeed' } } }
  /foryou:
    get:
      summary: |
        For You (docs/v3-ux.md §3.2): typed shelves. Kinds: mixes, radio, because_you_played (1–3 shelves),
        suggestions, to_get. Phase-2 kinds (release_radar, blends, wrapped) are reserved and not returned yet.
        Order and hiding follow settings `foryou.shelves` / `foryou.hidden`. Empty shelves are omitted.
        because_you_played shelves have id "byp:track:<seed track id>" and track items.
      responses:
        '200':
          description: shelves
          content: { application/json: { schema: { $ref: '#/components/schemas/ShelfFeed' } } }
  /pins:
    get:
      summary: The user's "Pinned" items, in order (also shown on Home).
      responses:
        '200':
          description: pinned items, resolved
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ShelfItem' } } } }
    post:
      summary: Pin an item to Home ("Pin to Home"). Idempotent; re-pinning moves it to `position`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, id]
              properties:
                type: { $ref: '#/components/schemas/PinType' }
                id: { type: string }
                position: { type: [integer, 'null'], description: 0 = first; omitted/null = last }
      responses:
        '200':
          description: all pins after the change
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ShelfItem' } } } }
        '404': { description: the item doesn't exist (or isn't yours) }
  /pins/{type}/{id}:
    delete:
      parameters:
        - { name: type, in: path, required: true, schema: { $ref: '#/components/schemas/PinType' } }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { '204': { description: unpinned (also when it wasn't pinned) } }
  /search:
    get:
      summary: |
        Global search (docs/v3-ux.md §4) across the library, the user's playlists and queues, and — with scope
        all|catalog — an online catalogue (Deezer public search + MusicBrainz) for "Not in your library".
        Catalogue results are cached server-side and rate-limited; if the catalogue is unreachable the library
        results still come back and `catalogError` says why.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
        - { name: scope, in: query, schema: { type: string, enum: [all, library, catalog], default: all } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 }, description: per group }
      responses:
        '200':
          description: grouped results
          content: { application/json: { schema: { $ref: '#/components/schemas/SearchResults' } } }
  /catalog/{catalogId}/preview:
    get:
      summary: 30-second sample of a catalogue item (album = its first track), proxied, fresh link each time, never stored.
      parameters:
        - { name: catalogId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: audio/mpeg (Range passed through; 206 when the upstream honours it) }
        '404': { description: unknown id or no sample }
        '502': { description: upstream unavailable }
  /catalog/{catalogId}/cover:
    get:
      parameters:
        - { name: catalogId, in: path, required: true, schema: { type: string } }
        - { name: size, in: query, schema: { type: integer, default: 512 } }
      responses:
        '200': { description: image/jpeg (resized, cached on disk) }
        '404': { description: unknown id or no cover }
        '502': { description: upstream unavailable }
  /toget:
    get:
      summary: The user's "To get" list (music to acquire), newest first.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [want, got, dismissed, all], default: want } }
      responses:
        '200':
          description: items
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ToGetItem' } } } }
    post:
      summary: |
        Add an album or song. Either `catalogId` (from search) or `type` + `title` + `artist`. Adding something
        already on the list returns the existing item (status reset to `want` if it was dismissed). Items the
        library already has are created as `got`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                catalogId: { type: string }
                type: { type: string, enum: [album, track] }
                title: { type: string, maxLength: 300 }
                artist: { type: string, maxLength: 300 }
                year: { type: [integer, 'null'] }
                mbid: { type: [string, 'null'], description: MusicBrainz release-group (album) or recording (track) id }
                note: { type: [string, 'null'], maxLength: 1000 }
      responses:
        '200':
          description: the item
          content: { application/json: { schema: { $ref: '#/components/schemas/ToGetItem' } } }
        '404': { description: unknown catalogId }
        '422': { description: neither catalogId nor type+title+artist }
  /toget/{id}:
    parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
    patch:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [want, got, dismissed] }
                note: { type: [string, 'null'], maxLength: 1000 }
      responses:
        '200':
          description: updated
          content: { application/json: { schema: { $ref: '#/components/schemas/ToGetItem' } } }
        '404': { description: not found (or not yours) }
    delete:
      responses: { '204': { description: deleted }, '404': { description: not found } }
  /radio:
    post:
      summary: |
        Start a radio (docs/v3-ux.md §5): the AI picks ~25 tracks and the server stores them as a queue named by
        the AI ("Song X radio", "Your Indie Rock radio"; radio != null on the queue). Starting the same radio
        again replaces that queue. Ask for more with POST /radio/{queueId}/more when ~5 remain.
        Queue changes are pushed over Connect as usual.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [seed], properties: { seed: { $ref: '#/components/schemas/RadioSeed' } } } } }
      responses:
        '200':
          description: the new radio queue
          content: { application/json: { schema: { $ref: '#/components/schemas/QueueDetail' } } }
        '400': { description: malformed seed }
        '404': { description: seed item not found, or nothing analysed to build a radio from }
        '503': { description: AI engine without radio support yet }
  /radio/{queueId}/more:
    post:
      parameters: [ { name: queueId, in: path, required: true, schema: { type: string } } ]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { count: { type: integer, default: 25, minimum: 1, maximum: 100 } } } } }
      responses:
        '200':
          description: the queue with new tracks appended (no repeats; unchanged once the library runs out)
          content: { application/json: { schema: { $ref: '#/components/schemas/QueueDetail' } } }
        '404': { description: not a radio queue of yours }
        '503': { description: AI engine without radio support yet }
  /me/bug-report:
    post:
      summary: |
        Send app logs / a crash dump to the server admins (stored on this server only, kept 30 days).
        Total body ≤ 2 MB (413 otherwise); at most 20 reports per user per day (429).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BugReportIn' } } }
      responses:
        '200':
          description: stored
          content: { application/json: { schema: { type: object, required: [id], properties: { id: { type: string } } } } }
        '413': { description: too large }
        '429': { description: too many reports today }
  /admin/users/{userId}/detail:
    get:
      summary: Admin only. One user with devices and last activity.
      parameters: [ { name: userId, in: path, required: true, schema: { type: string } } ]
      responses:
        '200':
          description: user detail
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminUserDetail' } } }
        '404': { description: not found }
  /admin/users/{userId}/devices/{deviceId}:
    delete:
      summary: Admin only. Sign one of a user's devices out.
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
        - { name: deviceId, in: path, required: true, schema: { type: string } }
      responses: { '204': { description: revoked }, '404': { description: not found } }
  /admin/status:
    get:
      summary: Admin only. Library, analysis (with ETA), lyrics cache and job status in one call (console dashboard).
      responses:
        '200':
          description: status
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminStatus' } } }
  /admin/jobs:
    get:
      summary: Admin only. Every background job with its last runs (newest first, up to 20) and next scheduled run.
      responses:
        '200':
          description: jobs
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/JobStatus' } } } }
  /admin/jobs/{name}:
    post:
      summary: Admin only. Start a job now in the background (no-op if it is already running).
      parameters:
        - { name: name, in: path, required: true, schema: { type: string, enum: [scan, full_scan, analyse, nightly, pretranscode, discovery, lyrics, cleanup] } }
      responses:
        '202':
          description: accepted
          content: { application/json: { schema: { type: object, properties: { started: { type: boolean, description: false = already running } } } } }
  /admin/analysis/failed:
    get:
      summary: Admin only. Tracks whose audio analysis failed (for the active model).
      responses:
        '200':
          description: failures
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    track: { $ref: '#/components/schemas/HealthTrack' }
                    error: { type: [string, 'null'] }
                    modelVersion: { type: string }
                    updatedAt: { type: string, format: date-time }
  /admin/analysis/retry:
    post:
      summary: Admin only. Forget failures (all, or the given tracks) so the next analysis run retries them; starts it.
      requestBody:
        content: { application/json: { schema: { type: object, properties: { trackIds: { type: [array, 'null'], items: { type: string } } } } } }
      responses:
        '200':
          description: how many will be retried
          content: { application/json: { schema: { type: object, properties: { retried: { type: integer } } } } }
  /admin/health/library:
    get:
      summary: Admin only. Library health summary (counts). Details via the endpoints below. The music files themselves are never modified.
      responses:
        '200':
          description: summary
          content: { application/json: { schema: { $ref: '#/components/schemas/LibraryHealth' } } }
  /admin/health/missing:
    get:
      summary: Admin only. Tracks whose files vanished from the library.
      parameters:
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, default: 200, maximum: 1000 } }
      responses:
        '200':
          description: tracks
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/HealthTrack' } } } }
    delete:
      summary: |
        Admin only. Remove missing tracks from the DATABASE (all, or `trackIds`), with everything that refers
        to them: per-user state, listening events, playlist/queue/mix entries, analysis, lyrics. Not undoable
        except from a backup (one is made automatically first).
      requestBody:
        content: { application/json: { schema: { type: object, properties: { trackIds: { type: [array, 'null'], items: { type: string } } } } } }
      responses:
        '200':
          description: removed
          content: { application/json: { schema: { type: object, properties: { removed: { type: integer }, backup: { type: string } } } } }
  /admin/health/duplicates:
    get:
      summary: Admin only. Groups of probable duplicates (same recording MBID, or same normalised artist + title and duration within 2 s).
      responses:
        '200':
          description: groups
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    reason: { type: string, enum: [mbid, name] }
                    key: { type: string }
                    tracks: { type: array, items: { $ref: '#/components/schemas/HealthTrack' } }
  /admin/health/missing-tags:
    get:
      summary: Admin only. Tracks missing artist, album, title (file-name fallback), year, genre or track number.
      parameters:
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, default: 200, maximum: 1000 } }
      responses:
        '200':
          description: tracks with the missing fields
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    track: { $ref: '#/components/schemas/HealthTrack' }
                    missing: { type: array, items: { type: string, enum: [artist, album, title, year, genre, trackNo] } }
  /admin/health/missing-art:
    get:
      summary: Admin only. Albums without cover art (no folder image, nothing embedded).
      responses:
        '200':
          description: albums
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Album' } } } }
  /admin/health/unanalysed:
    get:
      summary: Admin only. Present tracks with no features for the active analysis model.
      parameters:
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, default: 200, maximum: 1000 } }
      responses:
        '200':
          description: tracks
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/HealthTrack' } } } }
  /admin/health/cache:
    get:
      summary: Admin only. Orphaned cache files (art and Opus for albums/tracks that no longer exist, stale transcodes).
      responses:
        '200':
          description: orphans
          content: { application/json: { schema: { $ref: '#/components/schemas/CacheReport' } } }
  /admin/health/cache/clean:
    post:
      summary: Admin only. Delete the orphaned cache files.
      responses:
        '200':
          description: removed
          content: { application/json: { schema: { $ref: '#/components/schemas/CacheReport' } } }
  /admin/server:
    get:
      summary: Admin only. Server health.
      responses:
        '200':
          description: health
          content: { application/json: { schema: { $ref: '#/components/schemas/ServerHealth' } } }
  /admin/opus-cache:
    delete:
      summary: Admin only. Empty the Opus transcode cache (files are recreated on demand / by pre-transcode).
      responses:
        '200':
          description: removed
          content: { application/json: { schema: { type: object, properties: { files: { type: integer }, bytes: { type: integer } } } } }
  /admin/logs:
    get:
      summary: Admin only. Recent server log records from an in-memory ring buffer (last 2000), oldest first. Tokens are redacted.
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 200, maximum: 2000 } }
        - { name: level, in: query, schema: { type: string, enum: [DEBUG, INFO, WARNING, ERROR], default: INFO } }
        - { name: after, in: query, schema: { type: integer }, description: only records with seq > after }
      responses:
        '200':
          description: records
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/LogRecord' } } } }
  /admin/logs/stream:
    get:
      summary: |
        Admin only. Live tail as Server-Sent Events (text/event-stream): each `data:` line is a LogRecord JSON.
        Starts with records after `after`. A comment line is sent every 15 s to keep proxies open.
        Browsers' EventSource can't send headers: use the nm_session cookie (same origin) or `?token=`.
      parameters:
        - { name: after, in: query, schema: { type: integer } }
        - { name: level, in: query, schema: { type: string, enum: [DEBUG, INFO, WARNING, ERROR], default: INFO } }
        - { name: token, in: query, schema: { type: string } }
      responses:
        '200': { description: text/event-stream }
  /admin/backups:
    get:
      summary: Admin only. Database backups in the data directory (manual, and the automatic ones made before migrations and prunes), newest first.
      responses:
        '200':
          description: backups
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Backup' } } } }
    post:
      summary: Admin only. Make a consistent backup of the database now (SQLite online backup).
      responses:
        '200':
          description: created
          content: { application/json: { schema: { $ref: '#/components/schemas/Backup' } } }
  /admin/backups/{name}:
    parameters: [ { name: name, in: path, required: true, schema: { type: string } } ]
    get:
      summary: Admin only. Download (attachment, application/vnd.sqlite3).
      responses: { '200': { description: the file }, '404': { description: not found } }
    delete:
      responses: { '204': { description: deleted }, '404': { description: not found } }
  /admin/now-playing:
    get:
      summary: Admin only. What every user's devices are doing right now (Connect).
      responses:
        '200':
          description: per user with any online device or an active player
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    user: { type: object, properties: { id: { type: string }, username: { type: string } } }
                    devices: { type: array, items: { $ref: '#/components/schemas/ConnectDevice' } }
                    state: { $ref: '#/components/schemas/PlaybackState' }
                    track: { oneOf: [ { $ref: '#/components/schemas/Track' }, { type: 'null' } ] }
  /admin/settings:
    get:
      summary: Admin only. Editable server settings (stored in the database, overriding config.toml).
      responses:
        '200':
          description: settings
          content: { application/json: { schema: { $ref: '#/components/schemas/ServerSettings' } } }
    put:
      summary: |
        Admin only. Change settings; a null value removes the override (back to config.toml). Validated (422 with
        the reason). Applied immediately (timezone reschedules the jobs; cache size applies to the next trim).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ServerSettingValues' } } }
      responses:
        '200':
          description: settings after the change
          content: { application/json: { schema: { $ref: '#/components/schemas/ServerSettings' } } }
        '422': { description: invalid value }
  /admin/bug-reports:
    get:
      summary: Admin only. Bug reports from the last 30 days, newest first (without the logs).
      responses:
        '200':
          description: reports
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/BugReportSummary' } } } }
  /admin/bug-reports/{id}:
    parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
    get:
      responses:
        '200':
          description: the full report
          content: { application/json: { schema: { $ref: '#/components/schemas/BugReport' } } }
        '404': { description: not found }
    delete:
      responses: { '204': { description: deleted }, '404': { description: not found } }
components:
  securitySchemes:
    device: { type: http, scheme: bearer }
  schemas:
    HealthTrack:
      type: object
      required: [id, path, title]
      properties:
        id: { type: string }
        path: { type: string, description: relative to the library root }
        title: { type: string }
        artist: { type: [string, 'null'] }
        album: { type: [string, 'null'] }
        albumId: { type: [string, 'null'] }
        durationS: { type: [number, 'null'] }
        fileBytes: { type: [integer, 'null'] }
        codec: { type: [string, 'null'] }
        missing: { type: boolean }
    AdminUserDetail:
      allOf:
        - $ref: '#/components/schemas/AdminUser'
        - type: object
          properties:
            devices: { type: array, items: { $ref: '#/components/schemas/Device' } }
            lastActivity: { type: [string, 'null'], format: date-time, description: latest of last login, device last seen, last event }
            eventCount: { type: integer }
    JobRun:
      type: object
      properties:
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        durationS: { type: number }
        ok: { type: boolean }
        result: { type: [object, 'null'] }
        error: { type: [string, 'null'] }
    JobStatus:
      type: object
      required: [name, running]
      properties:
        name: { type: string }
        running: { type: boolean }
        next: { type: [string, 'null'], description: next scheduled run (server timezone), null if not scheduled }
        last: { oneOf: [ { $ref: '#/components/schemas/JobRun' }, { type: 'null' } ] }
        history: { type: array, items: { $ref: '#/components/schemas/JobRun' } }
    AdminStatus:
      type: object
      properties:
        library:
          type: object
          properties:
            tracks: { type: integer }
            albums: { type: integer }
            artists: { type: integer }
            missing: { type: integer }
            hours: { type: number }
            gb: { type: number }
            users: { type: integer }
            lastScan: { oneOf: [ { $ref: '#/components/schemas/JobRun' }, { type: 'null' } ] }
        analysis:
          type: object
          properties:
            model: { type: string, description: version being written (may be a fallback) }
            configured: { type: string }
            fallbackReason: { type: [string, 'null'] }
            analysed: { type: integer }
            total: { type: integer }
            pending: { type: integer }
            failed: { type: integer }
            pct: { type: number }
            running: { type: boolean }
            ratePerHour: { type: [number, 'null'], description: tracks analysed in the last hour }
            etaS: { type: [number, 'null'], description: estimated seconds to finish at the recent rate }
        lyrics:
          type: object
          properties:
            lrclibEnabled: { type: boolean }
            cached: { type: integer }
            found: { type: integer }
            notFound: { type: integer }
        jobs: { type: array, items: { $ref: '#/components/schemas/JobStatus' } }
    LibraryHealth:
      type: object
      properties:
        tracks: { type: integer }
        missing: { type: integer }
        duplicateGroups: { type: integer }
        missingTags: { type: integer }
        missingArt: { type: integer }
        unanalysed: { type: integer }
        orphanedCache: { type: object, properties: { files: { type: integer }, bytes: { type: integer } } }
        backups: { type: object, properties: { count: { type: integer }, bytes: { type: integer } } }
    CacheReport:
      type: object
      properties:
        files: { type: integer }
        bytes: { type: integer }
        byKind: { type: object, additionalProperties: { type: object, properties: { files: { type: integer }, bytes: { type: integer } } }, description: 'art, opus' }
    ServerHealth:
      type: object
      properties:
        version: { type: string }
        serverId: { type: string }
        startedAt: { type: string, format: date-time }
        uptimeS: { type: number }
        python: { type: string }
        sqlite: { type: string }
        cpu: { type: object, properties: { cores: { type: integer }, percent: { type: [number, 'null'] }, load1: { type: [number, 'null'] }, load5: { type: [number, 'null'] }, load15: { type: [number, 'null'] } } }
        memory: { type: object, properties: { totalBytes: { type: [integer, 'null'] }, availableBytes: { type: [integer, 'null'] }, processRssBytes: { type: [integer, 'null'] } } }
        disks:
          type: object
          description: '"data" (data volume) and "library" (music)'
          additionalProperties: { type: object, properties: { path: { type: string }, totalBytes: { type: integer }, freeBytes: { type: integer } } }
        dataDirBytes: { type: integer, description: size of everything in the data volume }
        databaseBytes: { type: integer }
        opusCache: { type: object, properties: { files: { type: integer }, bytes: { type: integer }, limitBytes: { type: integer } } }
        artCacheBytes: { type: integer }
    LogRecord:
      type: object
      properties:
        seq: { type: integer }
        at: { type: string, format: date-time }
        level: { type: string }
        logger: { type: string }
        message: { type: string }
    Backup:
      type: object
      properties:
        name: { type: string }
        kind: { type: string, enum: [manual, migration, prune] }
        bytes: { type: integer }
        createdAt: { type: string, format: date-time }
    ServerSettingValues:
      type: object
      description: Any subset; null removes an override.
      properties:
        serverName: { type: [string, 'null'], maxLength: 60 }
        lanUrl: { type: [string, 'null'], description: 'public LAN address incl. port, e.g. https://192.168.68.2:8443 (QR, /server-info)' }
        tunnelUrl: { type: [string, 'null'], description: 'https://host[:port][/path]; "" disables the tunnel address' }
        timezone: { type: [string, 'null'], description: IANA zone, e.g. Australia/Sydney }
        opusCacheGb: { type: [number, 'null'], minimum: 0.5, maximum: 10000 }
        lrclibEnabled: { type: [boolean, 'null'] }
    ServerSettings:
      type: object
      properties:
        values: { $ref: '#/components/schemas/ServerSettingValues', description: effective values }
        overrides: { type: object, description: 'only the keys set in the database' }
        fromConfig: { type: object, description: 'the config.toml values (what removing an override returns to)' }
    BugReportIn:
      type: object
      required: [logs]
      properties:
        description: { type: [string, 'null'], maxLength: 5000 }
        appVersion: { type: [string, 'null'], maxLength: 50 }
        platform: { type: [string, 'null'], maxLength: 100, description: 'e.g. "Android 15 · Pixel 8"' }
        logs: { type: string, description: app log text }
        crash: { type: [string, 'null'], description: crash dump / stack trace }
        extra: { type: [object, 'null'], description: free-form diagnostic fields }
    BugReportSummary:
      type: object
      properties:
        id: { type: string }
        user: { type: object, properties: { id: { type: string }, username: { type: string } } }
        deviceId: { type: [string, 'null'] }
        deviceName: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        appVersion: { type: [string, 'null'] }
        platform: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        hasCrash: { type: boolean }
        bytes: { type: integer }
        expiresAt: { type: string, format: date-time }
    BugReport:
      allOf:
        - $ref: '#/components/schemas/BugReportSummary'
        - type: object
          properties:
            logs: { type: string }
            crash: { type: [string, 'null'] }
            extra: { type: [object, 'null'] }
    ShelfFeed:
      type: object
      required: [shelves]
      properties:
        shelves: { type: array, items: { $ref: '#/components/schemas/Shelf' } }
    Shelf:
      type: object
      description: A typed, generically renderable row of items. Unknown kinds/types must be skipped by clients.
      required: [id, kind, title, items]
      properties:
        id: { type: string, description: 'stable id for ordering/hiding (e.g. "recently_played", "byp:album:<id>")' }
        kind: { type: string, enum: [start_radio, devices, recently_played, continue_listening, pinned, mixes, radio, because_you_played, release_radar, suggestions, to_get, blends, wrapped] }
        title: { type: string }
        subtitle: { type: [string, 'null'] }
        layout: { type: string, enum: [button, row, grid2], description: 'hint: grid2 = 2-row quick-pick grid (Recently played)' }
        items: { type: array, items: { $ref: '#/components/schemas/ShelfItem' } }
    ShelfItem:
      type: object
      description: |
        Generic card. `type` says what tapping it does; the matching optional object carries the details.
        `artUrl` is RELATIVE TO THE API BASE (/api/v1/), e.g. "art/<albumId>" or "catalog/<id>/cover"; null = no art.
      required: [type, id, title]
      properties:
        type: { type: string, enum: [track, album, artist, playlist, mix, radio, queue, device, catalog, suggestion, toget, smart_list, genre, folder] }
        id: { type: string }
        title: { type: string }
        subtitle: { type: [string, 'null'] }
        artUrl: { type: [string, 'null'] }
        track: { $ref: '#/components/schemas/Track' }
        album: { $ref: '#/components/schemas/Album' }
        artist: { $ref: '#/components/schemas/Artist' }
        playlist: { $ref: '#/components/schemas/Playlist' }
        queue: { $ref: '#/components/schemas/Queue' }
        mix: { type: object, properties: { kind: { type: string }, trackCount: { type: integer }, durationS: { type: number } } }
        seed: { $ref: '#/components/schemas/RadioSeed' }
        device:
          type: object
          properties:
            kind: { $ref: '#/components/schemas/DeviceKind' }
            canPlay: { type: boolean }
            isActive: { type: boolean }
            playing: { type: boolean }
            nowPlaying: { oneOf: [ { $ref: '#/components/schemas/Track' }, { type: 'null' } ] }
        progress:
          type: object
          description: continue_listening — where you left off
          properties:
            index: { type: integer }
            count: { type: integer }
            positionMs: { type: integer }
            queueId: { type: [string, 'null'] }
        catalog: { $ref: '#/components/schemas/CatalogItem' }
        suggestion: { $ref: '#/components/schemas/Suggestion' }
        toget: { $ref: '#/components/schemas/ToGetItem' }
        playedAt: { type: [string, 'null'], format: date-time }
    PinType:
      type: string
      enum: [album, artist, playlist, mix, queue, smart_list, genre, folder]
    RadioSeed:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [random, track, artist, album, playlist] }
        id: { type: [string, 'null'], description: required unless type=random }
        title: { type: [string, 'null'], description: set by the server in responses }
    SearchResults:
      type: object
      required: [query, top, tracks, albums, artists, playlists, queues, catalog]
      properties:
        query: { type: string }
        top: { oneOf: [ { $ref: '#/components/schemas/ShelfItem' }, { type: 'null' } ], description: best single match (library first, else catalogue) }
        tracks: { type: array, items: { $ref: '#/components/schemas/Track' } }
        albums: { type: array, items: { $ref: '#/components/schemas/Album' } }
        artists: { type: array, items: { $ref: '#/components/schemas/Artist' } }
        playlists: { type: array, items: { $ref: '#/components/schemas/Playlist' } }
        queues: { type: array, items: { $ref: '#/components/schemas/Queue' } }
        catalog: { type: array, items: { $ref: '#/components/schemas/CatalogItem' }, description: '"Not in your library" — owned items are filtered out unless scope=catalog' }
        catalogError: { type: [string, 'null'] }
    CatalogItem:
      type: object
      description: |
        Music from the online catalogue. `id` is opaque (e.g. "dz:album:302127", "dz:track:3135556",
        "dz:artist:27", "mb:rg:<mbid>"). `owned` = matched to the library by MBID, else by normalised names.
      required: [id, type, title, owned, hasPreview, links]
      properties:
        id: { type: string }
        type: { type: string, enum: [album, track, artist] }
        title: { type: string }
        artist: { type: [string, 'null'] }
        album: { type: [string, 'null'], description: for tracks }
        year: { type: [integer, 'null'] }
        durationS: { type: [number, 'null'] }
        mbid: { type: [string, 'null'] }
        artUrl: { type: [string, 'null'], description: 'relative to the API base, "catalog/<id>/cover"' }
        hasPreview: { type: boolean, description: 'GET catalog/<id>/preview plays a 30 s sample' }
        owned: { type: boolean }
        ownedId: { type: [string, 'null'], description: the library album/track/artist id when owned }
        toGet: { oneOf: [ { type: object, properties: { id: { type: string }, status: { type: string } } }, { type: 'null' } ] }
        links: { type: array, items: { type: object, properties: { name: { type: string }, url: { type: string } } }, description: buy/search links (Bandcamp, Qobuz) }
    ToGetItem:
      type: object
      required: [id, type, title, artist, status, createdAt, links]
      properties:
        id: { type: string }
        type: { type: string, enum: [album, track] }
        title: { type: string }
        artist: { type: string }
        year: { type: [integer, 'null'] }
        mbid: { type: [string, 'null'] }
        catalogId: { type: [string, 'null'] }
        artUrl: { type: [string, 'null'] }
        hasPreview: { type: boolean }
        note: { type: [string, 'null'] }
        status: { type: string, enum: [want, got, dismissed] }
        source: { type: string, enum: [search, suggestion, manual] }
        suggestionId: { type: [string, 'null'] }
        ownedId: { type: [string, 'null'], description: library album/track id once got by a scan }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        gotAt: { type: [string, 'null'], format: date-time }
        links: { type: array, items: { type: object, properties: { name: { type: string }, url: { type: string } } } }
    DeviceKind:
      type: string
      enum: [android, web, desktop, watch, other]
    Session:
      type: object
      required: [userId, username, isAdmin, deviceId, deviceToken]
      properties:
        userId: { type: string }
        username: { type: string }
        isAdmin: { type: boolean }
        deviceId: { type: string }
        deviceToken: { type: string }
    ServerInfo:
      type: object
      required: [serverId, name, version, lanUrl, registration]
      properties:
        serverId: { type: string }
        name: { type: string }
        version: { type: string }
        lanUrl: { type: string }
        tunnelUrl: { type: [string, 'null'] }
        certSha256: { type: [string, 'null'], description: LAN certificate SHA-256 (DER), colon-separated upper-case hex }
        registration: { type: string, enum: [invite] }
    User:
      type: object
      required: [id, username, isAdmin, createdAt]
      properties:
        id: { type: string }
        username: { type: string }
        isAdmin: { type: boolean }
        createdAt: { type: string, format: date-time }
        lastLogin: { type: [string, 'null'], format: date-time }
    AdminUser:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [disabled, deviceCount]
          properties:
            disabled: { type: boolean }
            deviceCount: { type: integer, description: active (non-revoked) devices }
            lastActivity: { type: [string, 'null'], format: date-time, description: 'v4: latest of last login, device last seen, last event' }
    Device:
      type: object
      required: [id, name, kind, createdAt, online, current]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { $ref: '#/components/schemas/DeviceKind' }
        appVersion: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        lastSeen: { type: [string, 'null'], format: date-time }
        online: { type: boolean, description: connected to /connect right now }
        current: { type: boolean, description: the device making this request }
    Invite:
      type: object
      required: [code, url, createdAt, expiresAt, createdBy]
      properties:
        code: { type: string }
        url: { type: string }
        note: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        createdBy: { type: string, description: username }
        usedBy: { type: [string, 'null'], description: username }
        usedAt: { type: [string, 'null'], format: date-time }
    TrackInfo:
      allOf:
        - $ref: '#/components/schemas/Track'
        - type: object
          properties:
            fileName: { type: string }
            folder: { type: string, description: relative to the library root }
            albumArtist: { type: [string, 'null'] }
            composer: { type: [string, 'null'] }
            lyricist: { type: [string, 'null'] }
            comment: { type: [string, 'null'] }
            codec: { type: [string, 'null'], description: 'e.g. FLAC, MP3, AAC, Opus, Vorbis' }
            bitrateKbps: { type: [integer, 'null'] }
            sampleRate: { type: [integer, 'null'], description: Hz }
            bitsPerSample: { type: [integer, 'null'] }
            channels: { type: [integer, 'null'] }
            fileBytes: { type: integer }
            addedAt: { type: string, format: date-time }
            playCount: { type: integer, description: the caller's }
            skipCount: { type: integer }
            lastPlayed: { type: [string, 'null'], format: date-time }
    Playlist:
      type: object
      required: [id, name, createdAt, updatedAt, trackCount, durationS]
      properties:
        id: { type: string }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        trackCount: { type: integer }
        durationS: { type: number }
    PlaylistDetail:
      allOf:
        - $ref: '#/components/schemas/Playlist'
        - type: object
          required: [tracks]
          properties:
            tracks: { type: array, items: { $ref: '#/components/schemas/Track' }, description: 'in order; array index = position. Tracks whose file is gone stay listed with missing=true.' }
    Queue:
      type: object
      required: [id, name, slot, currentIndex, positionMs, trackCount, durationS, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        slot: { type: integer, minimum: 1, maximum: 20, description: 'display number, as in "20. Search: conver"' }
        currentIndex: { type: integer }
        positionMs: { type: integer }
        trackCount: { type: integer }
        durationS: { type: number }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        source: { oneOf: [ { $ref: '#/components/schemas/QueueSource' }, { type: 'null' } ] }
        radio: { oneOf: [ { $ref: '#/components/schemas/RadioSeed' }, { type: 'null' } ], description: 'set on radio queues (POST /radio)' }
    QueueSource:
      type: object
      description: What a queue was started from; drives Home's Recently played / Continue listening.
      required: [type]
      properties:
        type: { type: string, enum: [album, artist, playlist, mix, radio, genre, folder, smart_list, search, other] }
        id: { type: [string, 'null'] }
    QueueDetail:
      allOf:
        - $ref: '#/components/schemas/Queue'
        - type: object
          required: [tracks]
          properties:
            tracks: { type: array, items: { $ref: '#/components/schemas/Track' }, description: 'array index = position; missing files stay listed with missing=true' }
    Move:
      type: object
      required: [from, to]
      properties:
        from: { type: integer, minimum: 0 }
        to: { type: integer, minimum: 0, description: the moved item's index after the move }
    PlaybackState:
      type: object
      description: Connect playback state (docs/v2.md §5). `rev` is set by the server and increments on every change.
      properties:
        activeDeviceId: { type: [string, 'null'] }
        queueId: { type: [string, 'null'] }
        index: { type: integer }
        trackId: { type: [string, 'null'] }
        positionMs: { type: integer }
        positionAt: { type: string, format: date-time, description: when positionMs was true; extrapolate while playing }
        playing: { type: boolean }
        volume: { type: number, minimum: 0, maximum: 1 }
        shuffle: { type: boolean }
        repeat: { type: string, enum: ['off', all, one] }
        speed: { type: number }
        rev: { type: integer }
    ConnectDevice:
      type: object
      required: [id, name, kind, canPlay, online, isActive]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { $ref: '#/components/schemas/DeviceKind' }
        canPlay: { type: boolean }
        online: { type: boolean }
        isActive: { type: boolean }
    UserSettings:
      type: object
      required: [settings]
      properties:
        settings: { type: object, additionalProperties: true, description: 'key → JSON value' }
    DataSummary:
      type: object
      required: [events, signals]
      properties:
        events:
          type: object
          properties:
            count: { type: integer }
            withContext: { type: integer }
            first: { type: [string, 'null'], format: date-time }
            last: { type: [string, 'null'], format: date-time }
        signals:
          type: object
          description: 'per signal name (listening, output, device, motion, location, weather, search, time, health)'
          additionalProperties:
            type: object
            properties:
              enabled: { type: boolean, description: the user-level switch }
              fields: { type: array, items: { type: string } }
              count: { type: integer, description: events carrying at least one of these fields }
              first: { type: [string, 'null'], format: date-time }
              last: { type: [string, 'null'], format: date-time }
    EventContext:
      type: object
      description: |
        Optional listening context (docs/v2.md §10). Clients include only fields whose switch is on; the server
        drops fields whose switch is off (user setting `context.<signal>`, or a `device.<deviceId>.context.<signal>`
        override) and fields it doesn't know, and fills `weather` itself from `geohash5` when `context.weather` is
        on (geohash5 is only stored when `context.location` is on). Signals → fields: listening (seeks,
        volumeChanges, repeatOfPrevious, addedFrom, sessionId, sessionPosition), output (output), device
        (deviceKind, network, charging, batteryPct, screenOn), motion (motion, cadenceSpm), location (place,
        geohash5), weather (weather), search (searchQuery), time (localHour, weekday, holiday), health
        (heartRate, workout).
      additionalProperties: false
      properties:
        seeks: { type: array, items: { type: object, properties: { fromMs: { type: integer }, toMs: { type: integer } } } }
        volumeChanges: { type: array, items: { type: object, properties: { atMs: { type: integer }, volume: { type: number } } } }
        repeatOfPrevious: { type: boolean }
        addedFrom: { type: string, description: 'search, queue, mix, playlist, album, artist, folder, …' }
        sessionId: { type: string }
        sessionPosition: { type: integer }
        output: { type: string, description: 'speaker | wired | bluetooth:<device name> | cast | car' }
        deviceKind: { type: string }
        network: { type: string, enum: [wifi, cellular, ethernet, none] }
        charging: { type: boolean }
        batteryPct: { type: integer }
        screenOn: { type: boolean }
        motion: { type: string, enum: [still, walking, running, vehicle] }
        cadenceSpm: { type: number }
        place: { type: string, description: 'user-named cluster label: home, work, gym, place-3' }
        geohash5: { type: string, minLength: 5, maxLength: 5 }
        weather: { type: object, description: 'set by the server', properties: { condition: { type: string }, tempC: { type: number }, code: { type: integer } } }
        searchQuery: { type: string }
        localHour: { type: integer, minimum: 0, maximum: 23 }
        weekday: { type: integer, minimum: 1, maximum: 7, description: ISO weekday, 1 = Monday }
        holiday: { type: [string, 'null'] }
        heartRate: { type: number }
        workout: { type: string }
    Artist:
      type: object
      required: [id, name, albumCount]
      properties:
        id: { type: string }
        name: { type: string }
        albumCount: { type: integer }
        mbid: { type: [string, 'null'] }
    Album:
      type: object
      required: [id, title, artistId, artist, trackCount]
      properties:
        id: { type: string }
        title: { type: string }
        artistId: { type: string }
        artist: { type: string }
        year: { type: [integer, 'null'] }
        trackCount: { type: integer }
        durationS: { type: number }
        hasArt: { type: boolean }
        mbid: { type: [string, 'null'] }
    Track:
      type: object
      required: [id, title, artistId, artist, albumId, album, durationS, starred]
      properties:
        id: { type: string }
        title: { type: string }
        artistId: { type: string }
        artist: { type: string }
        albumId: { type: string }
        album: { type: string }
        trackNo: { type: [integer, 'null'] }
        discNo: { type: [integer, 'null'] }
        year: { type: [integer, 'null'] }
        genre: { type: [string, 'null'] }
        durationS: { type: number }
        flacBytes: { type: integer, description: size of the original file }
        starred: { type: boolean }
        rating: { type: [integer, 'null'], minimum: 1, maximum: 5, description: the caller's }
        missing: { type: boolean, description: 'only present (true) in playlists/queues when the file is gone' }
    Lyrics:
      type: object
      required: [trackId, synced, source, lines, text]
      properties:
        trackId: { type: string }
        synced: { type: boolean, description: 'true when every line has a timeMs (LRC timestamps)' }
        source: { type: string, enum: [user, embedded, lrc_file, lrclib] }
        sources: { type: array, items: { type: string, enum: [user, embedded, lrc_file, lrclib] }, description: 'every source that has lyrics for this track (for the source dropdown)' }
        canEdit: { type: boolean, description: 'always true in v2: the caller may PUT their own lyrics' }
        lines:
          type: array
          description: In display order. Synced lines are sorted by timeMs; a line repeated at several timestamps appears once per timestamp.
          items:
            type: object
            required: [text]
            properties:
              timeMs: { type: [integer, 'null'], description: 'start time in ms (LRC offset tag already applied); null when unsynced' }
              text: { type: string, description: 'may be empty for instrumental gaps' }
        text: { type: string, description: 'plain lyrics without timestamps, one line per lyric line' }
    MixTrack:
      type: object
      required: [track, reason]
      properties:
        track: { $ref: '#/components/schemas/Track' }
        reason: { type: string, description: short "why this song" line }
    Mix:
      type: object
      required: [id, kind, title, createdAt, tracks]
      properties:
        id: { type: string }
        kind: { type: string, enum: [daily, morning, evening, deep_cuts, more_like, context], description: 'context = listening-context mixes (Workout, Drive, Late night, At <place>; docs/v2.md §10)' }
        title: { type: string }
        createdAt: { type: string, format: date-time }
        durationS: { type: number }
        tracks: { type: array, items: { $ref: '#/components/schemas/MixTrack' } }
    SyncManifest:
      type: object
      required: [generatedAt, items]
      properties:
        generatedAt: { type: string, format: date-time }
        items:
          type: array
          items:
            type: object
            required: [trackId, format, why]
            properties:
              trackId: { type: string }
              format: { type: string, enum: [opus, flac] }
              why: { type: string, enum: [mix, favourite] }
              mixIds: { type: array, items: { type: string } }
              durationS: { type: number }
              bytes: { type: integer, description: size of the file /stream will return for this format }
              bytesExact:
                type: boolean
                description: |
                  true = `bytes` is exact (FLAC, or Opus already in the transcode cache). false = estimate
                  from duration x bitrate; the server pre-transcodes manifest tracks after the nightly run,
                  so by sync time Opus sizes are normally exact.
    Event:
      type: object
      required: [id, type, trackId, at]
      properties:
        id: { type: string, description: client-generated UUID, used for idempotency }
        type:
          type: string
          enum: [play, skip, star, unstar, rate, thumb_up, thumb_down, thumb_clear]
          description: thumb_clear removes an earlier thumb_up or thumb_down (and unblocks the track).
        trackId: { type: string }
        at: { type: string, format: date-time }
        positionS: { type: [number, 'null'], description: playback position when the event happened (skip second) }
        durationS: { type: [number, 'null'], description: track length }
        source: { type: [string, 'null'], enum: [mix, library, favourites, more_like, search, null] }
        mixId: { type: [string, 'null'] }
        rating: { type: [integer, 'null'], minimum: 1, maximum: 5 }
        offline: { type: boolean, default: false, description: true if recorded without a connection and uploaded later }
        context: { oneOf: [ { $ref: '#/components/schemas/EventContext' }, { type: 'null' } ] }
    Suggestion:
      type: object
      required: [id, artist, album, reason, status]
      properties:
        id: { type: string }
        artist: { type: string }
        album: { type: string }
        year: { type: [integer, 'null'] }
        artistMbid: { type: [string, 'null'] }
        releaseGroupMbid: { type: [string, 'null'] }
        hasCover: { type: boolean, description: 'if true, fetch GET /suggestions/{id}/cover' }
        hasPreview: { type: boolean, description: 'if true, play GET /suggestions/{id}/preview' }
        coverUrl: { type: [string, 'null'], description: 'upstream source used by the server; the app must not fetch it' }
        previewUrl: { type: [string, 'null'], description: 'upstream source used by the server; the app must not fetch it' }
        buyLinks: { type: array, items: { type: object, properties: { name: { type: string }, url: { type: string } } } }
        reason: { type: string }
        status: { type: string, enum: [new, want, not_interested, have] }
        createdAt: { type: string, format: date-time }
