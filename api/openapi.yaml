        title: { type: string }
        author: { type: [string, 'null'] }
        feedUrl: { type: string }
        imageUrl: { type: [string, 'null'], description: remote URL (directory artwork) }
        explicit: { type: boolean }
        genre: { type: [string, 'null'] }
