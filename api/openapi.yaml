    EpisodeDetail:
      allOf:
        - $ref: '#/components/schemas/Episode'
        - type: object
          properties:
            description: { type: [string, 'null'], description: 'HTML from the feed (sanitise before rendering)' }
            chapters: { type: array, items: { $ref: '#/components/schemas/Chapter' } }
