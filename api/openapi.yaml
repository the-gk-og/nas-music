        summary: { type: [string, 'null'], description: plain text, short }
        link: { type: [string, 'null'] }
        language: { type: [string, 'null'] }
        explicit: { type: boolean }
        hasImage: { type: boolean, description: 'cover at art/podcast/{id}' }
        lastPolledAt: { type: [string, 'null'] }
        lastError: { type: [string, 'null'] }
        serverKeepLast: { type: [integer, 'null'] }
        subscribed: { type: boolean }
        subscribedAt: { type: [string, 'null'] }
        speed: { type: number }
        skipSilence: { type: boolean }
        autoDownload: { type: boolean }
