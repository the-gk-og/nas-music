# OPTIONAL alternative to the automation in homebeat_voice.yaml: Home Assistant recognises the intent and slots
# itself, then intent_script (homebeat_intents.yaml) sends them to Homebeat. Use ONE of the two approaches.
# Copy to <config>/custom_sentences/en/homebeat.yaml.
language: en
intents:
  NasPlay:
    data:
      - sentences:
          - "(play|put on|listen to|shuffle) {query}"
          - "start {query} radio"
  NasPause:
    data:
      - sentences:
          - "(pause|stop) [the] (music|song|track)"
  NasResume:
    data:
      - sentences:
          - "(resume|unpause|continue) [the] (music|song)"
  NasNext:
    data:
      - sentences:
          - "(skip|next song|next track|skip [this] (song|track))"
  NasPrevious:
    data:
      - sentences:
          - "(previous|last) (song|track)"
  NasVolume:
    data:
      - sentences:
          - "[set] [the] music volume to {level} [percent]"
  NasNowPlaying:
    data:
      - sentences:
          - "(what's|what is) playing"
          - "what (song|track) is (this|that|playing)"
  NasAddToPlaylist:
    data:
      - sentences:
          - "(add|save) (this|that|this song|this track) to [my] [the] {playlist} [playlist]"
lists:
  query:
    wildcard: true
  playlist:
    wildcard: true
  level:
    range:
      from: 0
      to: 100
