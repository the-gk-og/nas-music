# OPTIONAL alternative (goes with custom_sentences/en/nasmusic.yaml): copy to <config>/packages/ next to
# nasmusic_voice.yaml and DELETE the `automation:` block from nasmusic_voice.yaml so sentences aren't handled twice.
# HA sends its recognised intent + slots; nas-music answers with the sentence to speak.
intent_script:
  NasPlay:
    action:
      - action: rest_command.nasmusic_voice
        data:
          intent: NasPlay
          slots: { query: "{{ query }}" }
        response_variable: r
        continue_on_error: true
      - stop: done
        response_variable: r
    speech: &say
      text: >-
        {{ action_response.content.speech if action_response is defined and action_response.status == 200
           and action_response.content is mapping else "I couldn't reach nas-music." }}
  NasPause:
    action:
      - action: rest_command.nasmusic_voice
        data: { intent: NasPause }
        response_variable: r
        continue_on_error: true
      - stop: done
        response_variable: r
    speech: *say
  NasResume:
    action:
      - action: rest_command.nasmusic_voice
        data: { intent: NasResume }
        response_variable: r
        continue_on_error: true
      - stop: done
        response_variable: r
    speech: *say
  NasNext:
    action:
      - action: rest_command.nasmusic_voice
        data: { intent: NasNext }
        response_variable: r
        continue_on_error: true
      - stop: done
        response_variable: r
    speech: *say
  NasPrevious:
    action:
      - action: rest_command.nasmusic_voice
        data: { intent: NasPrevious }
        response_variable: r
        continue_on_error: true
      - stop: done
        response_variable: r
    speech: *say
  NasVolume:
    action:
      - action: rest_command.nasmusic_voice
        data:
          intent: NasVolume
          slots: { volume_level: "{{ level }}" }
        response_variable: r
        continue_on_error: true
      - stop: done
        response_variable: r
    speech: *say
  NasNowPlaying:
    action:
      - action: rest_command.nasmusic_voice
        data: { intent: NasNowPlaying }
        response_variable: r
        continue_on_error: true
      - stop: done
        response_variable: r
    speech: *say
  NasAddToPlaylist:
    action:
      - action: rest_command.nasmusic_voice
        data:
          intent: NasAddToPlaylist
          slots: { playlist: "{{ playlist }}" }
        response_variable: r
        continue_on_error: true
      - stop: done
        response_variable: r
    speech: *say
