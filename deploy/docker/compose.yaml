# Homebeat server + web player for any Docker host: Synology, Unraid, QNAP, OpenMediaVault, TrueNAS, a plain
# Linux box. Step-by-step guide: deploy/docker/README.md.
#
#   cp .env.example .env      # then edit .env: at least MUSIC_DIR and LAN_HOST
#   docker compose up -d
#   docker compose logs server   # the first start prints the admin password
#
# Settings come from .env. On the FIRST start the server writes config.toml into the data folder from them;
# after that, change settings in config.toml (LAN_HOST, SERVER_NAME, ... in .env no longer apply).
# The project name appears only in .env (STACK_NAME, IMAGE) and the image's HOMEBEAT_* variables below.

name: ${STACK_NAME:-homebeat}

services:
  server:
    image: ${IMAGE:-ghcr.io/the-gk-og/homebeat:latest}
    # `docker compose build` builds the image from this repository instead of pulling it.
    build:
      context: ../..
      dockerfile: server/Dockerfile
      args:
        WITH_ANALYSIS: ${WITH_ANALYSIS:-1}   # 1 = Essentia audio analysis (better mixes); 0 = smaller image
    pull_policy: ${PULL_POLICY:-missing}
    user: "${PUID:-568}:${PGID:-568}"
    group_add:
      - "${MUSIC_GID:-568}"                  # a group that can read MUSIC_DIR, if the user can't
    restart: unless-stopped
    ports:
      - "${LAN_PORT:-8443}:8443"             # HTTPS for the apps and web player (self-signed cert, pinned at pairing)
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"  # plain HTTP, this machine only: for a reverse proxy or tunnel
      - "${CAST_PORT:-8090}:8090"            # speakers fetch signed media URLs here (plain HTTP, LAN only)
    environment:
      HOMEBEAT_CONFIG: /data/config.toml
      TZ: ${TIMEZONE:-Europe/London}
      # First start only (written into /data/config.toml):
      HOMEBEAT_LAN_HOST: ${LAN_HOST:?set LAN_HOST in .env to your NAS's LAN IP address}
      HOMEBEAT_LAN_PORT: ${LAN_PORT:-8443}
      HOMEBEAT_CAST_PORT: ${CAST_PORT:-8090}
      HOMEBEAT_SERVER_NAME: ${SERVER_NAME:-Home NAS}
      HOMEBEAT_TIMEZONE: ${TIMEZONE:-Europe/London}
      HOMEBEAT_ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      HOMEBEAT_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}   # empty = generate one and print it in the log
      HOMEBEAT_TUNNEL_URL: ${PUBLIC_URL:-}
      HOMEBEAT_OPUS_CACHE_GB: ${OPUS_CACHE_GB:-10}
      HOMEBEAT_UPLOAD_ROOT: ${UPLOAD_ROOT:-}         # "/uploads" once the uploads mount below is enabled
      HOMEBEAT_AUDIOBOOKS_ROOT: ${AUDIOBOOKS_ROOT:-} # "/audiobooks" once that mount is enabled
    volumes:
      - ${MUSIC_DIR:?set MUSIC_DIR in .env to your music folder}:/music:ro   # never written to
      - ${DATA_DIR:-server-data}:/data       # database, certificate, caches: back this up
      # Optional, remove the leading '#' (README "Uploads" / "Audiobooks"):
      # - ${UPLOADS_DIR}:/uploads            # SEPARATE writable folder for songs people upload
      # - ${AUDIOBOOKS_DIR}:/audiobooks:ro
      # - ${BACKUP_DIR}:/backup              # off-site backups on another disk/dataset (README "Backups")

  # Optional remote access through a Cloudflare Tunnel (README "Remote access"). Enabled by
  # COMPOSE_PROFILES=tunnel in .env. In Cloudflare, point the public hostname at http://server:8080
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - server

volumes:
  server-data:
