# Phase 1: Navidrome + Cloudflare Tunnel, to get streaming working while the custom server is built.
# Install on TrueNAS SCALE 24.10+: Apps -> Discover -> ⋮ -> "Install via YAML", paste this file with the
# placeholders below replaced (TrueNAS custom YAML apps don't read .env files).
#
# Replace before pasting:
#   /mnt/POOL/media/music     -> your music dataset (mounted read-only)
#   /mnt/POOL/apps/navidrome  -> an empty dataset for Navidrome's database
#   PASTE_TUNNEL_TOKEN_HERE   -> token from Cloudflare Zero Trust -> Networks -> Tunnels (see README)

services:
  navidrome:
    image: deluan/navidrome:latest   # pin to a specific version once it works, e.g. deluan/navidrome:0.5x.x
    container_name: navidrome
    user: "568:568"                  # TrueNAS 'apps' user; needs read access to the music dataset
    restart: unless-stopped
    ports:
      - "4533:4533"                  # LAN access: http://<NAS static IP>:4533
    environment:
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
      ND_SCANSCHEDULE: "1h"
      ND_LOGLEVEL: info
      ND_ENABLESHARING: "false"
      ND_DEFAULTDOWNSAMPLINGFORMAT: opus
    volumes:
      - /mnt/POOL/media/music:/music:ro
      # Optional audiobooks (config.toml: audiobooks_root = "/audiobooks"); read-only like the music.
      # - /mnt/NAS/Shared/audiobooks:/audiobooks:ro
      - /mnt/POOL/apps/navidrome:/data

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: PASTE_TUNNEL_TOKEN_HERE
    depends_on:
      - navidrome
