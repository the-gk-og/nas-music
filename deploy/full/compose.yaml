# Full stack (from Phase 2): the custom Homebeat server + Cloudflare Tunnel (+ optional Lidarr).
# Navidrome is removed at this point. Same install route as phase1 ("Install via YAML").
#
# Replace before pasting:
#   /mnt/POOL/media/music      -> music dataset (read-only for the server)
#   /mnt/POOL/apps/homebeat    -> server data: database, cert, Opus cache, models
#                                 (installed before the Homebeat rename? keep your existing apps/nasmusic path)
#   PASTE_TUNNEL_TOKEN_HERE    -> Cloudflare tunnel token
# In Cloudflare, point the public hostname (music.<your domain>) at:  http://homebeat:8080

services:
  homebeat:
    image: ghcr.io/the-gk-og/homebeat:latest   # built by GitHub Actions; pull it first (README: "Getting the server image")
    pull_policy: missing
    container_name: homebeat
    networks:
      default:
        # Old name from before the Homebeat rename, so an existing Caddyfile / tunnel hostname pointing at
        # http://nasmusic:8080 keeps working. (Drop this block if you switch to network_mode: host.)
        aliases: [nasmusic]
    user: "568:568"
    restart: unless-stopped
    ports:
      - "8443:8443"                  # LAN HTTPS (self-signed, pinned by the app). Port 8080 stays internal.
    environment:
      HOMEBEAT_CONFIG: /data/config.toml
    volumes:
      - /mnt/POOL/media/music:/music:ro
      # Optional audiobooks (config.toml: audiobooks_root = "/audiobooks"); read-only like the music.
      # - /mnt/NAS/Shared/audiobooks:/audiobooks:ro
      - /mnt/POOL/apps/homebeat:/data

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: PASTE_TUNNEL_TOKEN_HERE
    depends_on:
      - homebeat

  # Optional: files purchased albums into the library. Remove the leading '#' to enable.
  # lidarr:
  #   image: lscr.io/linuxserver/lidarr:latest
  #   container_name: lidarr
  #   restart: unless-stopped
  #   environment: { PUID: "568", PGID: "568", TZ: "Europe/London" }
  #   ports: ["8686:8686"]
  #   volumes:
  #     - /mnt/POOL/apps/lidarr:/config
  #     - /mnt/POOL/media/music:/music          # read-write: Lidarr moves files in
  #     - /mnt/POOL/media/music-import:/import  # drop purchased albums here
