# nas-music for a Docker host managed with Dockhand (or any Compose UI) where cloudflared already
# runs on host networking with a remotely managed tunnel.
#
# - Config lives in the data volume at /data/config.toml (see "First install" below), NOT in a Compose
#   `configs:` block: inline configs are copied into the container only when Compose creates it, so a
#   container-level update/recreate (Dockhand's per-container update, Watchtower, ...) silently drops it.
# - Data lives in a named volume; Docker seeds it from the image, so it is owned by uid 568.
# - Public access: Caddy + frpc below relay HTTPS through a friend's server (deploy/relay/README.md). They
#   need /data/relay/{frpc.toml,Caddyfile}; leave both services out until those exist. (The older Cloudflare
#   tunnel option: public hostname -> http://localhost:8080, bound to 127.0.0.1 only.)
#
# First install (once): deploy the stack, then open a shell in the container and create the config as
# the app user, e.g.
#   setpriv --reuid 568 --regid 568 --groups 568 sh -c 'umask 077; cat > /data/config.toml' <<'EOF'
#   library_root = "/music"
#   data_dir = "/data"
#   lan_host = "192.168.68.2"
#   https_port = 8443
#   http_port = 8080
#   server_name = "Home NAS"
#   tunnel_url = "https://music.example.com"
#   admin_password_hash = "<output of: nasmusic hash-password>"
#   timezone = "Europe/London"
#   opus_cache_gb = 10
#   EOF
# then restart the container. Music path, LAN IP and tunnel URL above are examples; change them.

services:
  nasmusic:
    image: ghcr.io/the-gk-og/nasmusic:latest
    container_name: nasmusic
    user: "568:568"
    group_add:
      - "3000"                 # group that owns the music folder (770 perms); read-only access via group
    restart: unless-stopped
    ports:
      - "8443:8443"              # LAN HTTPS for the app (self-signed cert, pinned at pairing)
      - "127.0.0.1:8080:8080"    # plain HTTP for the host-network cloudflared only
      - "8090:8090"              # casting: speakers fetch signed media URLs (plain HTTP, LAN only).
                                 # Speaker discovery needs network_mode: host; see deploy/README.md "Casting".
    environment:
      NASMUSIC_CONFIG: /data/config.toml
    volumes:
      - /mnt/NAS/Shared/music:/music:ro
      # Optional audiobooks (config.toml: audiobooks_root = "/audiobooks"); read-only like the music.
      # - /mnt/NAS/Shared/audiobooks:/audiobooks:ro
      - nasmusic-data:/data

  # Public HTTPS via the friend's relay (deploy/relay). Caddy gets the Let's Encrypt certificate.
  caddy:
    image: caddy:2.11.9
    container_name: nasmusic-caddy
    restart: unless-stopped
    command: ["caddy", "run", "--config", "/relay/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      - type: volume             # only the relay/ folder of the data volume, read-only
        source: nasmusic-data
        target: /relay
        read_only: true
        volume:
          subpath: relay
      - caddy-data:/data         # certificates (keep!)
      - caddy-config:/config
    depends_on:
      - nasmusic

  frpc:
    image: fatedier/frpc:v0.71.1
    container_name: nasmusic-frpc
    restart: unless-stopped
    command: ["-c", "/relay/frpc.toml"]
    volumes:
      - type: volume
        source: nasmusic-data
        target: /relay
        read_only: true
        volume:
          subpath: relay
    depends_on:
      - caddy

volumes:
  nasmusic-data:
  caddy-data:
  caddy-config:
